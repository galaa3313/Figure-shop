  catch (e) { if (my === VIEW) $("hlist").innerHTML = `<p class="msg">Түүх уншиж чадсангүй. Supabase дээр <b>finn-history.sql</b>-ийг ажиллуулсан эсэхээ шалгана уу.</p>`; return; }

  $("hlist").innerHTML = j.rows.length ? `<div class="hl">${j.rows.map(l => `<div class="he a-${esc(l.action)}">

      ${l.action === "delete" && (l.entity === "order" || l.entity === "product") ? `<button class="btn" data-rs="${l.id}">Сэргээх</button>`
        // Хувилбар 30 хоног хадгалагдана: түүнээс хуучин бол буцаах товч гаргахгүй
        : l.detail && l.detail.snap && Date.now() - new Date(l.at) < 30 * 864e5 ? `<button class="btn rv" data-rs="${l.id}" title="Энэ засвар хийгдэхээс өмнөх байдал руу буцаана">↶ Өмнөх рүү буцаах</button>` : "<span></span>"}
    </div>`).join("")}</div><p class="mut" style="margin-top:10px">${j.rows.length} бичлэг${j.rows.length >= 500 ? " (эхний 500)" : ""}</p>`
    : `<p class="mut">Энэ хугацаанд бичлэг алга.</p>`;
  // Устгасныг сэргээх
  $("hlist").querySelectorAll("[data-rs]").forEach(b => b.onclick = async () => {

      await new Promise(z => setTimeout(z, 700));

// Supabase хариуны алдааг шидэнэ
const must = r => { if (r.error) throw r.error; return r.data; };
// Латин ID (кирилл нэрнээс): "30 хоногийн эхлэл" → "30-hogiin-ehlel"
const FTR = { а:"a",б:"b",в:"v",г:"g",д:"d",е:"e",ё:"yo",ж:"j",з:"z",и:"i",й:"i",к:"k",л:"l",м:"m",н:"n",о:"o",ө:"u",п:"p",р:"r",с:"s",т:"t",у:"u",ү:"u",ф:"f",х:"h",ц:"ts",ч:"ch",ш:"sh",щ:"sh",ъ:"",ы:"y",ь:"",э:"e",ю:"yu",я:"ya" };
const fslug = v => String(v).toLowerCase().split("").map(c => FTR[c] ?? c).join("").replace(/[^a-z0-9-]+/g, "-").replace(/^-+|-+$/g, "").replace(/-{2,}/g, "-").slice(0, 36);
// Маягтын нэг талбар
const ff = (id, label, v, type = "text", extra = "") => type === "textarea"
  ? `<label class="full">${label}<textarea id="${id}" rows="4" ${extra}>${esc(v ?? "")}</textarea></label>`
  : type === "check" ? `<label class="row" style="flex-direction:row;color:var(--ink)"><input type="checkbox" id="${id}" ${v ? "checked" : ""} style="width:auto"> ${label}</label>`
  : `<label>${label}<input id="${id}" type="${type}" value="${esc(v ?? "")}" ${extra}></label>`;
const fsel = (id, label, v, opts) => `<label>${label}<select id="${id}">${opts.map(o => { const [val, t] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(val)}" ${String(val) === String(v) ? "selected" : ""}>${esc(t)}</option>`; }).join("")}</select></label>`;
const fv = id => $(id).value.trim();
// Хадгалах товчийг түгжиж эргэлдэх тэмдэг харуулна
const fbusy = (b, on) => { b.disabled = on; if (on) { b.dataset.t = b.textContent; b.innerHTML = '<span class="spin"></span>Хадгалж байна…'; } else if (b.dataset.t) b.textContent = b.dataset.t; };

      await new Promise((ok, no) => new T.Upload(f, {

        headers: { AuthorizationSignature: c.signature, AuthorizationExpire: String(c.expire), LibraryId: c.libraryId, VideoId: c.videoId },
        metadata: { filetype: f.type || "video/mp4", title: fv("fl-title") || f.name },
        onProgress: (a, t) => { bar.firstElementChild.style.width = Math.round(a / t * 100) + "%"; $("fl-vst").textContent = `Оруулж байна… ${Math.round(a / t * 100)}%`; },
        onSuccess: ok, onError: no
      }).start());
      bunnyId = c.videoId;
      // Хуучин хичээл бол шууд хадгална, хуучин видеог Bunny-ээс устгана
      if (!isNew) { must(await sb.from("fit_lessons").update({ bunny_id: bunnyId }).eq("id", l.id)); if (old) api({ action: "delete", id: old }, "/api/fit-upload").catch(() => {}); toast("Видео орлоо ✓"); }
      else toast("Видео орлоо — одоо «Хадгалах» дарна уу");
      bar.hidden = true; watch(bunnyId);
    } catch (err) { bar.hidden = true; $("fl-vst").textContent = "Алдаа: " + (err.message === "not_configured" ? "Bunny тохиргоо (BUNNY_…) дутуу" : err.message || err); }
  };
  if ($("fl-vdel")) $("fl-vdel").onclick = async () => {
    if (!confirm("Энэ хичээлийн видеог хасах уу? Bunny-ээс бүр устгана.")) return;
    try { must(await sb.from("fit_lessons").update({ bunny_id: null }).eq("id", l.id)); await api({ action: "delete", id: bunnyId }, "/api/fit-upload").catch(() => {}); bunnyId = null; toast("Видео хаслаа"); showFit("less"); }
    catch (err) { toast("Алдаа: " + err.message); }
  };
  if (bunnyId) watch(bunnyId);
  $("flf").onsubmit = async e => {
    e.preventDefault();
    const ex = $("fl-ex").value.split("\n").map(s => s.trim()).filter(Boolean).slice(0, 40).map(s => { const [n, ...r] = s.split("|"); return { name: n.trim().slice(0, 80), sets: r.join("|").trim().slice(0, 80) }; });
    const vu = fv("fl-video");
    if (vu && !/^https:\/\//.test(vu)) return toast("Видео холбоос https://-ээр эхэлнэ");
    const row = { program_id: FIT_PROG, n: Number(fv("fl-n")), title: fv("fl-title"), minutes: Number(fv("fl-min")) || 20, body: $("fl-body").value.trim(),
      exercises: ex, products: [...document.querySelectorAll("[data-flp]:checked")].map(x => x.value), video_url: vu || null, free: $("fl-free").checked, active: $("fl-act").checked };
    // Bunny видео (шинэ хичээлд оруулсан бол)
    if (bunnyId) row.bunny_id = bunnyId;
    const b = $("flsave"); fbusy(b, true);
    const r = isNew ? await sb.from("fit_lessons").insert(row) : await sb.from("fit_lessons").update(row).eq("id", l.id);
    fbusy(b, false);
    if (r.error) return toast("Алдаа: " + (/duplicate/.test(r.error.message) ? "энэ дугаартай хичээл байна" : r.error.message));
    toast("Хадгаллаа"); $("fform").innerHTML = ""; showFit("less");
  };
  if ($("fldel")) $("fldel").onclick = async () => {
    if (!confirm(`«${l.title}» хичээлийг устгах уу?`)) return;
    const r = await sb.from("fit_lessons").delete().eq("id", l.id).select("id");
    if (r.error || !r.data || !r.data.length) return toast("Устгагдсангүй");
    if (l.bunny_id) api({ action: "delete", id: l.bunny_id }, "/api/fit-upload").catch(() => {});
    toast("Устгалаа"); $("fform").innerHTML = ""; showFit("less");
  };
  $("fform").scrollIntoView({ behavior: "smooth" });
}

// ----- 3) ҮНЭ ба ГИШҮҮНИЙ ХӨНГӨЛӨЛТ -----
async function fitPlans(my){
  const [plans, cfg] = await Promise.all([sb.from("fit_plans").select("*"), sb.from("fit_config").select("*").eq("id", 1).maybeSingle()]);
  const P = must(plans), C = must(cfg) || { member_disc: 5, vip_disc: 10 };
  if (my !== VIEW) return;
  const cell = (t, m) => { const x = P.find(p => p.tier === t && p.months === m); return `<input type="number" min="0" step="1000" data-pp="${t}:${m}" value="${x && x.active ? x.price : ""}" placeholder="—" style="max-width:120px">`; };
  $("fbody").innerHTML = `<form class="form" id="fplf"><h3 class="full" style="margin:0">Гишүүнчлэлийн үнэ (₮)</h3>
    <p class="full mut" style="margin:0;font-size:12.5px">Хоосон үлдээсэн хугацаа сайтад харагдахгүй. Нийт үнийг бичнэ (жишээ нь 3 сар = 54000).</p>
    <div class="full tbl"><table style="min-width:0"><thead><tr><th>Багц</th><th>1 сар</th><th>3 сар</th><th>6 сар</th><th>12 сар</th></tr></thead><tbody>
      <tr><td><b>Гишүүн</b></td>${[1, 3, 6, 12].map(m => `<td>${cell("member", m)}</td>`).join("")}</tr>
      <tr><td><b>VIP</b></td>${[1, 3, 6, 12].map(m => `<td>${cell("vip", m)}</td>`).join("")}</tr></tbody></table></div>
    <h3 class="full" style="margin:8px 0 0">Дэлгүүрийн хөнгөлөлт (%)</h3>
    ${ff("fc-m", "Гишүүн", C.member_disc, "number", 'min="0" max="50"')}${ff("fc-v", "VIP", C.vip_disc, "number", 'min="0" max="50"')}
    <div class="full"><button class="btn dark" type="submit" id="fplsave">Хадгалах</button></div></form>`;
  $("fplf").onsubmit = async e => {
    e.preventDefault();
    const b = $("fplsave"); fbusy(b, true);
    try {
      for (const inp of document.querySelectorAll("[data-pp]")) {
        const [tier, m] = inp.dataset.pp.split(":"), price = Number(inp.value), months = Number(m);
        const ex = P.find(p => p.tier === tier && p.months === months);
        if (price > 0) must(ex ? await sb.from("fit_plans").update({ price, active: true }).eq("id", ex.id) : await sb.from("fit_plans").insert({ tier, months, price, active: true }));
        else if (ex && ex.active) must(await sb.from("fit_plans").update({ active: false }).eq("id", ex.id));
      }
      must(await sb.from("fit_config").update({ member_disc: Number(fv("fc-m")) || 0, vip_disc: Number(fv("fc-v")) || 0 }).eq("id", 1));
      toast("Хадгаллаа"); showFit("plans");
    } catch (err) { fbusy(b, false); toast("Алдаа: " + err.message); }
  };
}

// ----- 4) ГИШҮҮД (жагсаалт, гараар олгох/сунгах, төлбөрүүд) -----
async function fitMembers(my){
  const [mem, pays] = await Promise.all([
    sb.from("fit_members").select("*").order("until", { ascending: false }).limit(500),
    sb.from("fit_payments").select("*").order("created_at", { ascending: false }).limit(30)
  ]);
  const M = must(mem), PY = must(pays);
  const ids = [...new Set([...M.map(m => m.user_id), ...PY.map(p => p.user_id)])];
  const prof = ids.length ? must(await sb.from("profiles").select("id,username,email").in("id", ids)) : [];
  if (my !== VIEW) return;
  const nm = id => { const p = prof.find(x => x.id === id); return p ? p.username : "?"; };
  const now = Date.now(), act = M.filter(m => new Date(m.until) > now);
  $("fbody").innerHTML = `<form class="form" id="fmf"><h3 class="full" style="margin:0">Гишүүнчлэл олгох / сунгах (гараар)</h3>
      ${ff("fm-u", "Хэрэглэгчийн нэвтрэх нэр", "", "text", 'required')}${fsel("fm-t", "Багц", "member", [["member", "Гишүүн"], ["vip", "VIP"]])}
      ${ff("fm-m", "Хэдэн сар", 1, "number", 'min="1" max="36"')}${ff("fm-note", "Тэмдэглэл (жишээ: бэлэг, бэлнээр төлсөн)", "", "text")}
      <div class="full"><button class="btn dark" type="submit" id="fmsave">Олгох</button></div></form>
    <div class="bar"><h3 style="margin:0">Гишүүд <small class="mut">(идэвхтэй ${act.length} / нийт ${M.length})</small></h3></div>
    <div class="tbl"><table><thead><tr><th>Хэрэглэгч</th><th>Багц</th><th>Хүртэл</th><th>Тэмдэглэл</th><th></th></tr></thead><tbody>
      ${M.map(m => `<tr><td><b>${esc(nm(m.user_id))}</b></td><td>${m.tier === "vip" ? "VIP" : "Гишүүн"}</td><td>${dt(m.until)} ${new Date(m.until) > now ? '<span class="tag ok">идэвхтэй</span>' : '<span class="tag no">дууссан</span>'}</td>
        <td><small>${esc(m.note || "")}</small></td><td>${new Date(m.until) > now ? `<button class="btn red" data-fmend="${m.user_id}">Зогсоох</button>` : ""}</td></tr>`).join("") || '<tr><td colspan="5">Гишүүн алга.</td></tr>'}</tbody></table></div>
    <div class="bar" style="margin-top:20px"><h3 style="margin:0">Сүүлийн төлбөрүүд</h3></div>
    <div class="tbl"><table><thead><tr><th>Код</th><th>Хэрэглэгч</th><th>Юу</th><th>Дүн</th><th>Төлөв</th></tr></thead><tbody>
      ${PY.map(p => `<tr><td><code>${esc(p.code)}</code><small>${dt(p.created_at)}</small></td><td>${esc(nm(p.user_id))}</td><td>${p.kind === "member" ? (p.tier === "vip" ? "VIP" : "Гишүүн") + " · " + p.months + " сар" : "Сорилт"}</td><td>${fmt(p.amount)}</td>
        <td>${p.status === "paid" ? '<span class="tag ok">Төлсөн</span>' : p.status === "pending" ? '<span class="tag">Хүлээгдэж байна</span>' : '<span class="tag no">Цуцалсан</span>'}</td></tr>`).join("") || '<tr><td colspan="5">Төлбөр алга.</td></tr>'}</tbody></table></div>`;
  // Гараар олгох: одоогийн хугацааны араас нэмнэ
  $("fmf").onsubmit = async e => {
    e.preventDefault();
    const b = $("fmsave"); fbusy(b, true);
    try {
      const u = must(await sb.from("profiles").select("id,username").eq("username", fv("fm-u").toLowerCase()).maybeSingle());
      if (!u) throw new Error("ийм нэртэй хэрэглэгч алга");
      const cur = M.find(m => m.user_id === u.id), base = cur && new Date(cur.until) > now ? new Date(cur.until) : new Date();
      base.setMonth(base.getMonth() + (Number(fv("fm-m")) || 1));
      if (!confirm(`«${u.username}»-д ${$("fm-t").value === "vip" ? "VIP" : "Гишүүн"} эрх ${dt(base)} хүртэл олгох уу?`)) { fbusy(b, false); return; }
      must(await sb.from("fit_members").upsert({ user_id: u.id, tier: $("fm-t").value, until: base.toISOString(), updated_at: new Date().toISOString(), note: fv("fm-note") || null }));
      toast("Олголоо"); showFit("mem");
    } catch (err) { fbusy(b, false); toast("Алдаа: " + err.message); }
  };
  // Гишүүнчлэлийг зогсоох (хугацааг одоо болгоно)
  $("fbody").querySelectorAll("[data-fmend]").forEach(b => b.onclick = async () => {
    if (!confirm(`«${nm(b.dataset.fmend)}»-ийн гишүүнчлэлийг одоо зогсоох уу?`)) return;
    const r = await sb.from("fit_members").update({ until: new Date().toISOString(), updated_at: new Date().toISOString() }).eq("user_id", b.dataset.fmend);
    if (r.error) return toast("Алдаа: " + r.error.message); toast("Зогсоолоо"); showFit("mem");
  });
}

async function fitNews(my){

  if (my !== VIEW) return;
  $("fbody").innerHTML = `<div class="bar"><span class="mut">${list.length} мэдээ</span><button class="btn dark" id="fnwnew" style="margin-left:auto">+ Шинэ мэдээ</button></div>
    <div class="tbl"><table><thead><tr><th>Гарчиг</th><th>Огноо</th><th>Төлөв</th><th></th></tr></thead><tbody>
    ${list.map(n => `<tr><td><b>${esc(n.title)}</b>${n.pinned ? '<small style="color:var(--red)">● Онцлох (дээр нь)</small>' : ""}</td><td>${dt(n.created_at)}</td>
      <td>${n.published ? '<span class="tag ok">Нийтлэгдсэн</span>' : '<span class="tag no">Ноорог</span>'}</td><td><button class="btn" data-fnwe="${n.id}">Засах</button></td></tr>`).join("") || '<tr><td colspan="4">Мэдээ алга. "+ Шинэ мэдээ" дарна уу.</td></tr>'}</tbody></table></div>`;

function fitNewsForm(n){
  const isNew = !n; n = n || { title: "", body: "", image: "", pinned: false, published: true };
  $("fform").innerHTML = `<form class="form" id="fnwf"><h3 class="full" style="margin:0">${isNew ? "Шинэ мэдээ" : "Мэдээ засах"}</h3>
    <label class="full">Гарчиг *<input id="fnw-t" required maxlength="160" value="${esc(n.title)}"></label>
    ${ff("fnw-b", "Агуулга", n.body, "textarea", 'maxlength="8000" rows="8"')}
    <label>Зураг<input type="file" id="fnw-file" accept="image/*"></label>
    <div class="row"><img id="fnw-img" src="${esc(n.image || "")}" alt="" style="max-width:220px;${n.image ? "" : "display:none"}"><button type="button" class="btn" id="fnw-clr" ${n.image ? "" : "hidden"}>Зураг хасах</button></div>
    <div class="full row">${ff("fnw-pin", "Онцлох (хамгийн дээр нь гарна)", n.pinned, "check")}${ff("fnw-pub", "Нийтлэх (арилгавал ноорог болж нуугдана)", n.published, "check")}</div>
    <div class="full row"><button class="btn dark" type="submit" id="fnwsave">Хадгалах</button><button class="btn" type="button" id="fnwx">Болих</button>
      ${isNew ? "" : `<a class="btn" href="/fit#news/${n.id}" target="_blank" rel="noopener">Сайтад харах ↗</a><button class="btn red" type="button" id="fnwdel" style="margin-left:auto">Устгах</button>`}</div></form>`;
  let image = n.image || "";
  // Зургийг шахаж хадгална
  $("fnw-file").onchange = async e => { const f = e.target.files[0]; if (!f) return; toast("Зураг оруулж байна…");
    try { image = await upload(f, "fit"); $("fnw-img").src = image; $("fnw-img").style.display = ""; $("fnw-clr").hidden = false; toast("Зураг орлоо"); } catch (err) { toast("Алдаа: " + err.message); } };
  $("fnw-clr").onclick = () => { image = ""; $("fnw-img").style.display = "none"; $("fnw-clr").hidden = true; };
  $("fnwx").onclick = () => { $("fform").innerHTML = ""; };
  $("fnwf").onsubmit = async e => {
    e.preventDefault();
    const row = { title: fv("fnw-t"), body: $("fnw-b").value.trim(), image: image || null, pinned: $("fnw-pin").checked, published: $("fnw-pub").checked, updated_at: new Date().toISOString() };
    const b = $("fnwsave"); fbusy(b, true);
    try {
      must(isNew ? await sb.from("fit_news").insert(row).select("id") : await sb.from("fit_news").update(row).eq("id", n.id).select("id"));
      toast("Хадгаллаа"); $("fform").innerHTML = ""; showFit("news");
    } catch (err) { fbusy(b, false); toast("Алдаа: " + err.message + (/fit_news|relation|schema/i.test(err.message) ? " — finn-fit-news.sql ажиллуулсан уу?" : "")); }
  };
  if ($("fnwdel")) $("fnwdel").onclick = async () => {
    if (!confirm(`«${n.title}» мэдээг устгах уу? Буцаах боломжгүй.\n\nТүр нуух бол "Нийтлэх"-ийг арилгана уу.`)) return;
    const r = await sb.from("fit_news").delete().eq("id", n.id).select("id");
    if (r.error || !r.data || !r.data.length) return toast("Устгагдсангүй" + (r.error ? ": " + r.error.message : ""));
    toast("Устгалаа"); $("fform").innerHTML = ""; showFit("news");
  };
  $("fform").scrollIntoView({ behavior: "smooth" });
}

const FCAT = { "Ахиц": "", "Асуулт": "", "Мэдэгдэл": "ok" };
async function fitCommunity(my){
  const [po, co] = await Promise.all([
    sb.from("fit_posts").select("id,username,cat,body,photo,hidden,created_at").order("created_at", { ascending: false }).limit(100),
    sb.from("fit_comments").select("id,post_id,username,body,hidden,created_at").order("created_at", { ascending: false }).limit(100)

  const P = must(po), C = must(co);
  if (my !== VIEW) return;
  // Нийтлэлийн мөр: нуух/гаргах, устгах товчтой
  const prow = p => `<tr class="${p.hidden ? "hid" : ""}"><td><b>${esc(p.username)}</b><small>${dt(p.created_at)}</small></td>
    <td><span class="tag ${FCAT[p.cat] || ""}">${esc(p.cat)}</span></td>

      <button class="btn red" data-pd="${p.id}">Устгах</button></td></tr>`;
  // Сэтгэгдлийн мөр
  const crow = c => `<tr class="${c.hidden ? "hid" : ""}"><td><b>${esc(c.username)}</b><small>${dt(c.created_at)}</small></td>
    <td style="max-width:420px;white-space:pre-wrap">${esc(c.body)}</td><td><small>#${c.post_id}</small></td>
    <td style="white-space:nowrap"><button class="btn" data-ch="${c.id}" data-v="${c.hidden ? 0 : 1}">${c.hidden ? "Гаргах" : "Нуух"}</button>
      <button class="btn red" data-cd="${c.id}">Устгах</button></td></tr>`;
  $("fbody").innerHTML = `<form class="form" id="fnf"><h3 class="full" style="margin:0">📣 Гишүүдэд мэдэгдэл нийтлэх</h3>
      ${ff("fn-b", "Мэдэгдлийн бичиг (жишээ: Пүрэв гаригт 20:00-д шууд дасгал)", "", "textarea", 'maxlength="2000" required')}
      <div class="full"><button class="btn dark" type="submit" id="fnsave">Нийтлэх</button></div></form>
    <div class="bar"><h3 style="margin:0">Нийтлэлүүд <small class="mut">(сүүлийн ${P.length})</small></h3></div>
    <div class="tbl"><table><thead><tr><th>Хэн</th><th>Ангилал</th><th>Бичиг</th><th></th></tr></thead><tbody>
      ${P.map(prow).join("") || '<tr><td colspan="4">Нийтлэл алга.</td></tr>'}</tbody></table></div>
    <div class="bar" style="margin-top:20px"><h3 style="margin:0">Сэтгэгдлүүд <small class="mut">(сүүлийн ${C.length})</small></h3></div>
    <div class="tbl"><table><thead><tr><th>Хэн</th><th>Бичиг</th><th>Нийтлэл</th><th></th></tr></thead><tbody>
      ${C.map(crow).join("") || '<tr><td colspan="4">Сэтгэгдэл алга.</td></tr>'}</tbody></table></div>`;
  // Мэдэгдэл нийтлэх
  $("fnf").onsubmit = async e => {
    e.preventDefault();
    const b = $("fnsave"); fbusy(b, true);
    try { must(await sb.from("fit_posts").insert({ cat: "Мэдэгдэл", body: fv("fn-b") })); toast("Нийтэллээ"); showFit("comm"); }
    catch (err) { fbusy(b, false); toast("Алдаа: " + err.message + (/row-level|policy/i.test(err.message) ? " — finn-fit-admin.sql ажиллуулсан уу?" : "")); }
  };
  // Нуух / гаргах, устгах (нийтлэл ба сэтгэгдэл ижил арга)
  const act = (sel, table, kind) => $("fbody").querySelectorAll(sel).forEach(b => b.onclick = async () => {
    const id = b.dataset.ph || b.dataset.pd || b.dataset.ch || b.dataset.cd;
    let r;
    if (kind === "hide") r = await sb.from(table).update({ hidden: b.dataset.v === "1" }).eq("id", id).select("id");
    else { if (!confirm("Бүр мөсөн устгах уу? Буцаах боломжгүй.")) return; r = await sb.from(table).delete().eq("id", id).select("id"); }
    if (r.error) return toast("Алдаа: " + r.error.message);
    if (!r.data || !r.data.length) return toast("Өөрчлөгдсөнгүй (эрх шалгана уу)");
    toast(kind === "hide" ? (b.dataset.v === "1" ? "Нуулаа" : "Гаргалаа") : "Устгалаа"); showFit("comm");
  });
  act("[data-ph]", "fit_posts", "hide"); act("[data-pd]", "fit_posts", "del");
  act("[data-ch]", "fit_comments", "hide"); act("[data-cd]", "fit_comments", "del");
}

// ----- 8) FIT ТОХИРГОО: Fit нүүр хуудасны бичвэрүүд -----
// [түлхүүр, нэр, үндсэн бичиг, урт эсэх]
const FTXT = [
  ["notice", "Дээд мэдэгдэл (хоосон бол харагдахгүй)", "", true],
  ["eb", "Жижиг гарчиг", "FINN FIT · СУРГАЛТ"],
  ["title", "Том гарчиг", "Биеэ хөгжүүлэх аялал эндээс эхэлнэ"],
  ["sub", "Тайлбар", "Хөтөлбөр, хичээл, хоолны төлөвлөгөө, 30 хоногийн сорилт — нэг дор.", true],
  ["btn", "Товчны бичиг", "Хөтөлбөр сонгох →"],
  ["joinTitle", "Гишүүнчлэлийн хайрцаг — гарчиг", "Бүх хөтөлбөр, хоолны төлөвлөгөө, нийгэмлэг"],
  ["joinSub", "Гишүүнчлэлийн хайрцаг — жижиг бичиг", "QPay-ээр төлнө · дэлгүүрт гишүүний хөнгөлөлт"],
  ["marquee", "Гүйдэг мөр (үгсийг · тэмдгээр тусгаарлана)", "Хөтөлбөр · Видео хичээл · Хоолны төлөвлөгөө · 30 хоногийн сорилт · Нийгэмлэг · FINN оноо", true]
];
async function fitTexts(my){
  const C = must(await sb.from("fit_config").select("*").eq("id", 1).maybeSingle()) || {};
  if (my !== VIEW) return;
  // texts багана байхгүй бол SQL ажиллуулаагүй гэсэн үг
  if (!("texts" in C)) { $("fbody").innerHTML = `<p class="msg"><b>finn-fit-admin.sql</b>-ийг Supabase-д ажиллуулсны дараа энэ хэсэг нээгдэнэ.</p>`; return; }
  const T = C.texts || {};
  $("fbody").innerHTML = `<form class="form" id="ftf"><h3 class="full" style="margin:0">Fit нүүр хуудасны бичвэрүүд</h3>
    <p class="full mut" style="margin:0;font-size:12.5px">Хоосон үлдээвэл саарал бичигтэй үндсэн хувилбар харагдана. Үнэ, хөнгөлөлтийг «Үнэ» табаас засна.</p>
    ${FTXT.map(([k, label, d, long]) => long
      ? `<label class="full">${label}<textarea id="ft-${k}" rows="2" maxlength="400" placeholder="${esc(d)}">${esc(T[k] || "")}</textarea></label>`
      : `<label class="full">${label}<input id="ft-${k}" maxlength="120" placeholder="${esc(d)}" value="${esc(T[k] || "")}"></label>`).join("")}
    <div class="full"><b style="font-size:13px">Нүүрний том зураг</b> <small class="mut">(хоосон бол хар өнгө хөдөлгөөнтэй)</small>
      <div class="row" style="margin-top:6px"><img id="ft-himg" class="prev" src="${esc(T.heroImg || "")}" alt="" style="max-width:260px;${T.heroImg ? "" : "display:none"}">
      <label class="btn" style="flex-direction:row;color:var(--ink)">Зураг сонгох<input type="file" id="ft-hfile" accept="image/*" hidden></label>
      <button type="button" class="btn" id="ft-hclr" ${T.heroImg ? "" : "hidden"}>Зураггүй болгох</button></div></div>
    <div class="full row"><button class="btn dark" type="submit" id="ftsave">Хадгалах</button><a class="btn" href="/fit" target="_blank" rel="noopener">Үр дүнг харах ↗</a></div></form>`;
  // Нүүрний зураг: шахаж "products" санд хадгална (2000px хүртэл)
  let heroImg = T.heroImg || "";
  $("ft-hfile").onchange = async e => { const f = e.target.files[0]; if (!f) return; toast("Зураг оруулж байна…");
    try { heroImg = await putImg(await shrink(f, 2000), "fit"); $("ft-himg").src = heroImg; $("ft-himg").style.display = ""; $("ft-hclr").hidden = false; toast("Зураг орлоо — Хадгалах дарна уу"); }
    catch (err) { toast("Алдаа: " + err.message); } };
  $("ft-hclr").onclick = () => { heroImg = ""; $("ft-himg").style.display = "none"; $("ft-hclr").hidden = true; };
  $("ftf").onsubmit = async e => {
    e.preventDefault();
    const b = $("ftsave"); fbusy(b, true);
    try {
      // Зөвхөн бөглөсөн талбаруудыг хадгална
      const out = {}; FTXT.forEach(([k]) => { const v = fv("ft-" + k); if (v) out[k] = v; });
      if (heroImg) out.heroImg = heroImg;
      must(await sb.from("fit_config").update({ texts: out }).eq("id", 1).select("id"));
      toast("Хадгаллаа"); showFit("conf");
    } catch (err) { fbusy(b, false); toast("Алдаа: " + err.message); }
  };
}

// ----- 5) ХООЛНЫ ТӨЛӨВЛӨГӨӨ -----
let FIT_GOAL = "", FIT_DAY = 1;
async function fitMeals(my){
  const all = must(await sb.from("fit_meals").select("*").order("day").order("sort"));
  if (my !== VIEW) return;
  const goals = [...new Set(all.map(m => m.goal))];
  if (!FIT_GOAL || !goals.includes(FIT_GOAL)) FIT_GOAL = goals[0] || "";
  const DN = ["Даваа", "Мягмар", "Лхагва", "Пүрэв", "Баасан", "Бямба", "Ням"], SO = { "Өглөө": 1, "Өдөр": 2, "Зууш": 3, "Орой": 4 };
  const list = all.filter(m => m.goal === FIT_GOAL && m.day === FIT_DAY).sort((a, b) => SO[a.slot] - SO[b.slot] || a.sort - b.sort);
  $("fbody").innerHTML = `<div class="bar">
      ${goals.length ? fsel("fmg", "", FIT_GOAL, goals) : '<span class="mut">Зорилго алга</span>'}
      <button class="btn" id="fmgnew">+ Шинэ зорилго</button>
      ${fsel("fmd", "", FIT_DAY, DN.map((d, i) => [i + 1, d]))}
      <button class="btn dark" id="fmnew" style="margin-left:auto" ${FIT_GOAL ? "" : "disabled"}>+ Хоол нэмэх</button></div>
    <div class="tbl"><table><thead><tr><th>Цаг</th><th>Хоол</th><th>Ккал</th><th>Уураг / НУ / Өөх</th><th></th></tr></thead><tbody>
      ${list.map(m => `<tr><td>${esc(m.slot)}</td><td><b>${esc(m.name)}</b></td><td>${m.kcal ?? "—"}</td><td>${[m.protein, m.carbs, m.fat].map(x => x ?? "—").join(" / ")}</td><td><button class="btn" data-fme="${m.id}">Засах</button></td></tr>`).join("") || '<tr><td colspan="5">Энэ өдөрт хоол алга.</td></tr>'}</tbody></table></div>`;
  if ($("fmg")) $("fmg").onchange = e => { FIT_GOAL = e.target.value; showFit("meals"); };
  $("fmd").onchange = e => { FIT_DAY = Number(e.target.value); showFit("meals"); };
  $("fmgnew").onclick = () => { const g = prompt("Шинэ зорилгын нэр (жишээ: Жин хасах, Булчин нэмэх):"); if (g && g.trim()) { FIT_GOAL = g.trim().slice(0, 40); fitMealForm(null); } };
  $("fmnew").onclick = () => fitMealForm(null);
  $("fbody").querySelectorAll("[data-fme]").forEach(b => b.onclick = () => fitMealForm(list.find(x => x.id === Number(b.dataset.fme))));
}
function fitMealForm(m){
  const isNew = !m; m = m || { slot: "Өглөө", name: "", kcal: "", protein: "", carbs: "", fat: "", recipe: "", sort: 0 };
  $("fform").innerHTML = `<form class="form" id="fmlf"><h3 class="full" style="margin:0">${esc(FIT_GOAL)} · ${["Даваа", "Мягмар", "Лхагва", "Пүрэв", "Баасан", "Бямба", "Ням"][FIT_DAY - 1]} — ${isNew ? "шинэ хоол" : "хоол засах"}</h3>
    ${fsel("fml-slot", "Цаг", m.slot, ["Өглөө", "Өдөр", "Зууш", "Орой"])}${ff("fml-name", "Хоолны нэр *", m.name, "text", 'required maxlength="120"')}
    ${ff("fml-kcal", "Ккал", m.kcal, "number", 'min="0"')}${ff("fml-p", "Уураг (г)", m.protein, "number", 'min="0"')}
    ${ff("fml-c", "Нүүрс ус (г)", m.carbs, "number", 'min="0"')}${ff("fml-f", "Өөх тос (г)", m.fat, "number", 'min="0"')}
    ${ff("fml-r", "Жор", m.recipe, "textarea")}
    <div class="full row"><button class="btn dark" type="submit" id="fmlsave">Хадгалах</button><button class="btn" type="button" id="fmlx">Болих</button>
      ${isNew ? "" : '<button class="btn red" type="button" id="fmldel" style="margin-left:auto">Устгах</button>'}</div></form>`;
  const num = id => fv(id) === "" ? null : Number(fv(id));
  $("fmlx").onclick = () => { $("fform").innerHTML = ""; };
  $("fmlf").onsubmit = async e => {
    e.preventDefault();
    const row = { goal: FIT_GOAL, day: FIT_DAY, slot: $("fml-slot").value, name: fv("fml-name"), kcal: num("fml-kcal"), protein: num("fml-p"), carbs: num("fml-c"), fat: num("fml-f"), recipe: $("fml-r").value.trim() };
    const b = $("fmlsave"); fbusy(b, true);
    const r = isNew ? await sb.from("fit_meals").insert(row) : await sb.from("fit_meals").update(row).eq("id", m.id);
    fbusy(b, false); if (r.error) return toast("Алдаа: " + r.error.message);
    toast("Хадгаллаа"); $("fform").innerHTML = ""; showFit("meals");
  };
  if ($("fmldel")) $("fmldel").onclick = async () => {
    if (!confirm(`«${m.name}»-ийг устгах уу?`)) return;
    const r = await sb.from("fit_meals").delete().eq("id", m.id); if (r.error) return toast("Алдаа: " + r.error.message);
    toast("Устгалаа"); $("fform").innerHTML = ""; showFit("meals");
  };
  $("fform").scrollIntoView({ behavior: "smooth" });
}

    <div class="tbl"><table><thead><tr><th>Нэр</th><th>Эхлэх</th><th>Өдөр</th><th>Элсэлт</th><th>Оролцогч</th><th></th></tr></thead><tbody>

// ===== СУПЕР АДМИН: админ эрхийн хүсэлтийн мэдэгдэл =====
let ME_SUPER = false;
async function refreshReqBadge(){
  try {
    const w = await api({ action: "whoami" });
    ME_SUPER = w.super;
    if (w.super) $("whoami").textContent = "⭐ " + w.username;
    // "Хэрэглэгч" таб дээр улаан тоо
    const tab = document.querySelector('[data-t="users"]');
    let dot = tab.querySelector(".rq"); if (!dot) { dot = document.createElement("b"); dot.className = "rq"; tab.appendChild(dot); }
    dot.textContent = w.pending || ""; dot.hidden = !w.pending;
    // Дээд талын анхааруулах тууз
    let bn = $("rqban");
    if (w.pending) {
      if (!bn) { bn = document.createElement("div"); bn.id = "rqban"; bn.className = "rqban"; document.querySelector("main, #main").before(bn); }
      bn.innerHTML = `🔔 Танд <b>${w.pending}</b> админ эрхийн хүсэлт зөвшөөрөл хүлээж байна <button class="btn dark" type="button">Харах</button>`;
      bn.querySelector("button").onclick = () => tab.click();
    } else if (bn) bn.remove();
  } catch (e) {}
}

// Таб солих
const TABS = { orders: () => showOrders(""), users: showUsers, products: () => showProducts(), settings: showSettings, reviews: showReviews, history: () => showHistory() };
// Fit табууд: "f-prog" → showFit("prog") гэх мэт
FIT_SUB.forEach(([k]) => TABS["f-" + k] = () => showFit(k));
$("tabs").addEventListener("click", e => { const b = e.target.closest("[data-t]"); if (!b) return;
  // Нөгөө бүлгийн таб дарагдвал (жишээ нь "Харах" товчоор) горимыг нь солино
  if (b.dataset.g !== MODE) setMode(b.dataset.g, false);
  $("tabs").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); const my = VIEW + 1; TABS[b.dataset.t]().catch(err => { if (VIEW === my) $("main").innerHTML = `<p class="msg">Алдаа: ${esc(err.message)}</p>`; }); });

// ===== SHOP | FIT горим: дээд мөрөнд зөвхөн тухайн хэсгийн табууд харагдана =====
let MODE = "shop";
// Сүүлд сонгосон горимыг санана (дараа нээхэд тэр хэсэг нь гарна)
try { if (localStorage.getItem("finn-admin-mode") === "fit") MODE = "fit"; } catch (e) {}
// Хаяг нь admin.html#fit эсвэл #shop бол түүнийг дагана
if (location.hash === "#fit") MODE = "fit"; else if (location.hash === "#shop") MODE = "shop";
// m: "shop" | "fit"; go=true бол тухайн хэсгийн эхний табыг нээнэ
function setMode(m, go = true){
  MODE = m === "fit" ? "fit" : "shop";
  try { localStorage.setItem("finn-admin-mode", MODE); } catch (e) {}
  $("asw").querySelectorAll("[data-m]").forEach(x => x.setAttribute("aria-pressed", x.dataset.m === MODE));
  $("tabs").querySelectorAll("[data-g]").forEach(x => x.hidden = x.dataset.g !== MODE);
  // Хажуу тийш гүйлгэсэн табуудыг эхлэл рүү нь буцаана
  $("tabs").scrollLeft = 0;
  if (go) { const f = $("tabs").querySelector(`[data-g="${MODE}"]`); if (f) f.click(); }
}
$("asw").addEventListener("click", e => { const b = e.target.closest("[data-m]"); if (b && b.dataset.m !== MODE) setMode(b.dataset.m); });

// Эхлүүлэх: нэвтэрсэн, админ эсэхийг шалгана
(async () => {
  try {
    const c = await (await fetch("/api/config")).json();
    if (!c.supabaseUrl) throw new Error("Supabase тохируулаагүй байна.");
    SB_BASE = c.supabaseUrl.replace(/\/$/, "");
    sb = window.supabase.createClient(c.supabaseUrl, c.supabaseAnon);
    const { data } = await sb.auth.getUser();
    if (!data.user) { $("main").innerHTML = `<p class="msg">Эхлээд <a href="/">сайт дээрээ</a> админ бүртгэлээрээ нэвтэрнэ үү.</p>`; return; }
    const { data: p } = await sb.from("profiles").select("username,role").eq("id", data.user.id).maybeSingle();
    if (!p || p.role !== "admin") { $("main").innerHTML = `<p class="msg">Танд админ эрх байхгүй байна.</p>`; return; }
    $("whoami").textContent = p.username; $("tabs").hidden = false; $("asw").hidden = false;
    // Супер админ бол хүлээгдэж буй админ хүсэлтийг шалгаж мэдэгдэнэ (1 минут тутам шинэчилнэ)
    refreshReqBadge(); setInterval(refreshReqBadge, 60000);
    // Сүүлд ашигласан хэсгийн (SHOP эсвэл FIT) эхний табыг нээнэ
    setMode(MODE);
  } catch (e) { $("main").innerHTML = `<p class="msg">${esc(e.message)}</p>`; }
})();

// ===== БИЧИХ ТАЛБАР: агуулгадаа тааруулж өндөр нь өсч бүх бичиг харагдана =====
// Өндрийг агуулгын хэмжээнд тааруулна
function fitTA(t){ if (!t.isConnected) return; t.style.height = "auto"; t.style.height = (t.scrollHeight + 2) + "px"; }
// Бичих бүрт томруулна; нэг мөрт талбарт мөр шилжилтийг хоосон зайгаар солино
document.addEventListener("input", e => { const t = e.target; if (t.tagName !== "TEXTAREA") return;
  if (t.classList.contains("one") && /\n/.test(t.value)) t.value = t.value.replace(/\s*\n\s*/g, " ");
  fitTA(t); }, true);
// Нэг мөрт талбарт Enter дарахад мөр шилжихгүй
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.classList && e.target.classList.contains("one")) e.preventDefault(); }, true);
// Хуудас шинээр зурагдах бүрт бүх талбарын өндрийг тааруулна
new MutationObserver(() => requestAnimationFrame(() => document.querySelectorAll("textarea").forEach(fitTA))).observe(document.documentElement, { childList: true, subtree: true });
addEventListener("resize", () => document.querySelectorAll("textarea").forEach(fitTA));
</script>
