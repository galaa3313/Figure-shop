<!doctype html>
<html lang="mn">
<head>
<!-- Тэмдэгтийн кодлол -->
<meta charset="utf-8">
<!-- Утсан дээр зөв харагдана -->
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Хайлтын системд энэ хуудсыг харуулахгүй -->
<meta name="robots" content="noindex">
<title>FINN · Админ</title>
<!-- Inter фонт -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap">
<style>
/* Өнгөний хувьсагчид: сайттай ижил цагаан, минимал */
:root{--bg:#fff;--bg2:#f6f6f4;--ink:#111;--muted:#8a8a8a;--line:#e6e6e3;--red:#e5172f;--green:#1f9d55;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif}
[hidden]{display:none!important}
/* Дээд мөр: лого, табууд, гарах */
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:12px max(16px,3vw);flex-wrap:wrap}
.logo{font-weight:900;font-size:20px;display:flex;align-items:center;text-decoration:none;color:var(--ink)}
.logo i{display:inline-block;width:.3em;height:.72em;background:var(--red);transform:skewX(-26deg);margin:0 .14em 0 .1em}
.logo small{font-weight:500;font-size:12px;color:var(--muted);margin-left:10px;letter-spacing:.1em}
nav{display:flex;gap:4px;flex:1}
/* SHOP | FIT шилжүүлэгч (дэлгүүрийн толгойтой ижил хэв маяг) */
.asw{display:inline-flex;border:1px solid var(--ink);border-radius:999px;padding:3px;flex:none}
.asw button{min-width:46px;height:28px;padding:0 12px;border:0;border-radius:999px;background:none;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--ink)}
.asw button[aria-pressed=true]{background:var(--ink);color:#fff}
.asw button:not([aria-pressed=true]):hover{background:var(--bg2)}
/* Нийгэмлэгийн нийтлэл: нуусан бол бүдэг */
tr.hid td{opacity:.5}
nav button{border:0;background:none;padding:8px 12px;font:inherit;font-weight:500;color:var(--muted);cursor:pointer}
nav button[aria-pressed=true]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
main{padding:20px max(16px,3vw) 60px;max-width:1300px;margin:0 auto}
/* Товчнууд, талбарууд */
button,.btn{font:inherit;cursor:pointer}
.btn{border:1px solid var(--ink);background:#fff;color:var(--ink);padding:8px 14px}
.btn.dark{background:#111;color:#fff}
.btn.red{border-color:var(--red);color:var(--red)}
input,select,textarea{font:inherit;border:1px solid var(--line);padding:9px 10px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
/* Хүснэгт: утсан дээр хажуу тийш гүйлгэнэ */
.tbl{overflow-x:auto;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}
th{background:var(--bg2);font-weight:600;font-size:12px;color:var(--muted)}
td small{color:var(--muted);display:block}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.bar h2{margin:0 auto 0 0;font-size:20px;font-weight:600}
.tag{display:inline-block;padding:2px 8px;background:var(--bg2);font-size:12px}
.tag.ok{background:#e7f6ee;color:var(--green)}
.tag.no{background:#fdecee;color:var(--red)}
/* Барааны маягт */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;border:1px solid var(--line);padding:16px;margin-bottom:20px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
.form .full{grid-column:1/-1}
.form .row{display:flex;gap:8px;align-items:center}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs figure{margin:0;position:relative;width:84px;height:112px;background:var(--bg2)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs button{position:absolute;top:2px;right:2px;border:0;background:#111;color:#fff;width:22px;height:22px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.pc{border:1px solid var(--line);display:flex;flex-direction:column}
.pc img{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--bg2)}
.pc div{padding:8px 10px;font-size:13px}
.pc .btns{display:flex;gap:6px;padding:0 10px 10px}
.msg{padding:40px 0;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;z-index:9}
@media (max-width:640px){.form{grid-template-columns:minmax(0,1fr)}}
/* Нэмэлт: бараа, тохиргооны хуудас */
.post{display:grid;grid-template-columns:160px 1fr;gap:12px;border:1px solid var(--line);padding:10px;margin-bottom:8px;align-items:start}
.post img{width:160px;height:110px;object-fit:cover;background:var(--bg2)}
.post .pcol{display:flex;flex-direction:column;gap:8px}
.post .pcol label{display:flex;flex-direction:column;gap:4px}
.pchk{max-height:200px;overflow:auto;border:1px solid var(--line);padding:8px;display:grid;gap:6px;margin-top:6px}
.pchk label{flex-direction:row!important;align-items:center;gap:8px!important;font-size:13px;color:var(--ink)}
.pchk input{width:auto}
.post .tb{display:flex;gap:4px}.post .tb button{border:1px solid var(--line);background:#fff;width:36px;height:32px}
@media (max-width:640px){.post{grid-template-columns:100px 1fr}.post img{width:100px;height:80px}}
.rvi{border:1px solid var(--line);padding:14px;margin-bottom:12px}.rvi.off{opacity:.55}
nav{flex-wrap:wrap}
.mut{color:var(--muted);font-size:12px}
.empty{border:1px dashed var(--line);padding:18px;margin-bottom:16px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.empty p{margin:0;max-width:640px}
.pc.off{opacity:.5}
.pc .btns .btn{flex:1;padding:6px 8px;font-size:12px}
.thumbs figure{width:96px;height:128px}
.thumbs figure.main{outline:2px solid var(--ink)}
/* Өөр бүртгэлээр нэвтэрсэн анхааруулга */
.swacc{position:sticky;top:0;z-index:30;background:#fff3cd;border-bottom:2px solid #e0a800;color:#5c4400;padding:12px max(16px,3vw);font-size:14px;line-height:1.5}
.swacc small{display:block;opacity:.8;margin-top:2px}.swacc a{color:inherit;font-weight:700}
/* ===== FIT хичээл: жагсаалт ба видео ===== */
.flprog{display:inline-flex;align-items:center;gap:8px;font-size:13px}
.flhint{font-size:13px;color:var(--muted);margin:2px 0 12px;line-height:1.6}.flhint .red{color:#d62828}
.flist{display:flex;flex-direction:column;border:1px solid var(--line);background:#fff}
.flrow{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.flrow:last-child{border-bottom:0}.flrow:hover{background:#f7f7f5}.flrow.off{opacity:.6}
.fln{font-size:18px;font-weight:700;color:var(--muted);text-align:center}
.flt b{display:block}.flt small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.flb{display:flex;gap:6px}
.vt{font-size:12px;padding:3px 10px;border-radius:999px;white-space:nowrap}
.vt.ok{background:#e7f6ec;color:#1b7a3d}.vt.yt{background:#fff6dc;color:#8a6100}.vt.no{background:#fff0f0;color:#c62828}
@media (max-width:760px){ .flrow{grid-template-columns:32px minmax(0,1fr) auto} .flb{grid-column:1/-1} .flb .btn{flex:1} }
.vbox{border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px;border-radius:10px;background:#fafaf8}
.vbox.pulse{animation:vpulse 1s ease 2}
@keyframes vpulse{50%{box-shadow:0 0 0 4px #1e6fff55}}
.vhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.vhead .mut{font-size:12px}
.vdrop{border:2px dashed #c9c9c4;border-radius:10px;padding:22px 14px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;cursor:pointer;background:#fff;transition:.15s}
.vdrop:hover,.vdrop.over{border-color:#1e6fff;background:#f3f7ff}
.vdrop.busy{pointer-events:none;opacity:.5}
.vdrop .vic{font-size:26px;line-height:1}.vdrop .mut{font-size:12.5px}
.vrow{display:flex;align-items:center;gap:8px;font-size:13px}
.vprev{position:relative;width:100%;max-width:640px;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden}
.vprev iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
/* ===== Хэсгийг сайт дээр урьдчилан харах ===== */
/* Анхаар: .spv* нэрс — барааны маягтын .pvwrap/.pvbtn-тэй давхцахгүй (давхцаад саарал давхарга бүх хуудсыг хааж байсан) */
.spvbtn{margin-left:auto;align-self:center;height:36px;font-size:13px;white-space:nowrap;flex:none}
.spvwrap{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px}
.spvwrap[hidden]{display:none}
.spvbox{background:#fff;width:min(1100px,100%);height:min(92vh,980px);display:flex;flex-direction:column;border-radius:14px;overflow:hidden}
.pvhead{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pvhead b{margin-right:auto;font-size:15px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 12px;font-size:13px}.seg button[aria-pressed=true]{background:#111;color:#fff}
.pvstage{flex:1;overflow:hidden;background:#e9e9e6;display:flex;justify-content:center;position:relative}
.pvstage iframe{border:0;background:#fff;transform-origin:top center;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.pvnote{margin:0;padding:8px 12px;font-size:12px}
@media (max-width:760px){ .spvwrap{padding:0} .spvbox{border-radius:0;height:100%} .spvbtn{height:32px;padding:0 10px;font-size:12px}
  /* Утсан дээр толгой нэг мөрөнд багтана */
  .pvhead{flex-wrap:nowrap;padding:8px} .pvhead b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0} .pvhead .btn{height:34px;width:34px;padding:0;justify-content:center} .seg button{padding:6px 9px;font-size:12px} }
/* ===== Гүйдэг тууз (тохиргоо) ===== */
.mqprev{overflow:hidden;white-space:nowrap;border:1px solid var(--line);border-radius:10px;background:#fff}
.mqtrack{display:inline-flex;gap:44px;padding:14px 0;font-size:20px;animation:mqa 20s linear infinite}
@keyframes mqa{to{transform:translateX(-33.333%)}}
.mqprev:hover .mqtrack{animation-play-state:paused}
.mqi{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.mqi img{height:1.7em;width:auto;max-width:160px;object-fit:contain}.mqi i,.mqi em{font-style:normal}
.mqrow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff}
.mqth{width:56px;height:56px;border-radius:8px;background:#f3f3f1;display:grid;place-items:center;overflow:hidden;font-size:22px}
.mqth img{width:100%;height:100%;object-fit:contain}
.mqf{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:6px;align-items:center}
.mqf select{height:38px;max-width:150px}.mqf .btn.sm{height:38px;flex-direction:row}
.mqt{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
@media (max-width:760px){ .mqf{grid-template-columns:auto 1fr} .mqf textarea,.mqf [data-ql]{grid-column:1/-1;max-width:none} }
/* ===== Мэдэгдлийн хонх ба жагсаалт ===== */
.abell{position:relative;border:0;background:none;padding:6px;color:var(--ink);display:grid;place-items:center;margin-left:auto}
.abell svg{width:24px;height:24px}
.abell b{position:absolute;top:0;right:-2px;min-width:17px;height:17px;border-radius:999px;background:#e5172f;color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.abell b[hidden]{display:none}
.abell.ring svg{animation:ring .9s ease}
@keyframes ring{0%,100%{transform:rotate(0)}15%{transform:rotate(16deg)}30%{transform:rotate(-14deg)}45%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}75%{transform:rotate(3deg)}}
.npanel{position:fixed;top:62px;right:max(12px,3vw);z-index:20;width:min(400px,calc(100vw - 24px));max-height:min(70vh,560px);overflow:auto;background:#fff;border:1px solid var(--ink);box-shadow:0 18px 50px rgba(0,0,0,.18)}
.nph{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
.lnk{border:0;background:none;text-decoration:underline;font-size:13px;padding:0}
.nit{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;width:100%;text-align:left;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:#fff;font:inherit;color:var(--ink)}
.nit:hover{background:#f6f6f4}.nit.new{background:#f3f7ff}
.nit .ni{width:34px;height:34px;border-radius:50%;background:#f1f1ef;display:grid;place-items:center;font-size:15px}
.nit .nt b{display:block;font-size:13.5px;font-weight:500}.nit.new .nt b{font-weight:700}
.nit .nt>span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px;color:var(--muted)}
.nit time{font-size:11px;color:var(--muted);white-space:nowrap}
/* ===== Хэн хариулсан, засах ===== */
.whof{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-left:auto;white-space:nowrap}
.whof select{height:34px;border:1px solid var(--line);background:#fff;padding:0 8px;font-size:13px}
.who{font-style:normal;font-weight:600;color:#1e6fff;margin-right:2px}.who::after{content:":"}
.rwho{flex:1 1 100%;margin:0 0 2px;font-size:13px;color:var(--muted)}.rwho b{color:var(--ink)}
.bedit{border:0;background:none;color:inherit;text-decoration:underline;font-size:11px;padding:0;opacity:1;cursor:pointer}
.bub.editing{width:100%;max-width:100%}
.edta{width:100%;font:inherit;font-size:15px;padding:8px;border:0;border-radius:8px;color:#111;margin-top:4px}
.edbt{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.edbt .btn{height:34px;background:#fff;color:#111}
.edbt .edel{margin-left:auto;color:#d62828;border-color:#f0b4b4}
/* Сэтгэгдлийн хариулт */
.rvrep{display:flex;flex-direction:column;gap:8px}.rvrep .bub.me{align-self:flex-end}
.rvnew{display:grid;gap:4px;font-size:13px;color:var(--muted)}.rvnew textarea{width:100%}
.rvrep [data-rsend]{align-self:flex-start}
.rvb .ichat{max-height:none}
/* ===== Мессеж ===== */
.ibar{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.ibar button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13px}
.ibar button small{color:var(--muted)}
.ibar button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}.ibar button[aria-pressed=true] small{color:#ccc}
/* Уншаагүй харилцаа: тод, зүүн талд улаан зураас */
.ord.ib.unr{box-shadow:inset 3px 0 0 #e5172f}.ord.ib.unr .on{font-weight:700}
.ibb{grid-template-columns:1fr}
.ithead b{display:block;font-size:16px}
.ichat{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto;padding:4px 2px}
.bub{max-width:80%;padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.5;background:#fff;border:1px solid var(--line)}
.bub p{margin:0;white-space:pre-wrap;word-break:break-word}.bub b{display:block;font-size:11px;letter-spacing:.05em;color:var(--muted)}
.bub small{display:block;font-size:10.5px;opacity:.6;margin-top:3px}
.bub.fn{align-self:flex-start;border-bottom-left-radius:4px}
.bub.me{align-self:flex-end;background:#111;color:#fff;border-color:#111;border-bottom-right-radius:4px}.bub.me b{color:#bbb}
.ibcomp{display:grid;gap:10px;border:1px solid var(--ink);padding:14px;margin-bottom:12px;background:#fff}
.ibcomp label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
/* ===== Олноор сонгох: чагт, дээд мөр ===== */
.selbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 8px}
.selbar.on{position:sticky;top:64px;z-index:6;background:#fff;padding:10px;border:1px solid var(--ink)}
.selbar .btn{height:38px}.selbar .red{color:#fff;background:#d62828;border-color:#d62828}.selbar .red:disabled{opacity:.4}
.selcnt{font-size:13.5px;margin-right:auto}
.selw{display:none;align-items:center;justify-content:center;width:26px;height:26px;margin-right:8px;flex:none;vertical-align:middle}
.selw input{width:20px;height:20px;margin:0;accent-color:#111}
.selmode .selw{display:inline-flex}
.selmode [data-row]{cursor:pointer}
[data-row].picked{background:#eef4ff!important;outline:2px solid #1e6fff;outline-offset:-2px}
.plist .pc{position:relative}.plist.selmode .pc .selw{position:absolute;left:6px;top:6px;z-index:2;background:#fff;border-radius:4px;margin:0;width:30px;height:30px}
.ord .oc{display:flex;align-items:center;flex-wrap:wrap;column-gap:0}.ord .oc small{width:100%}
.selmode .ord .oc small{padding-left:34px}
/* Сэтгэгдэл: одны өнгө, бага үнэлгээ улаанаар */
.rv2 .stars{color:#f5b301;letter-spacing:1px}.rv2.low .os{background:#fff0f0;color:#c62828}
.rv2 .ot{font-weight:400}.rvb{grid-template-columns:1fr}
.rvb .oact label{min-width:100%}.rvb textarea{width:100%}
/* ===== Захиалгын жагсаалт: нэг мөр, дарахад задарна ===== */
.olist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.ocount{margin:8px 0;font-size:12.5px}
.ord{border-bottom:1px solid var(--line);background:#fff}
.ord summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:150px 1fr auto auto 18px;gap:12px;align-items:center;padding:12px 10px}
.ord summary::-webkit-details-marker{display:none}
.ord summary:hover{background:#fafafa}
.ord[open] summary{background:#f6f6f4}
.ord small{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.ord .oc b{font-size:13.5px}.ord .on{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.ord .ot{font-weight:700;font-size:14px;white-space:nowrap}
.ord .os{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:999px;white-space:nowrap;background:#fff6dd;color:#8a6100}
.ord .os i{width:7px;height:7px;border-radius:50%;background:currentColor}
.ord.ok .os{background:#e9f7ee;color:#1d7a3f}.ord.off .os{background:#f1f1f1;color:#888}
.ord.off .oc b,.ord.off .on,.ord.off .ot{color:#999}
.ochev{font-size:22px;color:var(--muted);transition:transform .2s;text-align:center}
.ord[open] .ochev{transform:rotate(90deg)}
.obody{padding:6px 10px 16px;display:grid;grid-template-columns:1.2fr 1fr;gap:14px 24px;background:#f6f6f4}
.og{display:grid;grid-template-columns:1fr 1fr;gap:12px}.og small,.oitems small{text-transform:uppercase;letter-spacing:.06em}
.og b{display:block}.og a{color:var(--ink)}
.oitems ul{margin:4px 0 0;padding-left:18px;font-size:13.5px;line-height:1.5}
.otot{margin-top:6px;font-size:13px}.okc{color:#1d7a3f}
.oact{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;border-top:1px solid var(--line);padding-top:12px}
.oact label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:220px;flex:1}
.oact .btn{height:40px}.oact .del{color:#d62828;border-color:#f0b4b4}.oact .del.sure{background:#d62828;color:#fff}
@media (max-width:640px){
  .ord summary{grid-template-columns:1fr auto 16px;grid-template-areas:"c t ch" "n s ch";gap:4px 10px;padding:12px 4px}

/* ===== Барааны маягт: дугаартай алхам, өнгө, зургийн карт, хэмжээ ===== */

.pfsec-h{border:0;padding:8px 0 0;background:none}
.pfh{display:flex;gap:12px;align-items:flex-start}
.pfh>i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font-style:normal;font-weight:700;font-size:14px;display:grid;place-items:center}

/* Өнгөний товч: дугуй + нэр, сонгосон нь хар */

.pal-new input{height:36px}.pal-new .btn{height:36px}
/* Зургийн картууд: өнгө бүр нэг карт */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.cg{border:1px solid var(--line);padding:12px;background:#fafafa;transition:border-color .2s,background .2s}

.cg.need{border-color:#f0b4b4;background:#fff7f7}
.cg.over{border-color:#1e6fff;background:#eef4ff}
.cgh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cgh b{font-size:14px}.cgh span{margin-left:auto;font-size:12px;color:var(--muted)}
.cg.need .cgh span{color:#d62828}
.cgh .sw{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.tns{display:flex;flex-wrap:wrap;gap:8px}
.tn{position:relative;width:78px;height:104px;padding:0;border:1px solid var(--line);background:#fff;overflow:hidden;cursor:pointer}
.tn img{width:100%;height:100%;object-fit:cover;display:block}
.tn.main{outline:2px solid var(--ink);outline-offset:1px}
.tn em{position:absolute;left:0;top:0;background:var(--ink);color:#fff;font-style:normal;font-size:10px;padding:2px 6px}
.tn u{position:absolute;right:3px;top:3px;text-decoration:none;background:#1e6fff;color:#fff;font-size:11px;padding:1px 5px}
.tn:hover img{opacity:.85}
.tn.add{border:1.5px dashed #b8b8b8;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted)}
.tn.add b{font-size:26px;line-height:1;font-weight:300;color:var(--ink)}.tn.add span{font-size:11.5px}
.tn.add:hover{border-color:var(--ink);color:var(--ink)}
.tn.up{display:grid;place-items:center;cursor:default}.tn.up i{width:22px;height:22px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite}
.tn.up.bad{border-color:#e5172f;color:#e5172f}
/* Зургийн цэс (утсанд доороос гарна) */
.tmenu{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.tm-box{background:#fff;width:min(560px,100%);display:grid;grid-template-columns:180px 1fr;gap:14px;padding:14px;max-height:90vh;overflow:auto}

/* Хэмжээ */

.csbox{margin-top:12px;padding:10px;border:1px dashed var(--line);background:#fafafa}
.cshead{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-bottom:4px}.cshead small{display:block;font-size:12px;margin-top:2px}.cshead .btn{height:32px;font-size:12.5px}

.cssz{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}.csn{font-size:12px;color:var(--muted);min-width:44px}.csrow.empty .csn{color:#e5172f;font-weight:600}

.pvo button.na{opacity:.35;text-decoration:line-through}
.pfmore summary{cursor:pointer;font-size:12.5px;color:var(--muted);padding:4px 0}
/* ⑤ Сайтад ингэж харагдана */
.pvsec{background:#f6f6f4}
.pvchk{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.pvchk li{font-size:12.5px;padding:5px 10px;border:1px solid}

.pvthumbs{display:flex;gap:4px;padding:6px;overflow-x:auto}.pvthumbs img{width:44px;height:58px;object-fit:cover;opacity:.55;cursor:pointer;border:2px solid transparent}.pvthumbs img.on{opacity:1;border-color:#111}
.pvb{padding:10px 14px 14px}.pvb .ser{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.pvo{margin:6px 0}.pvo small{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}.pvo div{display:flex;flex-wrap:wrap;gap:5px}

.pvbtn{margin-top:10px;height:44px;display:grid;place-items:center;background:#111;color:#fff;font-size:13.5px;opacity:.55}

@media (max-width:560px){.pvcard{width:150px}.pvwrap{gap:12px}.pfsave #pvgo{display:none}}

.hf{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:16px}

.crow .mut{white-space:nowrap;min-width:56px;text-align:right}
.crow .tb{display:flex;gap:4px}.crow .tb button{border:1px solid var(--line);background:#fff;width:34px;height:38px}
@media (max-width:640px){ .crow{grid-template-columns:22px 1fr auto;row-gap:6px} .crow .tb{grid-column:2/4;justify-self:end} .crow .mut{grid-column:3;grid-row:1} }

/* ===== САЙТЫН ТОХИРГОО v2: зүүн цэс + цагаан картууд саарал дэвсгэр дээр ===== */
main:has(.slay){max-width:1180px}
body:has(.slay){background:#f4f4f2}
body:has(.slay) header{background:#fff}
.slay{display:grid;grid-template-columns:210px minmax(0,1fr);gap:24px;align-items:start}
/* Зүүн цэс: босоо, наалддаг */
.slay .snav{position:sticky;top:76px;flex-direction:column;gap:2px;border:0;padding:0;margin:0;background:none;overflow:visible}
.slay .snav a{border:0;border-radius:8px;padding:9px 12px;font-size:13.5px;color:var(--muted);background:none;transition:background .15s,color .15s}
.slay .snav a:hover{background:#fff;color:var(--ink)}
.slay .snav a.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.06)}
/* Карт */
.scard{border:0!important;box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.03);padding:24px!important;border-radius:16px}
.shead{display:flex;gap:14px;align-items:flex-start;border-bottom:1px solid #efefed!important;padding-bottom:16px!important}
.shead .sic{flex:none;width:40px;height:40px;border-radius:11px;background:#f4f4f2;display:grid;place-items:center;font-size:19px}
.shead h3{font-size:16.5px!important;line-height:1.3}
.shead .where{margin-top:3px!important;line-height:1.45}
/* Талбарууд: бөөрөнхий, өндөр, тод хүрээ */
.scard input:not([type=checkbox]):not([type=color]):not([type=file]),.scard select,.scard textarea{border-radius:9px;border-color:#e3e3e0;padding:11px 12px;font-size:14px;background:#fff;transition:border-color .15s,box-shadow .15s}
.scard input:focus,.scard select:focus,.scard textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(17,17,17,.07)}
.scard label{font-size:12.5px!important;color:#6b6b6b!important;font-weight:500}
.scard .btn{border-radius:9px}
.scard .btn.add{border:1.5px dashed #cfcfcb;color:#444;padding:10px 16px}
.scard .btn.add:hover{border-color:var(--ink);color:var(--ink)}
/* Жагсаалтын мөрүүд (асуулт, алхам, ангилал, үйлчилгээ) */
.scard .pair,.scard .crow{background:#fafaf8;border-radius:12px;padding:10px;margin-bottom:8px}
.scard .pair b,.scard .crow b{color:#9a9a96;font-size:12px;text-align:center}
.scard .tb button{border-radius:8px}
/* Хоосон төлөв */
.scard #slList:not(:has(.post)),.scard #prList:not(:has(.post)){border:1.5px dashed #e3e3e0;border-radius:12px;padding:22px;text-align:center;color:#9a9a96;font-size:13px}
.scard .post{border-radius:12px;background:#fafaf8;border-color:#efefed}
.scard .post img{border-radius:8px}
.scard .prev{border-radius:10px}
.colors label{background:#fafaf8;padding:6px 12px 6px 6px;border-radius:10px}
.colors input[type=color]{border-radius:8px;border:1px solid #e3e3e0;cursor:pointer}
.shint{border-radius:10px}
/* Хадгалах мөр */
.savebar{background:rgba(255,255,255,.92)!important;backdrop-filter:blur(10px)}
.savebar .btn{border-radius:10px}
/* Таблет, утас: цэс дээр хэвтээ товч болно */
@media (max-width:860px){
  .slay{grid-template-columns:minmax(0,1fr);gap:0}
  main:has(.slay){overflow-x:clip}
  .slay .snav{position:sticky;top:53px;flex-direction:row;overflow-x:auto;background:#f4f4f2;padding:10px 0;margin:0 0 6px;z-index:4}
  .slay .snav a{flex:none;background:#fff;border:1px solid #e8e8e5;border-radius:999px;padding:7px 13px;font-size:12.5px}
  .slay .snav a.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .scard{padding:18px 16px!important;border-radius:14px}
  .shead .sic{width:36px;height:36px;font-size:17px;border-radius:10px}
}

/* Өнгөний мөр: багтахгүй бол дараагийн мөр рүү орно (утсан дээр 3 багана) */
.scard .colors{flex-wrap:wrap}
.scard>*{min-width:0}
.scard .colors label{flex:1 1 150px;justify-content:space-between}
@media (max-width:640px){
  .scard .colors{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .scard .colors label{flex-direction:column!important;align-items:flex-start!important;gap:6px!important;padding:8px!important}
  .scard .colors input[type=color]{width:100%;height:38px}
  .scard .colors #colReset{grid-column:1/-1}
  .scard .colors .mut{grid-column:2/-1;align-self:center}
}

/* Үйлчилгээний мөр: дүрс | гарчиг | тайлбар | товчнууд */
.prow{display:grid;grid-template-columns:150px 1fr 1.4fr auto;gap:8px;align-items:center;background:#fafaf8;border-radius:12px;padding:10px;margin-bottom:8px}
.prow .tb{display:flex;gap:4px}.prow .tb button{border:1px solid var(--line);background:#fff;width:34px;height:40px;border-radius:8px}
.prow .tb button:disabled{opacity:.35}
@media (max-width:640px){ .prow{grid-template-columns:1fr auto} .prow select{grid-column:1} .prow .tb{grid-column:2;grid-row:1} .prow input{grid-column:1/-1} }

.he .btn.rv{font-size:12.5px;padding:7px 12px;white-space:nowrap}
.he .btn.sure{background:var(--red);border-color:var(--red);color:#fff}
.hkeep{margin:-6px 0 12px}

/* Нэг мөрт бичих талбар: оролт шиг харагдана, урт бол доош томорно */
textarea.one{resize:none;overflow:hidden;min-height:44px;line-height:1.45;font:inherit;width:100%;box-sizing:border-box}
textarea{overflow:hidden}

/* Ачаалж байх үеийн дугуй ба төлөв */
.spin{display:inline-block;width:14px;height:14px;margin-right:8px;vertical-align:-2px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.btn.busy{opacity:.85;cursor:wait}
.btn.done{background:#14853b!important;border-color:#14853b!important;color:#fff!important}
.he.flash{animation:flash 2s ease-out}
@keyframes flash{0%{background:#e6f4ea}100%{background:transparent}}

/* ===== КОМПЬЮТЕР: админ дэлгэцийг дүүргэж, толгойтой нэг шугамд ===== */
@media (min-width:1100px){
  /* Толгой ба агуулга ижил өргөн (1680px хүртэл), ирмэг нь таарна */
  header{padding-left:max(24px,3vw)!important;padding-right:max(24px,3vw)!important}
  header>*:first-child{margin-left:max(0px,calc((100vw - 1680px)/2))}
  header>*:last-child{margin-right:max(0px,calc((100vw - 1680px)/2))}
  main,main:has(.slay){max-width:1680px!important;padding-left:max(24px,3vw)!important;padding-right:max(24px,3vw)!important;box-sizing:border-box}
  /* Үсэг томруулна */
  body{font-size:15px}
  nav button{font-size:15px}
  main h2{font-size:24px}
  /* Тохиргоо: зүүн цэс өргөн, карт томсгосон */
  .slay{grid-template-columns:240px minmax(0,1fr)!important;gap:32px!important}
  .slay .snav a{font-size:15px!important;padding:11px 14px!important}
  .scard{padding:28px 32px!important}
  .shead h3{font-size:19px!important}
  .shead .where{font-size:13.5px!important}
  .scard label{font-size:13.5px!important}
  .scard input:not([type=checkbox]):not([type=color]):not([type=file]),.scard select,.scard textarea{font-size:15px!important;padding:12px 14px!important}
  .scard .mut,.sintro{font-size:13.5px}
  /* Хадгалах мөр: агуулгатай ижил өргөн */
  .savebar{margin-left:calc(-1 * max(24px,3vw))!important;margin-right:calc(-1 * max(24px,3vw))!important}
  /* Хүснэгт (захиалга, хэрэглэгч) */
  table{font-size:14.5px}
}

.crop{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:12px}
.cbox{background:#fff;width:100%;max-width:620px;max-height:100%;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}

/* Тайрах хүрээ: гадна талыг бараан, дотор нь гуравны шугам */
.cframe{position:absolute;box-shadow:0 0 0 9999px rgba(0,0,0,.6);outline:2px solid #1e6fff;cursor:move;
  background:linear-gradient(rgba(255,255,255,.4),rgba(255,255,255,.4)) 33.33% 0/1px 100% no-repeat,linear-gradient(rgba(255,255,255,.4),rgba(255,255,255,.4)) 66.66% 0/1px 100% no-repeat,
  linear-gradient(rgba(255,255,255,.4),rgba(255,255,255,.4)) 0 33.33%/100% 1px no-repeat,linear-gradient(rgba(255,255,255,.4),rgba(255,255,255,.4)) 0 66.66%/100% 1px no-repeat}
/* Бариулууд: том (хуруунд тохиромжтой) үл харагдах талбай + харагдах цэнхэр тэмдэг */
.cframe .ch{position:absolute;width:34px;height:34px;z-index:2}
.cframe .ch::after{content:"";position:absolute;border:0 solid #1e6fff}
.ch-nw{left:-17px;top:-17px;cursor:nwse-resize}.ch-ne{right:-17px;top:-17px;cursor:nesw-resize}
.ch-sw{left:-17px;bottom:-17px;cursor:nesw-resize}.ch-se{right:-17px;bottom:-17px;cursor:nwse-resize}
/* Өнцгийн цэнхэр "Г" тэмдэг (хүрээний гадна ирмэг дээр) */
.cframe .ch-nw::after,.cframe .ch-ne::after,.cframe .ch-sw::after,.cframe .ch-se::after{width:22px;height:22px}
.cframe .ch-nw::after{left:12px;top:12px;border-left-width:6px;border-top-width:6px}
.cframe .ch-ne::after{right:12px;top:12px;border-right-width:6px;border-top-width:6px}
.cframe .ch-sw::after{left:12px;bottom:12px;border-left-width:6px;border-bottom-width:6px}
.cframe .ch-se::after{right:12px;bottom:12px;border-right-width:6px;border-bottom-width:6px}
.ch-n,.ch-s{left:50%;margin-left:-17px;cursor:ns-resize}.ch-n{top:-17px}.ch-s{bottom:-17px}
.ch-e,.ch-w{top:50%;margin-top:-17px;cursor:ew-resize}.ch-w{left:-17px}.ch-e{right:-17px}
.cframe .ch-n::after,.cframe .ch-s::after{left:3px;width:28px;height:6px;background:#1e6fff;top:14px}
.cframe .ch-e::after,.cframe .ch-w::after{top:3px;width:6px;height:28px;background:#1e6fff;left:14px}

const $ = id => document.getElementById(id);
// HTML-д аюулгүй болгох (XSS-ээс хамгаална)
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Үнэ: 95'000₮
const fmt = n => Number(n || 0).toLocaleString("en-US").replace(/,/g, "'") + "₮";
// Огноо
const dt = s => s ? new Date(s).toLocaleString("mn-MN", { dateStyle: "short", timeStyle: "short" }) : "";
// Жижиг мэдэгдэл
const toast = m => { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 1800); };
// Ангиллууд (сайттай ижил)
// Ангиллууд: анхны утга. Админ "Сайтын тохиргоо → Ангилал"-аас өөрчилбөл түүгээр солигдоно
let CATS = { tops: "Цамц", outer: "Гадуур хувцас", bottoms: "Өмд", set: "Иж бүрдэл", shoes: "Гутал", hats: "Малгай", bags: "Цүнх", access: "Гоёл чимэглэл", figures: "Фигур" };
let sb, STATUSES = [];
// Аюулгүй байдал: сэтгэгдлийн зураг зөвхөн манай Supabase "reviews" сангийнх бол харуулна
// (хэрэглэгч "javascript:" мэт хортой холбоос оруулж админы эрхийг хулгайлахаас сэргийлнэ)
let SB_BASE = "";
const okPhoto = u => typeof u === "string" && !!SB_BASE && u.startsWith(SB_BASE + "/storage/v1/object/public/reviews/") && !/["'<>\s]/.test(u);
// Тохиргооноос ангиллын жагсаалтыг уншиж CATS-ийг шинэчилнэ
async function loadCats(){
  const { data } = await sb.from("settings").select("data").eq("id", "site").maybeSingle();
  const c = data && data.data && data.data.cats;
  if (Array.isArray(c) && c.length) CATS = Object.fromEntries(c.map(x => [x.id, x.label]));
}
// Одоо нээлттэй байгаа табын дугаар: хэрэглэгч хурдан таб солиход хуучин табын хоцорсон хариу шинэ табыг эвдэхээс сэргийлнэ
let VIEW = 0;

// Админ API руу нэвтрэх токентой хүсэлт илгээнэ
// path: аль серверийн хаяг руу (анхдагч нь /api/admin, видео оруулахад /api/fit-upload)
async function api(body, path = "/api/admin"){
  const { data } = await sb.auth.getSession();
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + (data.session ? data.session.access_token : "") }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!j.ok) throw new Error(j.error || "server");
  return j;
}

// ===== ЗАХИАЛГА =====
// ===== ОЛНООР СОНГОЖ УСТГАХ (захиалга, бараа, сэтгэгдэл) =====
// root: жагсаалтын хайрцаг. Мөр бүр data-row, дотроо <label class="selw"><input class="selc" data-sel="ID"></label>
// what: "захиалга" г.м., delOne(id): нэгийг устгах (алдаа бол throw), done(): дууссаны дараа дахин зурах
function bulkSel(root, { what, delOne, done }){
  const bar = document.createElement("div"); bar.className = "selbar"; root.before(bar);
  const boxes = () => [...root.querySelectorAll(".selc")];
  const ids = () => boxes().filter(c => c.checked).map(c => c.dataset.sel);
  const mark = c => { const r = c.closest("[data-row]"); if (r) r.classList.toggle("picked", c.checked); };
  const paint = () => {
    const on = root.classList.contains("selmode"), n = ids().length, all = boxes().length;
    bar.classList.toggle("on", on);
    bar.innerHTML = on
      ? `<button type="button" class="btn" data-sa>${n === all && all ? "☐ Бүгдийг болих" : "☑ Бүгдийг сонгох"}</button><span class="selcnt"><b>${n}</b> ${what} сонгосон</span>
         <button type="button" class="btn red" data-sd ${n ? "" : "disabled"}>🗑 Устгах${n ? ` (${n})` : ""}</button><button type="button" class="btn" data-sx>Болих</button>`
      : (all ? `<button type="button" class="btn" data-so>☑ Олноор сонгох</button>` : "");
    const q = k => bar.querySelector(k);
    if (q("[data-so]")) q("[data-so]").onclick = () => { root.classList.add("selmode"); paint(); };
    if (q("[data-sx]")) q("[data-sx]").onclick = () => { root.classList.remove("selmode"); boxes().forEach(c => { c.checked = false; mark(c); }); paint(); };
    if (q("[data-sa]")) q("[data-sa]").onclick = () => { const v = !(n === all); boxes().forEach(c => { c.checked = v; mark(c); }); paint(); };
    if (q("[data-sd]")) q("[data-sd]").onclick = async () => {
      const list = ids(); if (!list.length) return;
      if (!confirm(`Сонгосон ${list.length} ${what}-г устгах уу?\n\n«Түүх» хэсгээс сэргээж болно.`)) return;
      const b = q("[data-sd]"); b.disabled = true; let ok = 0, bad = 0;
      for (const [i, id] of list.entries()) { b.textContent = `Устгаж байна… ${i + 1}/${list.length}`; try { await delOne(id); ok++; } catch (e) { bad++; } }
      toast(bad ? `✓ ${ok} устгалаа · ⚠ ${bad} алдаатай` : `✓ ${ok} ${what} устгалаа`);
      root.classList.remove("selmode"); done();
    };
  };
  // Сонгох горимд мөр дээр дарахад сонгоно (задрахгүй); товч, холбоос, талбар өөрийнхөөрөө ажиллана
  root.addEventListener("click", e => {
    if (!root.classList.contains("selmode")) return;
    const row = e.target.closest("[data-row]"); if (!row) return;
    if (e.target.closest(".selw")) return;
    if (e.target.closest("button,a,select,textarea,input") && !e.target.closest("summary")) return;
    e.preventDefault(); const c = row.querySelector(".selc"); if (c) { c.checked = !c.checked; mark(c); paint(); }
  }, true);
  root.addEventListener("change", e => { if (e.target.classList.contains("selc")) { mark(e.target); paint(); } });
  paint();
}
// Мөр бүрийн сонгох чагт

    <!-- Захиалга бүр нэг мөр: дарахад доошоо задарч дэлгэрэнгүй харагдана -->
    <div class="olist" id="ob"><p class="mut">Уншиж байна…</p></div>`;
  const j = await api({ action: "orders", status });
  // Хариу ирэх хооронд өөр таб руу шилжсэн бол юу ч хийхгүй
  if (my !== VIEW) return;

  // Төлвөөр шүүх сонголт
  $("fst").innerHTML += STATUSES.map(s => `<option ${s === status ? "selected" : ""}>${esc(s)}</option>`).join("");
  $("fst").onchange = e => showOrders(e.target.value);
  $("rel").onclick = () => showOrders(status);

  const tone = st => /Цуцл/.test(st) ? "off" : /Төлөгдсөн|Хүргэгдсэн|Хүргэлтэнд|Бэлэн|Ирсэн/.test(st) ? "ok" : "wait";
  // Огноо товчоор: 11.13 18:07
  const sd = t => { const d = new Date(t); return `${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
  // Барааны тоо: "; "-ээр тусгаарлагдсан мөрүүд (хөнгөлөлтийн мөрийг тоолохгүй)
  const lines = o => String(o.items || "").split("; ").filter(Boolean);
  $("ob").innerHTML = j.rows.length ? `<p class="mut ocount">${j.rows.length} захиалга · дарж дэлгэрэнгүйг харна</p>` + j.rows.map(o => `<details class="ord ${tone(o.status)}" data-ord="${esc(o.code)}" data-row>
      <!-- Хураангуй мөр: дугаар, нэр, дүн, төлөв, огноо -->
      <summary><span class="oc">${selBox(o.code)}<b>${esc(o.code)}</b><small>${sd(o.created_at)}</small></span>
        <span class="on">${esc(o.name)}<small>${lines(o).filter(l => !/хөнгөлөлт/.test(l)).length} бараа · ${o.method === "qpay" ? "QPay" : "Данс"}</small></span>
        <span class="ot">${fmt(o.total)}</span><span class="os"><i></i>${esc(String(o.status).replace(/\s*✅/, ""))}</span><span class="ochev" aria-hidden="true">›</span></summary>
      <!-- Задарсан хэсэг -->
      <div class="obody">
        <div class="og">
          <div><small>Харилцагч</small><b>${esc(o.name)}</b><a href="tel:${esc(o.phone)}">📞 ${esc(o.phone)}</a></div>
          <div><small>Хүргэлт</small>${esc(o.delivery)}${o.address ? `<br>${esc(o.address)}` : ""}</div>
          ${o.note ? `<div><small>Тайлбар</small>📝 ${esc(o.note)}</div>` : ""}
          <div><small>Огноо</small>${dt(o.created_at)}${o.paid_at ? `<br><span class="okc">Төлсөн: ${dt(o.paid_at)}</span>` : ""}</div>
        </div>
        <div class="oitems"><small>Бараа</small><ul>${lines(o).map(l => `<li>${esc(l)}</li>`).join("")}</ul><div class="otot">Нийт <b>${fmt(o.total)}</b></div></div>
        <div class="oact"><label>Төлөв<select data-code="${esc(o.code)}">${STATUSES.map(s => `<option ${s === o.status ? "selected" : ""}>${esc(s)}</option>`).join("")}</select></label>
          <button type="button" class="btn" data-hide="${esc(o.code)}" data-v="${o.hidden ? 0 : 1}">${o.hidden ? "👁 Буцааж харуулах" : "🙈 Нуух"}</button>
          <button type="button" class="btn del" data-del="${esc(o.code)}">🗑 Устгах</button></div>
      </div></details>`).join("")
    : `<p class="msg">${status === "hidden" ? "Нуусан захиалга алга." : "Захиалга алга."}</p>`;
  // Олноор сонгож устгах
  if (j.rows.length) bulkSel($("ob"), { what: "захиалга", delOne: code => api({ action: "deleteOrder", code }), done: () => showOrders(status) });
  // Нэгийг задлахад бусдыг хураана (жагсаалт цэгцтэй байна)
  $("ob").querySelectorAll("details.ord").forEach(d => d.ontoggle = () => { if (d.open) $("ob").querySelectorAll("details.ord[open]").forEach(x => x !== d && (x.open = false)); });
  // Нэг цэс нээгдэхэд бусдыг хаана
  $("ob").querySelectorAll("details.more").forEach(d => d.ontoggle = () => { if (d.open) $("ob").querySelectorAll("details.more[open]").forEach(x => x !== d && (x.open = false)); });

  $("ob").querySelectorAll("[data-hide]").forEach(b => b.onclick = async () => {

    if (b.disabled) return; b.disabled = true; b.textContent = "Түр хүлээнэ үү…";

    catch (e) { b.disabled = false; toast("Алдаа: " + e.message + (e.message === "server" ? " — finn-history.sql ажиллуулсан уу?" : "")); }
  });
  // Устгах: эхний дарахад "Тийм, устгах" болж, дахин дарахад устгана
  $("ob").querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = "⚠ Тийм, устгах"; b.classList.add("sure"); return; }
    if (b.disabled) return; b.disabled = true; b.textContent = "Устгаж байна…";
    try { await api({ action: "deleteOrder", code: b.dataset.del }); toast("Устгалаа · \"Түүх\"-ээс сэргээж болно"); showOrders(status); }
    catch (e) { toast("Алдаа: " + e.message); }
  });
  // Төлөв өөрчлөхөд серверт хадгална
  $("ob").querySelectorAll("select").forEach(sel => sel.onchange = async () => {
    try { await api({ action: "setStatus", code: sel.dataset.code, status: sel.value }); toast("Хадгаллаа");

    catch (e) { toast("Алдаа: " + e.message); }
  });
}

// ===== БАРААНЫ ДЭЛГЭРЭНГҮЙ БИЧВЭР (Солонгос дэлгүүр шиг төвд, өнгөтэй) =====
// Энгийн тэмдэглэгээг HTML болгоно (эхлээд бүгдийг escape хийнэ — аюулгүй):
//   **тод**   → тод бичиг
//   !!улаан!! → улаан тод бичиг
//   # Гарчиг  → дэд гарчиг
//   ---       → хэвтээ зураас
//   | M | 64.5 | 60 |  → хүснэгт (эхний мөр нь толгой)
//   хоосон мөр → зай
function richDesc(t){
  const out = []; let tbl = null;
  // Мөр доторх тэмдэглэгээ
  const inl = s => esc(s).replace(/!!(.+?)!!/g, '<b class="rd-red">$1</b>').replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  // Цуглуулсан хүснэгтийн мөрүүдийг хүснэгт болгоно
  const flush = () => { if (!tbl) return;
    out.push(`<div class="rd-tw"><table class="rd-tbl">${tbl.map((r, i) => `<tr>${r.map(c => i ? `<td>${inl(c)}</td>` : `<th>${inl(c)}</th>`).join("")}</tr>`).join("")}</table></div>`); tbl = null; };
  for (const raw of String(t || "").split(/\r?\n/)) {
    const l = raw.trim();
    if (l.startsWith("|")) { (tbl = tbl || []).push(l.replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim())); continue; }
    flush();
    if (!l) out.push('<div class="rd-gap"></div>');
    else if (l === "---") out.push("<hr>");
    else if (l.startsWith("# ")) out.push(`<h5>${inl(l.slice(2))}</h5>`);
    else out.push(`<p>${inl(l)}</p>`);
  }
  flush(); return out.join("");
}
// Дэлгэрэнгүйн урт зургийг ӨРГӨНӨӨР нь багасгана (урт зураг жижгэрч уншигдахгүй болохоос сэргийлнэ)
function shrinkW(file, maxW = 1000){
  return new Promise((ok, no) => {
    const img = new Image();
    img.onload = () => {
      // Өргөн 1000px хүртэл; утасны хөтчийн хязгаараас хэтрэхгүйн тулд өндрийг 14000px-ээр хязгаарлана
      const s = Math.min(1, maxW / img.width, 14000 / img.height);
      const c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      c.toBlob(b => { if (b && b.type === "image/webp") return ok(b); c.toBlob(j => j ? ok(j) : no(new Error("шахаж чадсангүй")), "image/jpeg", .85); }, "image/webp", .85);
    };
    img.onerror = () => no(new Error("зураг уншиж чадсангүй")); img.src = URL.createObjectURL(file);
  });
}

// ===== ЗУРАГ ОРУУЛАХ (бараа, сайтын зураг) =====
// Зургийг хөтөч дээр 1400px болгож webp рүү шахна (хурдан ачаалагдана)
// iPhone-ий Safari webp үүсгэж чаддаггүй (оронд нь маш том PNG гаргадаг) тул тэр үед JPEG болгоно
function shrink(file, max = 1400){
  return new Promise((ok, no) => {
    const img = new Image();
    img.onload = () => {
      // Хэмжээг багасгах харьцаа (томруулахгүй)
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      const g = c.getContext("2d");
      // Тунгалаг PNG-ийн арыг цагаан болгоно (JPEG-д хар болохоос сэргийлнэ)
      g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
      g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      // Эхлээд webp оролдоно; хөтөч webp биш юм буцаавал JPEG-ээр дахин шахна
      c.toBlob(b => {
        if (b && b.type === "image/webp") return ok(b);
        c.toBlob(j => j ? ok(j) : no(new Error("шахаж чадсангүй")), "image/jpeg", .82);
      }, "image/webp", .82);
    };
    img.onerror = () => no(new Error("зураг уншиж чадсангүй")); img.src = URL.createObjectURL(file);
  });
}
// Шахсан зургийг Storage-д хадгалах (өргөтгөл, төрлийг жинхэнэ форматаар нь; 1 жил кэшлэнэ)
async function putImg(blob, folder){
  const ext = blob.type === "image/webp" ? "webp" : "jpg";
  const path = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}.${ext}`;
  const { error } = await sb.storage.from("products").upload(path, blob, { contentType: blob.type, cacheControl: "31536000" });
  if (error) throw error;
  return sb.storage.from("products").getPublicUrl(path).data.publicUrl;
}
// ===== ЗУРАГ ТАЙРАХ (бараа оруулахад) — Windows-ийн зураг тайрагч шиг =====
// Хүрээний 4 өнцөг, 4 талыг чирж тайрна; хүрээн дотор чирвэл хүрээ зөөгдөнө; гадна талаар чирвэл зураг зөөгдөнө.
// Сүүлд сонгосон харьцааг санана (дараагийн зурагт ижлээр нь)
let CROP_RATIO = "3:4";
// Харьцаанууд: [нэр, өргөн/өндөр (null = чөлөөт), товчны бичиг]
const CROP_RATIOS = [["free", null, "Чөлөөт"], ["3:4", 3 / 4, "Карт 3:4"], ["1:1", 1, "1:1"], ["4:5", 4 / 5, "4:5"], ["16:9", 16 / 9, "16:9"]];
// src: File/Blob эсвэл зургийн холбоос. Буцаах утга: тайрсан Blob, "orig" (тайралгүй), "origAll" (үлдсэнийг тайралгүй), null (болих)
function cropImage(src, label = "", multi = false){
  return new Promise(async resolve => {
    // Зургийг ачаална (холбоос бол татаж авна — canvas-д ашиглахын тулд)
    let url;
    try { url = typeof src === "string" ? URL.createObjectURL(await (await fetch(src)).blob()) : URL.createObjectURL(src); }
    catch (e) { toast("Зургийг уншиж чадсангүй"); return resolve(null); }
    const img = new Image();
    img.onerror = () => { URL.revokeObjectURL(url); toast("Зургийг уншиж чадсангүй"); resolve(null); };
    img.onload = () => {
      const iw = img.naturalWidth, ih = img.naturalHeight;
      // Цонхны HTML: 4 өнцөг (h-nw…), 4 тал (h-n…) бариул
      const box = document.createElement("div"); box.className = "crop";
      box.innerHTML = `<div class="cbox" role="dialog" aria-modal="true" aria-label="Зураг тайрах">
        <div class="chd"><b>Зураг тайрах ${esc(label)}</b><span class="mut">Өнцөг, талыг чирж тайрна · хүрээг чирж зөөнө · гадна талыг чирж зургийг зөөнө</span></div>
        <div class="cstage" id="cstage"><img id="cimg" alt="" draggable="false">
          <div class="cframe" id="cframe">${["nw", "n", "ne", "e", "se", "s", "sw", "w"].map(h => `<i class="ch ch-${h}" data-h="${h}"></i>`).join("")}<span class="csize" id="csize"></span></div></div>
        <div class="crat">${CROP_RATIOS.map(([k, , t]) => `<button type="button" data-cr="${k}" class="${k === CROP_RATIO ? "on" : ""}">${t}</button>`).join("")}
          <button type="button" id="creset" title="Анхны байдал руу">↺ Анхны байдал</button></div>
        <label class="czoom"><span>Томруулах</span><input type="range" id="czoom" min="1" max="4" step="0.01" value="1"></label>
        <div class="cbtns"><button type="button" class="btn" id="cskip">Болих</button>
          <button type="button" class="btn" id="corig">Тайралгүй</button>${multi ? '<button type="button" class="btn" id="corigall">Үлдсэнийг тайралгүй</button>' : ""}
          <button type="button" class="btn dark" id="cok">✂ Тайрах</button></div></div>`;
      document.body.appendChild(box);
      const stage = box.querySelector("#cstage"), cim = box.querySelector("#cimg"), frame = box.querySelector("#cframe"), zoom = box.querySelector("#czoom");
      cim.src = url;
      // Байдал: W,H = талбай; s0 = бүтэн харагдах масштаб; s = одоогийн масштаб; x,y = зургийн зүүн дээд булан;
      // fx,fy,fw,fh = тайрах хүрээ (талбайн координатаар)
      let W, H, s0, s, x, y, fx, fy, fw, fh;
      const MIN = 40, PAD = 14;
      const ratio = () => (CROP_RATIOS.find(r => r[0] === CROP_RATIO) || CROP_RATIOS[0])[1];
      // Хүрээ байж болох хязгаар: зураг ба талбайн огтлолцол
      const lim = () => ({ l: Math.max(0, x), t: Math.max(0, y), r: Math.min(W, x + iw * s), b: Math.min(H, y + ih * s) });
      // Хүрээг хязгаар дотор байлгана (хэтэрвэл багасгаж, байрлалыг нь засна)
      const fitFrame = () => {
        const L = lim(), r = ratio();
        fw = Math.min(fw, L.r - L.l); fh = Math.min(fh, L.b - L.t);
        // Тогтмол харьцаатай бол харьцааг хадгалж багасгана
        if (r) { if (fw / fh > r) fw = fh * r; else fh = fw / r; }
        fw = Math.max(Math.min(MIN, L.r - L.l), fw); fh = Math.max(Math.min(MIN, L.b - L.t), fh);
        fx = Math.min(Math.max(fx, L.l), L.r - fw); fy = Math.min(Math.max(fy, L.t), L.b - fh);
      };
      // Дэлгэцэнд зурна
      const paint = () => {
        cim.style.width = iw * s + "px"; cim.style.height = ih * s + "px"; cim.style.transform = `translate(${x}px,${y}px)`;
        Object.assign(frame.style, { left: fx + "px", top: fy + "px", width: fw + "px", height: fh + "px" });
        // Тайрсны дараах бодит хэмжээ (пиксел)
        box.querySelector("#csize").textContent = `${Math.round(fw / s)} × ${Math.round(fh / s)}`;
      };
      // Эхлэх / харьцаа солих: зургийг бүтнээр нь харуулж, хүрээг хамгийн том байхаар төвд тавина
      const layout = (keepZoom) => {
        W = stage.clientWidth; H = stage.clientHeight;
        s0 = Math.min((W - PAD * 2) / iw, (H - PAD * 2) / ih);
        if (!keepZoom) zoom.value = 1;
        s = s0 * Number(zoom.value); x = (W - iw * s) / 2; y = (H - ih * s) / 2;
        const L = lim(), r = ratio(), aw = L.r - L.l, ah = L.b - L.t;
        if (r) { fw = Math.min(aw, ah * r); fh = fw / r; } else { fw = aw; fh = ah; }
        fx = L.l + (aw - fw) / 2; fy = L.t + (ah - fh) / 2; fitFrame(); paint();
      };
      // Томруулах: хүрээний төвийг тогтоож зургийг томруулна
      const setZoom = z => {
        z = Math.min(4, Math.max(1, z)); const cx = fx + fw / 2, cy = fy + fh / 2, ns = s0 * z;
        x = cx - (cx - x) * ns / s; y = cy - (cy - y) * ns / s; s = ns; zoom.value = z;
        // Зургийн ирмэг талбайгаас хэт холдохгүй (хоосон зай гаргахгүй)
        const cw = iw * s, chh = ih * s;
        x = cw <= W ? (W - cw) / 2 : Math.min(0, Math.max(W - cw, x)); y = chh <= H ? (H - chh) / 2 : Math.min(0, Math.max(H - chh, y));
        fitFrame(); paint();
      };
      layout();
      zoom.oninput = () => setZoom(Number(zoom.value));
      stage.addEventListener("wheel", e => { e.preventDefault(); setZoom(Number(zoom.value) * (e.deltaY < 0 ? 1.08 : 1 / 1.08)); }, { passive: false });
      // ----- Чирэх: бариул (тайрах), хүрээ (зөөх), гадна (зургийг зөөх), 2 хуруу (томруулах) -----
      const pts = new Map(); let drag = null, pinch = null;
      stage.addEventListener("pointerdown", e => {
        e.preventDefault(); stage.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: Number(zoom.value) }; drag = null; return; }
        const h = e.target.dataset && e.target.dataset.h;
        // Дан талыг (дээд, доод, зүүн, баруун) чирвэл чөлөөт горимд шилжинэ
        if (h && h.length === 1 && ratio()) { CROP_RATIO = "free"; box.querySelectorAll("[data-cr]").forEach(b => b.classList.toggle("on", b.dataset.cr === "free")); }
        drag = { mode: h ? "resize" : e.target === frame ? "move" : "pan", h, sx: e.clientX, sy: e.clientY, f: { fx, fy, fw, fh }, i: { x, y } };
      });
      stage.addEventListener("pointermove", e => {
        if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (pts.size === 2 && pinch) { const [a, b] = [...pts.values()]; setZoom(pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d); return; }
        if (!drag) return;
        const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy, o = drag.f, L = lim(), r = ratio();
        if (drag.mode === "move") { fx = o.fx + dx; fy = o.fy + dy; fw = o.fw; fh = o.fh; }
        else if (drag.mode === "pan") {
          // Зургийг зөөнө (томруулсан үед), хүрээг зургийн дотор байлгана
          const cw = iw * s, chh = ih * s;
          x = cw <= W ? (W - cw) / 2 : Math.min(0, Math.max(W - cw, drag.i.x + dx));
          y = chh <= H ? (H - chh) / 2 : Math.min(0, Math.max(H - chh, drag.i.y + dy));
        } else {
          // Тайрах: тус бүр талыг чирнэ (эсрэг тал нь хөдлөхгүй)
          let l = o.fx, t = o.fy, rr = o.fx + o.fw, b = o.fy + o.fh; const h = drag.h;
          if (h.includes("w")) l = Math.min(rr - MIN, Math.max(L.l, o.fx + dx));
          if (h.includes("e")) rr = Math.max(l + MIN, Math.min(L.r, o.fx + o.fw + dx));
          if (h.includes("n")) t = Math.min(b - MIN, Math.max(L.t, o.fy + dy));
          if (h.includes("s")) b = Math.max(t + MIN, Math.min(L.b, o.fy + o.fh + dy));
          // Тогтмол харьцаатай үед (зөвхөн өнцгөөр) харьцааг хадгална — эсрэг өнцөг тогтвортой
          if (r && h.length === 2) {
            let w = rr - l, hh = b - t;
            if (w / hh > r) w = hh * r; else hh = w / r;
            // Хязгаараас хэтрэхгүй
            const maxW = h.includes("w") ? (o.fx + o.fw) - L.l : L.r - o.fx, maxH = h.includes("n") ? (o.fy + o.fh) - L.t : L.b - o.fy;
            if (w > maxW) { w = maxW; hh = w / r; } if (hh > maxH) { hh = maxH; w = hh * r; }
            if (h.includes("w")) l = (o.fx + o.fw) - w; else rr = l + w;
            if (h.includes("n")) t = (o.fy + o.fh) - hh; else b = t + hh;
          }
          fx = l; fy = t; fw = rr - l; fh = b - t;
        }
        fitFrame(); paint();
      });
      const up = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (!pts.size) drag = null; };
      stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
      // Харьцааны товч, анхны байдал
      box.querySelectorAll("[data-cr]").forEach(b => b.onclick = () => { CROP_RATIO = b.dataset.cr; box.querySelectorAll("[data-cr]").forEach(x => x.classList.toggle("on", x === b)); layout(true); });
      box.querySelector("#creset").onclick = () => layout(false);
      // Цонх хэмжээ өөрчлөгдвөл дахин байрлуулна
      const onResize = () => layout(true); addEventListener("resize", onResize);
      const done = v => { removeEventListener("resize", onResize); box.remove(); URL.revokeObjectURL(url); resolve(v); };
      box.querySelector("#cskip").onclick = () => done(null);
      box.querySelector("#corig").onclick = () => done("orig");
      if (box.querySelector("#corigall")) box.querySelector("#corigall").onclick = () => done("origAll");
      // Тайрах: хүрээн доторх хэсгийг анхны нягтралаар нь зурж авна (дээд тал нь 2400px)
      box.querySelector("#cok").onclick = () => {
        const sx = Math.max(0, (fx - x) / s), sy = Math.max(0, (fy - y) / s), sw = Math.min(iw - sx, fw / s), sh = Math.min(ih - sy, fh / s);
        const k = Math.min(1, 2400 / Math.max(sw, sh));
        const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(sw * k)); c.height = Math.max(1, Math.round(sh * k));
        const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
        g.imageSmoothingQuality = "high"; g.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
        c.toBlob(b => b ? done(b) : (toast("Тайрч чадсангүй"), done("orig")), "image/jpeg", .95);
      };
    };
    img.src = url;
  });
}

// ===== БАРААГ ОЛНООР ОРУУЛАХ (Excel / CSV + зургууд) =====
// Загварын баганууд (Excel-ийн эхний мөр). * тэмдэгтэй нь заавал бөглөнө.
const BK_COLS = ["Нэр*", "Ангилал*", "Үнэ*", "Хуучин үнэ", "Брэнд", "Нэмэлт мөр", "Тайлбар", "Сонголт", "Захиалгаар", "Тэмдэг", "Зураг", "Харуулах"];
// Загвар файл татах (Excel-д кирилл зөв харагдахаар UTF-8 BOM-тэй CSV)
function bkTemplate(){
  const cats = Object.values(CATS);
  const rows = [BK_COLS,
    ["ЖИШЭЭ: Oversize цамц", cats[0] || "Цамц", "89000", "120000", "Asaky Prezaky", "Солонгос брэнд", "Хөвөн даавуу, чөлөөт загвар", "Өнгө: Хар, Цагаан | Хэмжээ: S, M, L", "тийм", "Шинэ", "tsamts1.jpg, tsamts2.jpg", "тийм"],
    ["ЖИШЭЭ: Зоро фигур", cats[cats.length - 1] || "Фигур", "150000", "", "One Piece", "Banpresto", "25 см өндөр", "", "үгүй", "", "zoro.jpg", "тийм"]];
  // Нэг нүдэнд таслал, хашилт байвал хашилтад хийнэ
  const cell = v => /[",\n;]/.test(v) ? `"${String(v).replace(/"/g, '""')}"` : v;
  const csv = "﻿" + rows.map(r => r.map(cell).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = "finn-baraa-zagvar.csv"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
// CSV текстийг мөр, баганад задална (хашилт доторх таслал, шинэ мөрийг зөв ойлгоно; "," эсвэл ";" тусгаарлагч)
function bkCsv(t){
  t = t.replace(/^﻿/, "");
  const first = t.split(/\r?\n/)[0] || "";
  const sep = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ";" : ",";
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"' && t[i + 1] === '"') { cur += '"'; i++; } else if (c === '"') q = false; else cur += c; }
    else if (c === '"') q = true;
    else if (c === sep) { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && t[i + 1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += c;
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  return rows;
}
// Excel (.xlsx) файлыг уншихын тулд SheetJS санг хэрэгтэй үед л ачаална
function bkXlsxLib(){
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((ok, no) => {
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    sc.onload = () => ok(window.XLSX); sc.onerror = () => no(new Error("Excel уншигч ачаалсангүй — CSV-ээр хадгалаад оролдоно уу"));
    document.head.appendChild(sc);
  });
}
// Файлыг (CSV эсвэл Excel) мөрүүдийн массив болгоно
async function bkRead(file){
  if (/\.xlsx?$/i.test(file.name)) {
    const X = await bkXlsxLib();
    const wb = X.read(await file.arrayBuffer(), { type: "array" });
    return X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: "" });
  }
  return bkCsv(await file.text());
}
// "тийм / yes / 1 / x" → true
const bkYes = (v, def) => { v = String(v || "").trim().toLowerCase(); if (!v) return def; return /^(тийм|тиим|tiim|yes|y|1|x|✓|true|за)$/.test(v); };
// "89'000₮", "89 000", "89,000" → 89000
const bkNum = v => { const n = Number(String(v || "").replace(/[\s'’,₮]/g, "").replace(/төг.*$/i, "")); return isFinite(n) ? Math.round(n) : NaN; };
// Мөр бүрийг шалгаж барааны мэдээлэл болгоно (алдаа, анхааруулгатай)
function bkCheck(rows, files, existing){
  // Эхний мөр гарчиг: баганын байрлалыг нэрээр нь олно (дараалал өөр байсан ч болно)
  const head = (rows[0] || []).map(h => String(h).replace(/\*/g, "").trim().toLowerCase());
  const col = name => head.indexOf(name.replace("*", "").toLowerCase());
  const C = Object.fromEntries(BK_COLS.map(n => [n.replace("*", ""), col(n)]));
  if (C["Нэр"] < 0 || C["Ангилал"] < 0 || C["Үнэ"] < 0) return { fatal: "Эхний мөрөнд «Нэр», «Ангилал», «Үнэ» баганууд олдсонгүй. Загвар файлыг ашиглана уу." };
  // Сонгосон зургийн файлуудыг нэрээр нь (жижиг үсгээр) олно
  const fmap = new Map([...files].map(f => [f.name.trim().toLowerCase(), f]));
  // Ангиллыг нэр эсвэл ID-аар таниулна
  const catOf = v => { v = String(v || "").trim().toLowerCase(); return Object.keys(CATS).find(k => k === v || String(CATS[k]).toLowerCase() === v); };
  const names = new Set(existing.map(x => String(x.name).trim().toLowerCase()));
  const out = [];
  rows.slice(1).forEach((r, i) => {
    const g = k => C[k] >= 0 ? String(r[C[k]] ?? "").trim() : "";
    // Хоосон мөр болон жишээ мөрийг алгасна
    if (!r.some(v => String(v).trim())) return;
    if (/^жишээ/i.test(g("Нэр"))) return;
    const e = [], w = [];
    const name = g("Нэр"); if (!name) e.push("нэр хоосон");
    const cat = catOf(g("Ангилал")); if (!cat) e.push(`ангилал «${g("Ангилал")}» буруу`);
    const price = bkNum(g("Үнэ")); if (!(price > 0)) e.push("үнэ буруу");
    let was = g("Хуучин үнэ") ? bkNum(g("Хуучин үнэ")) : null;
    if (was !== null && !(was > 0)) { w.push("хуучин үнэ буруу тул хаслаа"); was = null; }
    if (was && was <= price) { w.push("хуучин үнэ шинэ үнээс бага тул хаслаа"); was = null; }
    let badge = g("Тэмдэг"); if (badge && !["Шинэ", "Хит", "Хямдрал", "Онцлох"].includes(badge)) { w.push(`тэмдэг «${badge}» танигдсангүй`); badge = ""; }
    // Сонголт: "Өнгө: Хар, Цагаан | Хэмжээ: S, M" → мөр мөрөөр
    const options = parseOpts(g("Сонголт").split(/\s*[|\n]\s*/).join("\n"));
    if (g("Сонголт") && !options.length) w.push("сонголтын бичлэг буруу (жишээ: Өнгө: Хар, Цагаан)");
    // Зураг: файлын нэр эсвэл https:// холбоос
    const imgs = [];
    for (const n of g("Зураг").split(/[,;\n]/).map(x => x.trim()).filter(Boolean)) {
      if (/^https:\/\//i.test(n)) imgs.push({ url: n });
      else if (fmap.has(n.toLowerCase())) imgs.push({ file: fmap.get(n.toLowerCase()) });
      else e.push(`зураг «${n}» сонгогдоогүй`);
    }
    if (!imgs.length && !e.length) w.push("зураггүй");
    if (name && names.has(name.toLowerCase())) w.push("ижил нэртэй бараа аль хэдийн байна");
    names.add(name.toLowerCase());
    out.push({ line: i + 2, e, w, imgs, row: { cat, name, series: g("Брэнд"), line: g("Нэмэлт мөр"), price, was, badge: badge || null,
      descr: g("Тайлбар"), options, pre: bkYes(g("Захиалгаар"), true), active: bkYes(g("Харуулах"), true), extra: {} } });
  });
  return { list: out };
}

      ${L.map(x => `<tr class="${x.e.length ? "bad" : ""}"><td>${x.line}</td><td>${esc(x.row.name)}<small>${esc(x.row.series || "")}</small></td><td>${esc(CATS[x.row.cat] || "—")}</td>

}
// Шалгалт давсан мөрүүдийг зурагтай нь хамт мэдээллийн санд оруулна
async function bkImport(good, existing){

  const bar = $("bkbar"); bar.hidden = false;
  // ID-г нэрнээс үүсгэнэ (кирилл → латин), давхардвал ард нь тэмдэгт нэмнэ
  const TR = { а:"a",б:"b",в:"v",г:"g",д:"d",е:"e",ё:"yo",ж:"j",з:"z",и:"i",й:"i",к:"k",л:"l",м:"m",н:"n",о:"o",ө:"u",п:"p",р:"r",с:"s",т:"t",у:"u",ү:"u",ф:"f",х:"h",ц:"ts",ч:"ch",ш:"sh",щ:"sh",ъ:"",ы:"y",ь:"",э:"e",ю:"yu",я:"ya" };
  const used = new Set(existing.map(x => x.id));
  const mkId = n => { let v = String(n).toLowerCase().split("").map(c => TR[c] ?? c).join("").replace(/[^a-z0-9_-]+/g, "-").replace(/^-+|-+$/g, "").replace(/-{2,}/g, "-").slice(0, 34) || "item";
    while (used.has(v)) v = v.slice(0, 34) + "-" + Math.random().toString(36).slice(2, 6); used.add(v); return v; };
  // Шинэ барааг жагсаалтын хамгийн дээр, Excel-ийн дарааллаар байрлуулна
  let top = Math.max(0, ...existing.map(x => Number(x.sort) || 0)) + good.length;
  let ok = 0, bad = 0; const fails = [];
  for (const [n, x] of good.entries()) {
    $("bkmsg").textContent = `Оруулж байна… ${n + 1}/${good.length} · ${x.row.name}`;
    try {
      const id = mkId(x.row.name), images = [];
      // Зургийг шахаж хадгална (холбоос бол шууд)
      for (const im of x.imgs) images.push(im.url || await upload(im.file, id));
      const { error } = await sb.from("products").insert({ ...x.row, id, images, sort: top-- });
      if (error) throw error;
      ok++;
    } catch (err) { bad++; fails.push(`${x.line}-р мөр (${x.row.name}): ${err.message || err}`); }
    bar.firstElementChild.style.width = Math.round((n + 1) / good.length * 100) + "%";
  }
  alert(`Дууслаа ✓\n\nОрсон: ${ok} бараа${bad ? `\nАлдаа: ${bad}\n\n${fails.slice(0, 8).join("\n")}` : ""}`);
  showProducts();
}

// ===== ХУУЧИН ТОМ ЗУРГУУДЫГ ШАХАХ (нэг удаа ажиллуулна) =====
// Манай Storage-ийн зураг мөн эсэх
const OUR_IMG = "/storage/v1/object/public/products/";
// Нэг зургийг шалгаж, том бол шахаад шинэ холбоос буцаана (жижиг бол хуучнаараа)
async function slimOne(url, folder, max, stat){
  if (typeof url !== "string" || !url.includes(OUR_IMG)) return url;
  try {
    const r = await fetch(url); if (!r.ok) return url;
    const b = await r.blob(); stat.seen++; stat.before += b.size;
    // 300KB-аас бага webp/jpeg бол хөндөхгүй
    if (b.size < 300 * 1024 && b.type !== "image/png") { stat.after += b.size; return url; }
    const nb = await shrink(b, max);
    // Шахаад нэг их багасаагүй бол хуучнаар нь үлдээнэ
    if (nb.size > b.size * .8) { stat.after += b.size; return url; }
    const nu = await putImg(nb, folder); stat.done++; stat.after += nb.size; return nu;
  } catch (e) { stat.bad++; return url; }
}
// Объект/массив дотор байгаа бүх зургийн холбоосыг шахна (тохиргооны слайд, баннер гэх мэт)
async function slimDeep(v, stat, max){
  if (typeof v === "string") return slimOne(v, "site", max, stat);
  if (Array.isArray(v)) { const o = []; for (const x of v) o.push(await slimDeep(x, stat, max)); return o; }
  if (v && typeof v === "object") { const o = {}; for (const k of Object.keys(v)) o[k] = await slimDeep(v[k], stat, k === "slides" ? 2000 : max); return o; }
  return v;
}
// Бүх бараа + сайтын тохиргооны зургийг шахна
async function slimAll(btn){
  if (!confirm("Бүх барааны болон сайтын том зургуудыг шахаж жижигрүүлэх үү?\n\nКомпьютерын Chrome дээр ажиллуулна уу. Хэдэн минут болно — цонхоо бүү хаагаарай.")) return;
  const stat = { seen: 0, done: 0, bad: 0, before: 0, after: 0 };
  btn.disabled = true;
  const { data: list, error } = await sb.from("products").select("id,images");
  if (error) { btn.disabled = false; return toast("Алдаа: " + error.message); }
  for (const [i, p] of list.entries()) {
    btn.textContent = `Шахаж байна… ${i + 1}/${list.length}`;
    const imgs = [];
    for (const u of (p.images || [])) imgs.push(await slimOne(u, p.id, 1400, stat));
    // Өөрчлөгдсөн бараа л хадгална
    if (JSON.stringify(imgs) !== JSON.stringify(p.images || [])) {
      const { error: e2 } = await sb.from("products").update({ images: imgs }).eq("id", p.id);
      if (e2) stat.bad++;
    }
  }
  // Сайтын тохиргоо (слайд, баннер, нүүр зураг)
  btn.textContent = "Сайтын зургууд…";
  const { data: st } = await sb.from("settings").select("data").eq("id", "site").maybeSingle();
  if (st && st.data) {
    const nd = await slimDeep(st.data, stat, 1400);
    if (JSON.stringify(nd) !== JSON.stringify(st.data)) {
      const { data: u } = await sb.auth.getUser();
      await sb.from("settings").upsert({ id: "site", data: nd, updated_at: new Date().toISOString(), updated_by: u && u.user ? u.user.id : null });
    }
  }
  btn.disabled = false; btn.textContent = "🗜 Зургуудыг шахах";
  const mb = n => (n / 1048576).toFixed(1) + "MB";
  alert(`Дууслаа ✓\n\nШалгасан: ${stat.seen} зураг\nШахсан: ${stat.done}\nАлдаа: ${stat.bad}\nНийт хэмжээ: ${mb(stat.before)} → ${mb(stat.after)}`);
  showProducts();
}
// "Өнгө: Хар, Цагаан" мөрүүдийг [{label, values}] болгоно, эсрэгээр нь
// Сонголт уншина: "Өнгө: Хар, Улаан". Хоёр цэггүй мөр ("Хар, Улаан") бол өнгө гэж үзнэ

    <!-- Хадгалах товч доод талд үргэлж харагдана -->
    <!-- ⑤ САЙТАД ИНГЭЖ ХАРАГДАНА: бүх мэдээллийг оруулсны дараа шууд шинэчлэгдэнэ -->
    <div class="full pfsec pvsec"><div class="pfh"><i>5</i><div><b>Сайтад ингэж харагдана</b><span>Хадгалахаас өмнө шалгаарай. Өнгө дээр дарж зураг солигдохыг үзэж болно.</span></div></div>
      <div id="pfchk"></div><div class="pvwrap" id="pfpv"></div></div>

    <div class="full pfsave"><div class="pvw" id="pvw"></div><button class="btn" type="button" id="pvgo" title="Сайтад ингэж харагдана">👁 Харах</button><button class="btn dark" type="submit" id="psave">Хадгалах</button>${isNew ? "" : '<button class="btn red" type="button" id="pdel">Устгах</button>'}</div>
  </form>`;
  // Оруулж байгаа зургуудын төлөв: { c: өнгө, s: "up" | "bad" }
  let pending = [];
  // Тайрсан зургийн өмнөх хувилбар: шинэ холбоос → хуучин холбоос эсвэл анхны файл (↶ Буцаах товчинд)
  const undo = {};
  // Өнгөний дугуй (сонгоход ойлгомжтой харагдана)
  const SW = { "Хар": "#111", "Цагаан": "#fff", "Саарал": "#9a9a9a", "Бор": "#7a4b2a", "Бэж": "#dcc7a6", "Улаан": "#d62828", "Ягаан": "#f2a2bd", "Улбар шар": "#f28c28", "Шар": "#f3cf00", "Ногоон": "#2e8b57", "Хаки": "#8b8a5c", "Цэнхэр": "#3b7be0", "Хөх": "#1d2f6e", "Нил ягаан": "#7b3fa0" };
  const dot = c => `<i class="sw" style="${SW[c] ? `background:${SW[c]}` : "background:conic-gradient(#e33,#fc0,#3c6,#39f,#c3f,#e33)"}"></i>`;
  // Доод мөрийн жижиг харагдац: гол зураг, нэр, үнэ, тоо
  const summary = () => {

  // ----- ⑤ Сайтад ингэж харагдана: жагсаалтын карт + барааны хуудас (утасны хэмжээгээр) -----
  let pvT, pvColor = "";
  const pvLater = () => { clearTimeout(pvT); pvT = setTimeout(drawPreview, 150); };
  const drawPreview = () => {

        <div class="pvcard"><div class="ph">${images[0] ? `<img src="${esc(images[0])}" alt="">` : "📷"}${pct ? `<i>-${pct}%</i>` : ""}</div>

          <div class="pvgal">${shown ? `<img src="${esc(shown)}" alt="">` : "<span>📷 Зураг алга</span>"}</div>
          ${images.length > 1 ? `<div class="pvthumbs">${images.map(u => `<img src="${esc(u)}" class="${u === shown ? "on" : ""}" data-pvi="${esc(u)}" alt="">`).join("")}</div>` : ""}
          <div class="pvb"><span class="ser">${esc(ser)}</span><h3>${esc(nm || "Барааны нэр")}</h3><div class="pr">${price}</div>
            ${colors.length ? `<div class="pvo"><small>Өнгө</small><div>${colors.map(c => `<button type="button" data-pvc="${esc(c)}" aria-pressed="${c === pvColor}">${esc(c)}</button>`).join("")}</div></div>` : ""}

          ${det.length || ds ? `<div class="pvd"><h4>Барааны дэлгэрэнгүй</h4>${det.map(u => `<img src="${esc(u)}" alt="">`).join("")}${ds ? `<div class="rd-txt">${richDesc(ds)}</div>` : ""}</div>` : ""}
        </div></div>`;
    // Өнгө дээр дарахад тэр өнгийн зураг гарна (сайттай адил)
    box.querySelectorAll("[data-pvc]").forEach(b => b.onclick = () => { pvColor = pvColor === b.dataset.pvc ? "" : b.dataset.pvc; drawPreview(); });
    box.querySelectorAll("[data-pvi]").forEach(im => im.onclick = () => { pvColor = imgColor[im.dataset.pvi] || ""; const g = box.querySelector(".pvgal img"); if (g) g.src = im.dataset.pvi; box.querySelectorAll("[data-pvi]").forEach(x => x.classList.toggle("on", x === im)); });
  };
  // ----- Өнгө: бүх өнгө нэг мөрөнд, сонгосон нь тод (дахин дарвал хасна) -----
  const drawColors = () => {
    const list = [...PAL, ...colors.filter(c => !PAL.includes(c))];
    $("colbar").innerHTML = list.map(c => `<button type="button" class="cpk" aria-pressed="${colors.includes(c)}" data-pc="${esc(c)}">${dot(c)}${esc(c)}${colors.includes(c) ? " ✓" : ""}</button>`).join("");
    $("colbar").querySelectorAll("[data-pc]").forEach(b => b.onclick = () => {
      const c = b.dataset.pc;
      if (colors.includes(c)) {
        const n = images.filter(u => imgColor[u] === c).length;
        if (n && !confirm(`«${c}» өнгийг хасах уу?\nТүүний ${n} зураг «Зургууд» карт руу шилжинэ.`)) return;
        colors = colors.filter(x => x !== c); images.forEach(u => { if (imgColor[u] === c) delete imgColor[u]; });
      } else colors.push(c);
      drawColors(); drawThumbs(); drawCS();
    });
  };
  const addNew = () => { const v = $("colnew").value.trim().slice(0, 30); if (!v) return; if (!colors.includes(v)) colors.push(v); $("colnew").value = ""; drawColors(); drawThumbs(); drawCS(); };
  $("colnewb").onclick = addNew; $("colnew").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); addNew(); } };
  // ----- Өнгө бүрийн хэмжээ: дээр сонгосон өнгө бүр нэг мөр, тухайн өнгөнд байгаа хэмжээг дарж сонгоно -----
  // Тухайн өнгөний одоогийн жагсаалт (бичигдээгүй бол бүх хэмжээ)
  const csList = c => colorSizes[c] ? colorSizes[c].filter(x => sizes.includes(x)) : [...sizes];
  // Жагсаалтыг хадгална: бүх хэмжээ бол тусгай тохиргоо хэрэггүй (устгана), хоосон ч байж болно
  const csSet = (c, list) => { if (sizes.every(x => list.includes(x))) delete colorSizes[c]; else colorSizes[c] = sizes.filter(x => list.includes(x)); };
  const drawCS = () => {
    const box = $("csbox"); if (!box) return;

    if (!colors.length || !sizes.length) { box.className = ""; box.innerHTML = ""; return; }
    box.className = "csbox";
    box.innerHTML = `<div class="cshead"><div><b>Өнгө бүрт байгаа хэмжээ</b><small class="mut">Хэмжээн дээр дарж сонгоно, дахин дарвал болино. Хар = байгаа, <s>зураастай</s> = байхгүй.</small></div>
        <span class="row" style="gap:6px"><button type="button" class="btn" data-csall="1">✓ Бүгдийг сонгох</button><button type="button" class="btn" data-csall="0">✕ Бүгдийг болих</button></span></div>`
      + colors.map(c => { const l = csList(c);
        return `<div class="csrow ${l.length ? "" : "empty"}"><b><i class="sw" style="${SW[c] ? `background:${SW[c]}` : "background:conic-gradient(#e33,#fc0,#3c6,#39f,#c3f,#e33)"}"></i>${esc(c)}</b>
          <div class="cssz">${sizes.map(z => `<button type="button" class="szc ${l.includes(z) ? "" : "off"}" aria-pressed="${l.includes(z)}" data-cc="${esc(c)}" data-cz="${esc(z)}">${esc(z)}</button>`).join("")}</div>

    // Нэг хэмжээ: дарвал сонгоно, дахин дарвал болино
    box.querySelectorAll("[data-cc]").forEach(b => b.onclick = () => {

    // Мөрийн товч: тухайн өнгөнд бүгдийг сонгох / бүгдийг болих

    box.querySelectorAll("[data-csall]").forEach(b => b.onclick = () => { colors.forEach(c => csSet(c, b.dataset.csall === "1" ? [...sizes] : [])); drawCS(); pvLater(); });
  };
  // ----- Хэмжээ: бэлэн багцаас дарж сонгоно -----
  const drawSizes = () => {

      + (extra.length ? `<div class="szg"><span class="mut">Өөр</span>${extra.map(s => `<button type="button" class="szc" aria-pressed="true" data-sz="${esc(s)}">${esc(s)} ×</button>`).join("")}</div>` : "");

      else { sizes.push(s); sizes.sort((a, b) => (all.indexOf(a) < 0 ? 999 : all.indexOf(a)) - (all.indexOf(b) < 0 ? 999 : all.indexOf(b))); }

  $("szaddb").onclick = addSize; $("szadd").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); addSize(); } };

  const pend = c => pending.filter(x => x.c === c).map(x => `<div class="tn up ${x.s === "bad" ? "bad" : ""}">${x.s === "bad" ? "⚠" : "<i></i>"}</div>`).join("");
  const card = (c, title) => {
    const list = images.map((u, i) => [u, i]).filter(([u]) => c ? imgColor[u] === c : !imgColor[u] || !colors.includes(imgColor[u]));
    return `<div class="cg ${c ? "" : "gen"} ${c && !list.length ? "need" : ""}" data-drop="${esc(c)}">
      <div class="cgh">${c ? dot(c) : ""}<b>${esc(title)}</b><span>${list.length ? list.length + " зураг" : c ? "зураг хэрэгтэй" : ""}</span></div>

  };
  const drawThumbs = () => {
    if (!$("cgroups")) return;

    box.querySelectorAll("[data-up]").forEach(b => b.onclick = () => { upColor = b.dataset.up; $("pfiles").click(); });

    });
    summary();
  };
  // ----- Зургийн цэс: гол болгох, тайрах, өнгө солих, дараалал, устгах -----
  const thumbMenu = i => {

        ${undo[u] ? '<button type="button" data-a="undo">↶ Тайрахаас өмнөх рүү буцаах</button>' : ""}
        ${colors.length ? `<div class="tm-col"><span class="mut">Аль өнгийнх вэ:</span>${colors.map(c => `<button type="button" class="cpk" aria-pressed="${imgColor[u] === c}" data-col="${esc(c)}">${dot(c)}${esc(c)}</button>`).join("")}<button type="button" class="cpk" aria-pressed="${!imgColor[u]}" data-col="">Ерөнхий</button></div>` : ""}
        <div class="row"><button type="button" data-a="left" ${i ? "" : "disabled"}>← Өмнө</button><button type="button" data-a="right" ${i < images.length - 1 ? "" : "disabled"}>Хойно →</button></div>
        <button type="button" data-a="del" class="red">× Устгах</button>

    document.body.appendChild(m);

    const ex = { ...(p.extra || {}) }; delete ex.imgColor; delete ex.labels;

  const TR = { а:"a",б:"b",в:"v",г:"g",д:"d",е:"e",ё:"yo",ж:"j",з:"z",и:"i",й:"i",к:"k",л:"l",м:"m",н:"n",о:"o",ө:"u",п:"p",р:"r",с:"s",т:"t",у:"u",ү:"u",ф:"f",х:"h",ц:"ts",ч:"ch",ш:"sh",щ:"sh",ъ:"",ы:"y",ь:"",э:"e",ю:"yu",я:"ya" };
  const slug = v => String(v).toLowerCase().split("").map(c => TR[c] ?? c).join("").replace(/[^a-z0-9_-]+/g, "-").replace(/^-+|-+$/g, "").replace(/-{2,}/g, "-").slice(0, 40);
  // Шинэ барааны ID-г нэрнээс автоматаар үүсгэнэ (кирилл, латин аль нь ч болно). Давхардвал ард нь тэмдэгт нэмнэ
  const makeId = () => {

  // Утас/компьютерээс зураг оруулах
  // Хэдэн зураг оруулж байгааг тоолно: дуустал "Хадгалах" товч идэвхгүй (зураггүй хадгалагдахаас сэргийлнэ)
  let uploading = 0;
  const busy = d => { uploading += d; $("psave").disabled = uploading > 0; $("psave").textContent = uploading > 0 ? "Зураг оруулж байна…" : "Хадгалах"; };
  $("pfiles").onchange = e => { const picked = [...e.target.files]; e.target.value = ""; if (picked.length) addFiles(picked); };
  async function addFiles(picked){

    dUp--; $("p-dmsg").textContent = "✓ Орлоо";
  };
  // Холбоосоор зураг нэмэх
  $("paddurl").onclick = () => { const u = $("purl").value.trim(); if (!/^(https:\/\/|\/)/.test(u)) return toast("https:// эсвэл /-ээр эхэлсэн холбоос"); images.push(u); $("purl").value = ""; drawThumbs(); };
  // Өнгө + хэмжээ + бусад сонголтыг нэгтгэнэ (хуучин бараа бол хуучин дарааллаар)
  const buildOpts = () => {
    const list = [];
    if (colors.length) list.push({ label: cLabel, values: colors });
    if (sizes.length) list.push({ label: sLabel, values: sizes });
    parseOpts($("p-opts").value).filter(o => !isColor(o.label) && !isSize(o.label)).forEach(o => list.push(o));
    const pos = o => { const i = optOrder.indexOf(o.label); return i < 0 ? 100 + list.indexOf(o) : i; };
    return list.sort((a, b) => pos(a) - pos(b));
  };

    // Зураг оруулж дуусаагүй бол хүлээнэ
