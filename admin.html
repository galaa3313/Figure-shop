  let cats = Array.isArray(S.cats) && S.cats.length ? S.cats.map(x => ({ ...x })) : Object.entries(CATS).map(([id, label]) => ({ id, label }));
  // Ангилал бүрт хэдэн бараа байгааг тоолно
  const catN = id => (plist || []).filter(x => x.cat === id).length;
  // Нэрнээс латин id үүсгэнэ (кирилл → латин), давхардвал ард нь тэмдэгт нэмнэ
  const CTR = { а:"a",б:"b",в:"v",г:"g",д:"d",е:"e",ё:"yo",ж:"j",з:"z",и:"i",й:"i",к:"k",л:"l",м:"m",н:"n",о:"o",ө:"u",п:"p",р:"r",с:"s",т:"t",у:"u",ү:"u",ф:"f",х:"h",ц:"ts",ч:"ch",ш:"sh",щ:"sh",ы:"y",э:"e",ю:"yu",я:"ya" };
  const catId = v => { let id = String(v).toLowerCase().split("").map(c => CTR[c] ?? c).join("").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 24) || "cat";
    if (id === "all" || id === "drops" || cats.some(x => x.id === id)) id += "-" + Math.random().toString(36).slice(2, 5); return id; };
  const drawCats = () => {
    $("catList").innerHTML = cats.map((x, i) => `<div class="crow"><b>${i + 1}</b><textarea rows="1" class="one" data-cl="${i}" placeholder="Нэр">${esc(x.label)}</textarea><span class="mut">${catN(x.id)} бараа</span>
      <div class="tb"><button type="button" data-cu="${i}" ${i ? "" : "disabled"}>↑</button><button type="button" data-cd="${i}" ${i < cats.length - 1 ? "" : "disabled"}>↓</button><button type="button" data-cx="${i}">×</button></div></div>`).join("");
    // Нэр засах
    $("catList").querySelectorAll("[data-cl]").forEach(el => el.oninput = () => { cats[+el.dataset.cl].label = el.value; });
    // Дээш, доош
    $("catList").querySelectorAll("[data-cu]").forEach(b => b.onclick = () => { const i = +b.dataset.cu; [cats[i - 1], cats[i]] = [cats[i], cats[i - 1]]; drawCats(); });
    $("catList").querySelectorAll("[data-cd]").forEach(b => b.onclick = () => { const i = +b.dataset.cd; [cats[i + 1], cats[i]] = [cats[i], cats[i + 1]]; drawCats(); });
    // Устгах: бараатай бол хориглоно
    $("catList").querySelectorAll("[data-cx]").forEach(b => b.onclick = () => { const i = +b.dataset.cx; const n = catN(cats[i].id);
      if (n) return toast(`"${cats[i].label}" ангилалд ${n} бараа байна — эхлээд шилжүүлнэ үү`); cats.splice(i, 1); drawCats(); });
  };
  drawCats();
  // ----- ГҮЙДЭГ ТУУЗ: текст, дүрс, зураг/GIF — нэмэх, засах, солих, дараалал, устгах -----
  const MQIC = ["", "✦", "★", "✨", "🔥", "⚡", "❤️", "🎁", "🚚", "🆕", "💥", "🛍", "👕", "🧢", "🎌", "🇰🇷"];
  let mq = (Array.isArray(S.marquee) ? S.marquee : []).map(x => ({ type: x.type === "img" ? "img" : "text", text: x.text || "", icon: x.icon || "", img: x.img || "", link: x.link || "" }));
  // Ангиллын сонголт (холбоос)
  const mqLink = cur => `<option value="">Холбоосгүй</option>${cats.map(c => `<option value="${esc(c.id)}" ${cur === c.id ? "selected" : ""}>→ ${esc(c.label)}</option>`).join("")}`;
  // Нэг мөрийн HTML (жишээнд ч ашиглана)
  const mqHtml = x => `<span class="mqi">${x.type === "img" && x.img ? `<img src="${esc(x.img)}" alt="">` : ""}${x.icon ? `<i>${esc(x.icon)}</i>` : ""}${x.text ? `<em>${esc(x.text)}</em>` : ""}</span>`;
  // Шууд жишээ: хоосон бол ангиллын нэрс
  const drawMqPrev = () => { const src = mq.length ? mq : cats.map(c => ({ type: "text", text: c.label })); const one = src.map(mqHtml).join(""); $("mqPrev").innerHTML = one + one + one;
    $("mqPrev").style.animationDuration = Math.max(14, src.length * ({ slow: 7, normal: 4.5, fast: 2.6 }[$("mqSpeed") ? $("mqSpeed").value : "normal"])) + "s"; };
  // Зураг/GIF оруулах: GIF-ийг хөдөлгөөнтэй нь (шахахгүй), бусдыг жижигрүүлж
  const upMq = async f => {
    if (!/^image\/(png|jpeg|webp|gif)$/.test(f.type)) throw new Error("PNG, JPG, WEBP, GIF л болно");
    if (f.size > 4 * 1024 * 1024) throw new Error("4MB-аас бага файл оруулна уу");
    if (f.type === "image/gif") {
      const path = `marquee/${Date.now()}-${Math.random().toString(36).slice(2, 7)}.gif`;
      const { error } = await sb.storage.from("products").upload(path, f, { contentType: "image/gif", cacheControl: "31536000" });
      if (error) throw error; return sb.storage.from("products").getPublicUrl(path).data.publicUrl;
    }
    return putImg(await shrink(f, 600), "marquee");
  };
  const drawMq = () => {
    $("mqList").innerHTML = mq.length ? mq.map((x, i) => `<div class="mqrow">
      <div class="mqth">${x.type === "img" ? (x.img ? `<img src="${esc(x.img)}" alt="">` : "🖼") : `<span>${esc(x.icon || "Aa")}</span>`}</div>
      <div class="mqf">
        <span class="mqt">${x.type === "img" ? "Зураг / GIF" : "Текст"}</span>
        ${x.type === "text" ? `<select data-qi="${i}" aria-label="Дүрс">${MQIC.map(ic => `<option value="${ic}" ${ic === x.icon ? "selected" : ""}>${ic || "Дүрсгүй"}</option>`).join("")}</select>` : `<label class="btn sm">Солих<input type="file" data-qf="${i}" accept="image/png,image/jpeg,image/webp,image/gif" hidden></label>`}
        <textarea rows="1" class="one" data-qt="${i}" placeholder="${x.type === "img" ? "Хажууд нь бичих үг (заавал биш)" : "Бичвэр (жишээ: Шинэ ирсэн)"}">${esc(x.text)}</textarea>
        <select data-ql="${i}" aria-label="Холбоос">${mqLink(x.link)}</select>
      </div>
      <div class="tb"><button type="button" data-qu="${i}" ${i ? "" : "disabled"} aria-label="Дээш">↑</button><button type="button" data-qd="${i}" ${i < mq.length - 1 ? "" : "disabled"} aria-label="Доош">↓</button><button type="button" data-qx="${i}" aria-label="Устгах">×</button></div>
    </div>`).join("") : `<p class="mut mqempty">Мөр алга — сайт дээр ангиллын нэрс гүйнэ.</p>`;
    const L = $("mqList"), q = (a, i) => L.querySelector(`[data-q${a}="${i}"]`);
    mq.forEach((x, i) => {
      q("t", i).oninput = e => { x.text = e.target.value; drawMqPrev(); };
      q("l", i).onchange = e => { x.link = e.target.value; };
      if (q("i", i)) q("i", i).onchange = e => { x.icon = e.target.value; drawMq(); };
      // Зургийг тус бүрд нь солих
      if (q("f", i)) q("f", i).onchange = async e => { const f = e.target.files[0]; if (!f) return;
        try { toast("Оруулж байна…"); x.img = await upMq(f); drawMq(); toast("Солигдлоо — Хадгалах дарна уу"); } catch (err) { toast("Алдаа: " + err.message); } };
      q("u", i).onclick = () => { [mq[i - 1], mq[i]] = [mq[i], mq[i - 1]]; drawMq(); };
      q("d", i).onclick = () => { [mq[i + 1], mq[i]] = [mq[i], mq[i + 1]]; drawMq(); };
      q("x", i).onclick = () => { mq.splice(i, 1); drawMq(); };
    });
    drawMqPrev();
  };
  drawMq();
  $("mqSpeed").onchange = drawMqPrev;
  // Текст мөр нэмэх
  $("mqAddT").onclick = () => { if (mq.length >= 40) return toast("40 хүртэл мөр"); mq.push({ type: "text", text: "", icon: "", img: "", link: "" }); drawMq(); const t = $("mqList").querySelectorAll("[data-qt]"); t[t.length - 1].focus(); };
  // Зураг/GIF мөрүүд нэмэх (хэд хэдийг зэрэг)
  $("mqFile").onchange = async e => {
    for (const f of e.target.files) { if (mq.length >= 40) break;
      try { toast("Оруулж байна… " + f.name); mq.push({ type: "img", text: "", icon: "", img: await upMq(f), link: "" }); } catch (err) { toast("Алдаа: " + err.message); } }
    e.target.value = ""; drawMq(); markDirty(); toast("Орлоо — Хадгалах дарна уу");
  };
  // Ангиллын нэрсээр бөглөх (засахад эхлэл болгоно)
  $("mqFromCats").onclick = () => { mq = cats.map(c => ({ type: "text", text: c.label, icon: "", img: "", link: c.id })); drawMq(); };
  $("mqClear").onclick = () => { if (!mq.length || !confirm("Туузны бүх мөрийг арилгах уу? (Ангиллын нэрс гүйнэ)")) return; mq = []; drawMq(); };

  // Шинэ ангилал нэмэх
  $("catAdd").onclick = () => { const v = $("catNew").value.trim(); if (!v) return toast("Ангиллын нэрээ бичнэ үү");
    cats.push({ id: catId(v), label: v }); $("catNew").value = ""; drawCats(); toast("Нэмэгдлээ — Хадгалах дарна уу"); };
  const linkOpts = cur => `<option value="">Холбоосгүй</option><option value="#shop" ${cur === "#shop" ? "selected" : ""}>→ Бүх бараа</option><option value="#drops" ${cur === "#drops" ? "selected" : ""}>→ Шинэ бараа</option>`
    + (plist || []).map(x => `<option value="product:${esc(x.id)}" ${cur === "product:" + x.id ? "selected" : ""}>Бараа: ${esc(x.name)}</option>`).join("")
    + `<option value="url" ${/^https?:/.test(cur || "") ? "selected" : ""}>Вэб хаяг…</option>`;
  const drawPosters = (arr, boxId, key) => {
    // Слайд байгаа эсэхээс хамаарч "Нүүр хэсэг" харагдах эсэхийг бичнэ
    if (key === "s") $("heroState").innerHTML = arr.length ? `⚠ Одоо <b>${arr.length} слайд</b> байгаа тул энэ хэсэг сайтад <b>харагдахгүй</b>. Слайдуудыг устгавал гарна.` : "✓ Слайд байхгүй тул энэ хэсэг сайтад <b>харагдаж байна</b>.";
    if (key === "s") $("heroState").className = "full shint " + (arr.length ? "off" : "on");
    $(boxId).innerHTML = arr.map((x, i) => `<div class="post"><img src="${esc(x.img)}" alt="">
      <div class="pcol">
        <!-- Урамшууллын хуудасны гарчиг, тайлбар (бөглөвөл постер дарахад мэдээллийн хуудас нээгдэнэ) -->
        <textarea rows="1" class="one" data-${key}t="${i}" placeholder="Гарчиг (жишээ: Өвлийн хямдрал 30% хүртэл)">${esc(x.title || "")}</textarea>
        <textarea data-${key}b="${i}" rows="4" placeholder="Тайлбар: нөхцөл, хугацаа, дэлгэрэнгүй мэдээлэл…">${esc(x.body || "")}</textarea>
        <div class="row" style="gap:8px;flex-wrap:wrap"><label class="mut" style="flex:1;min-width:140px">Эхлэх<input type="date" data-${key}s="${i}" value="${esc(x.start || "")}"></label><label class="mut" style="flex:1;min-width:140px">Дуусах<input type="date" data-${key}e="${i}" value="${esc(x.end || "")}"></label></div>
        <label class="mut">Товчны холбоос<select data-${key}l="${i}">${linkOpts(x.link)}</select></label>
        <textarea rows="1" class="one" data-${key}u="${i}" placeholder="https://…" ${/^https?:/.test(x.link || "") ? "" : "hidden"}>${/^https?:/.test(x.link || "") ? esc(x.link) : ""}</textarea>
        <!-- Урамшуулалд хамаарах бараанууд -->
        <details><summary class="mut">Урамшуулалд хамаарах бараа (${(x.products || []).length})</summary>
          <div class="pchk">${(plist || []).map(pr => `<label><input type="checkbox" data-${key}p="${i}" value="${esc(pr.id)}" ${(x.products || []).includes(pr.id) ? "checked" : ""}> ${esc(pr.name)}</label>`).join("")}</div></details>
        <div class="tb"><button type="button" data-${key}up="${i}" ${i ? "" : "disabled"}>↑</button><button type="button" data-${key}dn="${i}" ${i < arr.length - 1 ? "" : "disabled"}>↓</button><button type="button" data-${key}x="${i}">×</button></div></div></div>`).join("") || '<p class="mut">Одоохондоо алга.</p>';
    const q = (a, i) => $(boxId).querySelector(`[data-${key}${a}="${i}"]`);
    arr.forEach((x, i) => {
      // Гарчиг, тайлбар, огноо
      q("t", i).oninput = e => { x.title = e.target.value; };
      q("b", i).oninput = e => { x.body = e.target.value; };
      q("s", i).onchange = e => { x.start = e.target.value; };
      q("e", i).onchange = e => { x.end = e.target.value; };
      // Холбоос сонгох
      q("l", i).onchange = e => { const v = e.target.value; q("u", i).hidden = v !== "url"; x.link = v === "url" ? q("u", i).value.trim() : v; };
      q("u", i).oninput = e => { x.link = e.target.value.trim(); };
      // Хамаарах бараа
      $(boxId).querySelectorAll(`[data-${key}p="${i}"]`).forEach(c => c.onchange = () => { x.products = [...$(boxId).querySelectorAll(`[data-${key}p="${i}"]:checked`)].map(z => z.value); c.closest("details").querySelector("summary").textContent = `Урамшуулалд хамаарах бараа (${x.products.length})`; });
      // Дээш, доош, устгах
      q("up", i).onclick = () => { [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]]; drawPosters(arr, boxId, key); };
      q("dn", i).onclick = () => { [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]]; drawPosters(arr, boxId, key); };
      q("x", i).onclick = () => { arr.splice(i, 1); drawPosters(arr, boxId, key); };
    });
  };
  drawPosters(slides, "slList", "s"); drawPosters(promos, "prList", "p");
  // Зураг оруулах (хэд хэдийг зэрэг)
  const addPosters = (fileId, arr, boxId, key) => $(fileId).onchange = async e => {
    toast("Оруулж байна…");
    for (const f of e.target.files) { try { arr.push({ img: await upload(f, "slides"), link: "" }); } catch (err) { toast("Алдаа: " + err.message); } }
    e.target.value = ""; drawPosters(arr, boxId, key); toast("Орлоо — Хадгалах дарна уу");
  };
  addPosters("slFile", slides, "slList", "s"); addPosters("prFile", promos, "prList", "p");
  drawHow(); drawFaq();
  $("faqAdd").onclick = () => { readLists(); faq.push({ q: "", a: "" }); drawFaq(); };
  $("colReset").onclick = () => { for (const [k, v] of Object.entries(DEF.colors)) $("main").querySelector(`[data-c="${k}"]`).value = v; };
  // Нүүр зураг, лого оруулах
  const imgField = (fileId, prevId, clrId, key, max) => {
    $(fileId).onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      try { toast("Оруулж байна…"); S[key] = await upload(f, "site"); $(prevId).src = S[key]; $(prevId).hidden = false; $(clrId).hidden = false; toast("Зураг орлоо — Хадгалах дарна уу"); }
      catch (err) { toast("Алдаа: " + err.message); }
      e.target.value = "";
    };
    $(clrId).onclick = () => { S[key] = ""; $(prevId).hidden = true; $(clrId).hidden = true; };
  };
  imgField("heroFile", "heroPrev", "heroClr", "heroImage"); imgField("logoFile", "logoPrev", "logoClr", "logoUrl"); imgField("footFile", "footPrev", "footClr", "footerImage");
  // Хадгалах
  // Талбаруудаас бүх тохиргоог цуглуулна (хадгалах, урьдчилан харахад)
  const collect = () => {
    readLists();
    const out = { ...S };
    $("main").querySelectorAll("[data-k]").forEach(el => out[el.dataset.k] = el.value.trim());
    out.colors = {}; $("main").querySelectorAll("[data-c]").forEach(el => out.colors[el.dataset.c] = el.value);
    out.how = how.filter(x => x.t); out.faq = faq.filter(x => x.q && x.a);
    // Facebook-ээр нэвтрэх товч
    out.fbLogin = $("fbOn").checked;
    // Үйлчилгээний 4 мөр
    readPerks(); out.perks = perks.map(x => ({ i: x.i, t: x.t.trim(), d: x.d.trim() })).filter(x => x.t || x.d);
    // Ангилал: нэргүйг хасна
    out.cats = cats.map(x => ({ id: x.id, label: (x.label || "").trim() })).filter(x => x.label);
    // Гүйдэг тууз: хоосон мөрийг хасна
    out.marquee = mq.filter(x => x.type === "img" ? x.img : (x.text.trim() || x.icon)).map(x => ({ type: x.type, text: x.text.trim(), icon: x.icon, img: x.type === "img" ? x.img : "", link: x.link }));
    out.mqSpeed = $("mqSpeed").value;
    // Слайд ба постерууд
    const clean = x => ({ img: x.img, link: x.link || "", title: (x.title || "").trim(), body: (x.body || "").trim(), start: x.start || "", end: x.end || "", products: x.products || [] });
    out.slides = slides.filter(x => x.img).map(clean); out.promos = promos.filter(x => x.img).map(clean);
    return out;
  };
  // ----- ХЭСЭГ БҮРИЙГ САЙТ ДЭЭР ХАРАХ (хадгалахаас өмнө) -----
  // Хэсэг бүрийн толгойд "👁 Сайт дээр харах" товч нэмнэ
  $("sf").querySelectorAll("section.scard").forEach(sec => {
    const h = sec.querySelector(".shead"); if (!h) return;
    h.insertAdjacentHTML("beforeend", `<button type="button" class="btn spvbtn" data-pv="${sec.id.replace(/^s-/, "")}">👁 Сайт дээр харах</button>`);
  });
  let PV_KEY = "", PV_W = innerWidth < 760 ? 390 : 1280, pvT = 0;
  // Урьдчилан харах цонхонд одоогийн (хадгалаагүй ч) тохиргоог илгээнэ
  const pvSend = () => { const f = $("pvFrame"); if (!f || !f.contentWindow) return; try { f.contentWindow.postMessage({ type: "finn-preview", settings: collect(), focus: PV_KEY }, location.origin); } catch (e) {} };
  // Iframe-ийг хайрцагт багтаана (компьютерийн өргөнийг жижигрүүлж)
  const pvFit = () => { const st = $("pvStage"), f = $("pvFrame"); if (!st || !f) return;
    const sc = Math.min(1, st.clientWidth / PV_W); f.style.width = PV_W + "px"; f.style.height = (st.clientHeight / sc) + "px"; f.style.transform = `scale(${sc})`;
    $("spvw").querySelectorAll("[data-pvw]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.pvw === PV_W)); };
  const openPv = key => {
    PV_KEY = key; const sec = $("s-" + key);
    $("pvTitle").textContent = sec ? sec.querySelector("h3").textContent : "Сайт";
    $("spvw").hidden = false; document.body.style.overflow = "hidden"; pvFit();
    // Анх удаа ачаална; дараа нь зөвхөн тохиргоог дахин илгээнэ
    const f = $("pvFrame");
    if (!f.getAttribute("src")) { f.onload = () => [300, 1200, 2500].forEach(t => setTimeout(pvSend, t)); f.src = "/?preview=1"; } else pvSend();
  };
  $("sf").addEventListener("click", e => { const b = e.target.closest("[data-pv]"); if (b) { e.preventDefault(); e.stopPropagation(); openPv(b.dataset.pv); } }, true);
  // Засах бүрт нээлттэй урьдчилан харахыг шинэчилнэ
  const pvLive = () => { if ($("spvw").hidden) return; clearTimeout(pvT); pvT = setTimeout(pvSend, 600); };
  $("sf").addEventListener("input", pvLive); $("sf").addEventListener("change", pvLive);
  $("spvw").querySelectorAll("[data-pvw]").forEach(b => b.onclick = () => { PV_W = +b.dataset.pvw; pvFit(); setTimeout(pvSend, 200); });
  $("pvRe").onclick = pvSend;
  $("pvX").onclick = () => { $("spvw").hidden = true; document.body.style.overflow = ""; };
  onresize = () => { if ($("spvw") && !$("spvw").hidden) pvFit(); };
  $("ssave").onclick = async () => {
    const out = collect();
    if (!out.cats.length) return toast("Дор хаяж нэг ангилал байх ёстой");
    $("ssave").disabled = true;
    const { data: u } = await sb.auth.getUser();
    const { error } = await sb.from("settings").upsert({ id: "site", data: out, updated_at: new Date().toISOString(), updated_by: u && u.user ? u.user.id : null });
    $("ssave").disabled = false;
    if (error) return toast("Алдаа: " + error.message);
    dirty = false; toast("Хадгаллаа · сайтад шууд харагдана"); showSettings();
  };
}

// ===== СЭТГЭГДЭЛ: бүх сэтгэгдэл, хариулах, нуух, устгах =====
let RV_WHO = "", RV_LOG = {};
// Сэтгэгдлийн FINN хариулт: байвал хар бөмбөлөг (засах), байхгүй бол хариу бичих талбар
function rvReply(r){
  const L = r.reply ? RV_LOG[r.id] : null;
  // Засах эрх: өөрийн хариулт, хэн бичсэн нь тодорхойгүй (хуучин) хариулт, эсвэл супер админ
  const can = !L || L.admin_id === ADMIN_UID || ME_SUPER;
  if (r.reply) return `<div class="bub me"><b>FINN${L ? " · " + esc(aname(L.admin_id)) : ""}</b><p>${esc(r.reply)}</p>
    <small>${L ? dt(L.replied_at) : "хариулсан"}${L && L.edited ? " · засварласан" : ""}${can ? ` · <button type="button" class="bedit" data-red>✏️ Засах</button>` : ""}</small></div>`;
  return `<label class="rvnew">Хариу бичих<textarea class="rvta" rows="2" maxlength="2000" placeholder="Хэрэглэгчид харагдах FINN-ий хариулт (🔔 мэдэгдэл очно)"></textarea></label>
    <button type="button" class="btn dark" data-rsend>Хариулт илгээх</button>`;
}
async function showReviews(){
  const my = ++VIEW;
  let [{ data: list, error }, { data: prods }] = await Promise.all([
    sb.from("reviews").select("*").order("created_at", { ascending: false }).limit(300),
    sb.from("products").select("id,name"), loadAdmins()
  ]);
  // Аль админ хариулсан (finn-inbox2.sql) — хүснэгт байхгүй бол хоосон
  const { data: logs } = await sb.from("review_reply_log").select("review_id,admin_id,replied_at,edited");
  const LOG = RV_LOG = {}; (logs || []).forEach(l => LOG[l.review_id] = l);
  if (my !== VIEW) return;
  if (error) { $("main").innerHTML = `<p class="msg">Алдаа: ${esc(error.message)}<br>Supabase-д finn-reviews.sql-ийг ажиллуулсан эсэхээ шалгана уу.</p>`; return; }
  const pname = id => ((prods || []).find(x => x.id === id) || {}).name || id;
  // "Хэн хариулсан" шүүлтүүр
  const all = list; list = all.filter(r => !RV_WHO || (LOG[r.id] && LOG[r.id].admin_id === RV_WHO));
  const who = r => LOG[r.id] && r.reply ? LOG[r.id] : null;
  const st = r => "★★★★★".slice(0, r) + "☆☆☆☆☆".slice(0, 5 - r);
  $("main").innerHTML = `<div class="bar"><h2>Сэтгэгдэл <small class="mut">(${all.length})</small></h2>${whoSel(RV_WHO, "rvWho")}</div>
    <!-- Сэтгэгдэл бүр нэг мөр: дарахад бүтэн бичиг, зураг, хариулт харагдана -->
    <div class="olist rvl2" id="rvl">${list.length ? `<p class="mut ocount">${list.length} сэтгэгдэл · дарж дэлгэрэнгүйг харна${list.filter(r => !r.reply).length ? ` · <b>${list.filter(r => !r.reply).length}</b> хариулаагүй` : ""}</p>` : ""}${list.map(r => `<details class="ord rv2 ${r.hidden ? "off" : r.rating <= 2 ? "low" : ""}" data-row>
      <summary><span class="oc">${selBox(r.id)}<b class="stars">${st(r.rating)}</b><small>${dt(r.created_at)}</small></span>
        <span class="on">${esc(pname(r.product_id))}<small>${esc(r.username)} · ${esc(String(r.body || "").slice(0, 70))}${String(r.body || "").length > 70 ? "…" : ""}</small></span>
        <span class="ot">${(r.photos || []).filter(okPhoto).length ? "📷" : ""}</span>
        <span class="os"><i></i>${r.hidden ? "Нуусан" : r.reply ? `Хариулсан${who(r) ? " · " + esc(aname(who(r).admin_id)) : ""}` : "Хариулаагүй"}</span><span class="ochev" aria-hidden="true">›</span></summary>
      <div class="obody rvb" data-rv="${r.id}">
        <!-- Хэрэглэгчийн сэтгэгдэл (чат шиг зүүн талд) -->
        <div class="ichat"><div class="bub fn"><b>${esc(r.username)} ${r.verified ? '<span class="tag ok">✓ Худалдан авсан</span>' : ""}</b><p>${esc(r.body)}</p>
          ${(r.photos || []).filter(okPhoto).length ? `<div class="thumbs">${r.photos.filter(okPhoto).map(u => `<figure><a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt=""></a></figure>`).join("")}</div>` : ""}
          <small>${st(r.rating)} · ${dt(r.created_at)}</small></div>
          <!-- FINN-ий хариулт эсвэл хариу бичих талбар -->
          <div class="rvrep">${rvReply(r)}</div></div>
        <div class="oact"><a class="btn" href="/#p/${encodeURIComponent(r.product_id)}/rv" target="_blank" rel="noopener" title="Сайт дээрх сэтгэгдэл хэсэг рүү">🔗 Сайтад харах</a><button class="btn" data-hide="${r.id}">${r.hidden ? "👁 Харуулах" : "🙈 Нуух"}</button><button class="btn del" data-del="${r.id}">🗑 Сэтгэгдэл устгах</button></div>
      </div></details>`).join("") || '<p class="msg">Одоохондоо сэтгэгдэл алга.</p>'}</div>`;
  // "Хэн хариулсан" шүүлтүүр солиход
  $("rvWho").onchange = e => { RV_WHO = e.target.value; showReviews(); };
  // Нэгийг задлахад бусдыг хураана
  $("rvl").querySelectorAll("details.rv2").forEach(d => d.ontoggle = () => { if (d.open) $("rvl").querySelectorAll("details.rv2[open]").forEach(x => x !== d && (x.open = false)); });
  // Олноор сонгож устгах
  if (list.length) bulkSel($("rvl"), { what: "сэтгэгдэл", done: () => showReviews(),
    delOne: async id => { const { data, error } = await sb.from("reviews").delete().eq("id", +id).select("id"); if (error || !data || !data.length) throw new Error("fail"); } });
  // Хариулт хэсгийн үйлдлүүд (хариулт илгээх, засах, устгах)
  $("rvl").querySelectorAll(".rvb").forEach(box => bindRv(box, list.find(x => x.id === +box.dataset.rv)));
  function bindRv(box, r){
    const R = box.querySelector(".rvrep"), row = box.closest("details");
    // Хариулт хадгалах (v хоосон бол хариултыг устгана)
    const saveReply = async (v, btn) => {
      if (btn) { btn.disabled = true; btn.textContent = "Хадгалж байна…"; }
      // Өмнө нь хариулт байсан эсэх (засвар уу, шинэ үү)
      const had = !!r.reply;
      const { error } = await sb.from("reviews").update({ reply: v || null }).eq("id", r.id);
      if (error) { if (btn) btn.disabled = false; return toast("Алдаа: " + error.message); }
      // Хариулт илгээгдвэл хэрэглэгчид 🔔 мэдэгдэл автоматаар очно (finn-inbox.sql)
      toast(!v ? "Хариултыг устгалаа" : had ? "✓ Засварлалаа · хэрэглэгчид мэдэгдэл очлоо" : "✓ Хариулт илгээлээ · хэрэглэгчид мэдэгдэл очлоо");
      LOG[r.id] = v ? { review_id: r.id, admin_id: ADMIN_UID, replied_at: new Date().toISOString(), edited: had } : undefined;
      r.reply = v || null;
      if (!row.classList.contains("off")) row.querySelector(".os").innerHTML = `<i></i>${v ? "Хариулсан · " + esc(aname(ADMIN_UID)) : "Хариулаагүй"}`;
      R.innerHTML = rvReply(r); bindRv(box, r);
    };
    // Хариулаагүй: илгээх
    const send = R.querySelector("[data-rsend]");
    if (send) send.onclick = () => { const v = R.querySelector(".rvta").value.trim(); if (!v) return R.querySelector(".rvta").focus(); saveReply(v, send); };
    // ✏️ Засах: хариултыг талбар болгоно
    const ed = R.querySelector("[data-red]");
    if (ed) ed.onclick = () => {
      const bub = R.querySelector(".bub"); bub.classList.add("editing");
      bub.querySelector("p").outerHTML = `<textarea class="edta" rows="3" maxlength="2000">${esc(r.reply)}</textarea><span class="edbt"><button type="button" class="btn" data-sv>Хадгалах</button><button type="button" class="btn" data-cx>Болих</button><button type="button" class="btn edel" data-dl>🗑 Устгах</button></span>`;
      bub.querySelector("small").hidden = true;
      const ta = bub.querySelector(".edta"); ta.focus(); fitTA(ta);
      bub.querySelector("[data-cx]").onclick = () => { R.innerHTML = rvReply(r); bindRv(box, r); };
      bub.querySelector("[data-sv]").onclick = e => { const v = ta.value.trim(); if (!v) return ta.focus(); if (v === r.reply) return bub.querySelector("[data-cx]").click(); saveReply(v, e.target); };
      // 🗑 Хариултыг устгах (2 удаа дарна) — сэтгэгдэл өөрөө үлдэнэ
      bub.querySelector("[data-dl]").onclick = e => { const b = e.target;
        if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "Дахин дар"; return setTimeout(() => { if (b.isConnected) { b.dataset.sure = ""; b.textContent = "🗑 Устгах"; } }, 3000); }
        saveReply("", null);
      };
    };
  }
  // Нуух / харуулах
  $("main").querySelectorAll("[data-hide]").forEach(b => b.onclick = async () => {
    const r = list.find(x => x.id === +b.dataset.hide);
    const { error } = await sb.from("reviews").update({ hidden: !r.hidden }).eq("id", r.id);
    if (error) return toast("Алдаа: " + error.message); showReviews();
  });
  // Устгах (2 удаа дарна)
  $("main").querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "Дахин дар"; return setTimeout(() => { if (b.isConnected) { b.dataset.sure = ""; b.textContent = "🗑 Сэтгэгдэл устгах"; } }, 3000); }
    const { error } = await sb.from("reviews").delete().eq("id", +b.dataset.del);
    if (error) return toast("Алдаа: " + error.message); toast("Устгалаа"); showReviews();
  });
}

// ===== ТҮҮХ: хэн, хэзээ, юу хийсэн =====
// Үйлдэл, төрлийн монгол нэр
const ACT = { request: "Админ эрх хүссэн", approve: "Админ эрх зөвшөөрсөн", reject: "Админ хүсэлт татгалзсан", delete: "Устгасан", hide: "Нуусан", unhide: "Харуулсан", restore: "Сэргээсэн", status: "Төлөв сольсон", insert: "Нэмсэн", update: "Засварласан", user: "Эрх өөрчилсөн", cancel: "Хэрэглэгч цуцалсан" };
const ENT = { order: "Захиалга", product: "Бараа", review: "Сэтгэгдэл", settings: "Тохиргоо", user: "Хэрэглэгч" };
// Тохиргоо, барааны талбаруудын монгол нэр (юу өөрчлөгдсөнийг харуулахад)
const KEYN = { notice: "Дээд мэдээ", slides: "Слайд", promos: "Постер", heroEyebrow: "Нүүр", heroTitle: "Нүүр", heroText: "Нүүр", heroButton: "Нүүр", heroImage: "Нүүрний зураг",
  cats: "Ангилал", marquee: "Гүйдэг тууз", mqSpeed: "Туузны хурд", how: "Хэрхэн захиалах", faq: "Асуулт", perks: "Үйлчилгээ", phone: "Утас", instagram: "Instagram", facebook: "Facebook", address: "Хаяг", preDays: "Хугацаа",
  colors: "Өнгө", logoUrl: "Лого", footerText: "Хөлийн уриа", footerImage: "Хөлийн зураг", fbLogin: "Facebook нэвтрэлт",
  name: "Нэр", price: "Үнэ", was: "Хуучин үнэ", images: "Зураг", descr: "Тайлбар", options: "Сонголт", cat: "Ангилал", series: "Брэнд", line: "Үйлдвэрлэгч", badge: "Тэмдэг", pre: "Захиалгаар", active: "Харагдах", sort: "Эрэмбэ", extra: "Нэмэлт" };
const chg = d => [...new Set((d && d.changed || []).map(k => KEYN[k] || k))].join(", ");
// Огноог YYYY-MM-DD болгоно (Монголын цагаар)
const ymd = d => new Date(d.getTime() + 8 * 3600e3).toISOString().slice(0, 10);
async function showHistory(f){
  const my = ++VIEW;
  // Анхдагч: сүүлийн 7 хоног
  f = f || { from: ymd(new Date(Date.now() - 6 * 864e5)), to: ymd(new Date()), entity: "", act: "" };
  $("main").innerHTML = `<div class="bar"><h2>Түүх</h2><button class="btn" id="hrel">Шинэчлэх</button></div>
    <div class="hf">
      <div class="quick"><button type="button" data-q="0">Өнөөдөр</button><button type="button" data-q="6">7 хоног</button><button type="button" data-q="29">30 хоног</button><button type="button" data-q="89">3 сар</button></div>
      <label>Эхлэх<input type="date" id="hfrom" value="${f.from}"></label>
      <label>Дуусах<input type="date" id="hto" value="${f.to}"></label>
      <label>Төрөл<select id="hent"><option value="">Бүгд</option>${Object.entries(ENT).map(([k, v]) => `<option value="${k}" ${k === f.entity ? "selected" : ""}>${v}</option>`).join("")}</select></label>
      <label>Үйлдэл<select id="hact"><option value="">Бүгд</option>${Object.entries(ACT).map(([k, v]) => `<option value="${k}" ${k === f.act ? "selected" : ""}>${v}</option>`).join("")}</select></label>
    </div>
    <p class="mut hkeep">ℹ Засварын өмнөх хувилбар <b>30 хоног</b>, түүх <b>180 хоног</b> хадгалагдаад автоматаар устна.</p>
    <div id="hlist"><p class="mut">Уншиж байна…</p></div>`;
  // Шүүлт өөрчлөгдөхөд дахин ачаална
  const again = () => showHistory({ from: $("hfrom").value, to: $("hto").value, entity: $("hent").value, act: $("hact").value });
  ["hfrom", "hto", "hent", "hact"].forEach(id => $(id).onchange = again);
  $("hrel").onclick = again;
  $("main").querySelectorAll("[data-q]").forEach(b => b.onclick = () => { $("hfrom").value = ymd(new Date(Date.now() - +b.dataset.q * 864e5)); $("hto").value = ymd(new Date()); again(); });
  let j;
  try { j = await api({ action: "log", ...f }); }
  catch (e) { if (my === VIEW) $("hlist").innerHTML = `<p class="msg">Түүх уншиж чадсангүй. Supabase дээр <b>finn-history.sql</b>-ийг ажиллуулсан эсэхээ шалгана уу.</p>`; return; }
  if (my !== VIEW) return;
  // Нэмэлт мэдээллийг товч бичвэр болгоно
  const info = l => { const d = l.detail || {};
    if (l.action === "status") return `${esc(d.from || "—")} → <b>${esc(d.to)}</b>${d.name ? " · " + esc(d.name) : ""}`;
    if (l.action === "delete" && l.entity === "order") return `${esc(d.name || "")} · ${fmt(d.total)} · ${esc(d.items || "").slice(0, 80)}`;
    if (l.action === "delete" && l.entity === "review") return `${esc(d.username || "")}: “${esc(String(d.body || "").slice(0, 60))}”`;
    if (l.action === "cancel") return `${esc(d.name || "")} · ${fmt(d.total)} · ${esc(d.from || "")} → Цуцлагдсан`;
    if (l.action === "user") return Object.entries(d).map(([k, v]) => k === "role" ? (v === "admin" ? "Админ болгосон" : "Энгийн хэрэглэгч болгосон") : (v ? "Хаасан" : "Нээсэн")).join(", ");
    if (l.action === "restore") return d.at ? `${dt(d.at)}-ий засварын өмнөх байдал руу буцаасан${d.changed && d.changed.length ? " · " + esc(chg(d)) : ""}` : "Устгасан бичлэгийг буцаасан";
    if (d.changed) return `${d.name ? esc(d.name) + " · " : ""}Өөрчилсөн: <b>${esc(chg(d)) || "—"}</b>`;
    return esc(d.name || d.by || ""); };
  $("hlist").innerHTML = j.rows.length ? `<div class="hl">${j.rows.map(l => `<div class="he a-${esc(l.action)}">
      <div class="ht">${dt(l.at)}</div>
      <div class="hb"><span class="tag">${ACT[l.action] || esc(l.action)}</span> <b>${ENT[l.entity] || esc(l.entity)}</b> ${l.target && l.entity !== "settings" ? `<code>${esc(l.target)}</code>` : ""}
        <div class="mut">${info(l)}</div></div>
      <div class="hw">👤 ${esc(l.actor || "—")}</div>
      ${l.action === "delete" && (l.entity === "order" || l.entity === "product") ? `<button class="btn" data-rs="${l.id}">Сэргээх</button>`
        // Хувилбар 30 хоног хадгалагдана: түүнээс хуучин бол буцаах товч гаргахгүй
        : l.detail && l.detail.snap && Date.now() - new Date(l.at) < 30 * 864e5 ? `<button class="btn rv" data-rs="${l.id}" title="Энэ засвар хийгдэхээс өмнөх байдал руу буцаана">↶ Өмнөх рүү буцаах</button>` : "<span></span>"}
    </div>`).join("")}</div><p class="mut" style="margin-top:10px">${j.rows.length} бичлэг${j.rows.length >= 500 ? " (эхний 500)" : ""}</p>`
    : `<p class="mut">Энэ хугацаанд бичлэг алга.</p>`;
  // Устгасныг сэргээх
  $("hlist").querySelectorAll("[data-rs]").forEach(b => b.onclick = async () => {
    // Хувилбар руу буцаахаас өмнө нэг удаа баталгаажуулна
    if (b.classList.contains("rv") && !b.dataset.sure) { b.dataset.sure = 1; b.textContent = "⚠ Тийм, буцаах"; b.classList.add("sure"); return; }
    if (b.disabled) return;
    // Ачаалж байгааг харуулна: товч түгжигдэж, эргэлддэг дугуй гарна
    const rv = b.classList.contains("rv");
    b.disabled = true; b.classList.add("busy"); b.innerHTML = `<i class="spin"></i>${rv ? "Буцааж байна…" : "Сэргээж байна…"}`;
    try {
      await api({ action: "restore", id: b.dataset.rs });
      // Амжилттай: ногоон болгож түр харуулаад жагсаалтыг шинэчилнэ
      b.classList.remove("busy", "sure"); b.classList.add("done"); b.innerHTML = "✓ Буцаалаа";
      toast(rv ? "✓ Буцаалаа · дургүй бол дээд мөрийн ↶ товчоор дахин буцаана" : "✓ Сэргээлээ");
      await new Promise(z => setTimeout(z, 700));
      await again();
      // Шинэ мөрийг (хамгийн дээд) түр тодруулна
      const top = document.querySelector("#hlist .he"); if (top) top.classList.add("flash");
    } catch (e) { b.disabled = false; b.classList.remove("busy"); b.innerHTML = rv ? "↶ Өмнөх рүү буцаах" : "Сэргээх"; delete b.dataset.sure; b.classList.remove("sure"); toast("Алдаа: " + e.message); }
  });
}

}

const must = r => { if (r.error) throw r.error; return r.data; };
// Латин ID (кирилл нэрнээс): "30 хоногийн эхлэл" → "30-hogiin-ehlel"
const FTR = { а:"a",б:"b",в:"v",г:"g",д:"d",е:"e",ё:"yo",ж:"j",з:"z",и:"i",й:"i",к:"k",л:"l",м:"m",н:"n",о:"o",ө:"u",п:"p",р:"r",с:"s",т:"t",у:"u",ү:"u",ф:"f",х:"h",ц:"ts",ч:"ch",ш:"sh",щ:"sh",ъ:"",ы:"y",ь:"",э:"e",ю:"yu",я:"ya" };
const fslug = v => String(v).toLowerCase().split("").map(c => FTR[c] ?? c).join("").replace(/[^a-z0-9-]+/g, "-").replace(/^-+|-+$/g, "").replace(/-{2,}/g, "-").slice(0, 36);
// Маягтын нэг талбар
const ff = (id, label, v, type = "text", extra = "") => type === "textarea"
  ? `<label class="full">${label}<textarea id="${id}" rows="4" ${extra}>${esc(v ?? "")}</textarea></label>`
  : type === "check" ? `<label class="row" style="flex-direction:row;color:var(--ink)"><input type="checkbox" id="${id}" ${v ? "checked" : ""} style="width:auto"> ${label}</label>`
  : `<label>${label}<input id="${id}" type="${type}" value="${esc(v ?? "")}" ${extra}></label>`;
const fsel = (id, label, v, opts) => `<label>${label}<select id="${id}">${opts.map(o => { const [val, t] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(val)}" ${String(val) === String(v) ? "selected" : ""}>${esc(t)}</option>`; }).join("")}</select></label>`;
const fv = id => $(id).value.trim();
// Хадгалах товчийг түгжиж эргэлдэх тэмдэг харуулна
const fbusy = (b, on) => { b.disabled = on; if (on) { b.dataset.t = b.textContent; b.innerHTML = '<span class="spin"></span>Хадгалж байна…'; } else if (b.dataset.t) b.textContent = b.dataset.t; };

      if (old && old !== bunnyId) api({ action: "delete", id: old }, "/api/fit-upload").catch(() => {});
      toast("Видео орлоо ✓ — Bunny боловсруулж байна");
      bar.hidden = true; watch(bunnyId);
    } catch (err) { bar.hidden = true; $("fl-vst").textContent = "Алдаа: " + (err.message === "not_configured" ? "Bunny тохиргоо (BUNNY_…) дутуу" : err.message || err); }
    finally { uploading = false; if ($("fl-vdrop")) $("fl-vdrop").classList.remove("busy"); }
  };
  $("fl-vfile").onchange = e => { upload(e.target.files[0]); e.target.value = ""; };
  // Чирж оруулах
  const dz = $("fl-vdrop");
  ["dragenter", "dragover"].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add("over"); }));
  ["dragleave", "drop"].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove("over"); }));
  dz.addEventListener("drop", e => upload(e.dataTransfer.files[0]));
  if ($("fl-vdel")) $("fl-vdel").onclick = async () => {
    if (!confirm("Энэ хичээлийн видеог хасах уу? Bunny-ээс бүр устгана.")) return;
    try { must(await sb.from("fit_lessons").update({ bunny_id: null }).eq("id", l.id)); await api({ action: "delete", id: bunnyId }, "/api/fit-upload").catch(() => {}); bunnyId = null; toast("Видео хаслаа"); showFit("less"); }
    catch (err) { toast("Алдаа: " + err.message); }
  };
  if (bunnyId) watch(bunnyId);
  $("flf").onsubmit = async e => {
    e.preventDefault();
    if (uploading) return toast("Видео оруулж дуустал хүлээнэ үү");
    const vu = fv("fl-video");
    if (vu && !/^https:\/\//.test(vu)) return toast("Видео холбоос https://-ээр эхэлнэ");
    const row = rowFromForm();
    // Bunny видео (шинэ хичээлд оруулсан бол)
    if (bunnyId) row.bunny_id = bunnyId;
    const b = $("flsave"); fbusy(b, true);
    const r = isNew ? await sb.from("fit_lessons").insert(row) : await sb.from("fit_lessons").update(row).eq("id", l.id);
    fbusy(b, false);
    if (r.error) return toast("Алдаа: " + (/duplicate/.test(r.error.message) ? "энэ дугаартай хичээл байна" : r.error.message));
    toast("Хадгаллаа"); removeEventListener("beforeunload", guard); $("fform").innerHTML = ""; showFit("less");
  };
  if ($("fldel")) $("fldel").onclick = async () => {
    if (!confirm(`«${l.title}» хичээлийг устгах уу?`)) return;
    const r = await sb.from("fit_lessons").delete().eq("id", l.id).select("id");
    if (r.error || !r.data || !r.data.length) return toast("Устгагдсангүй");
    if (l.bunny_id) api({ action: "delete", id: l.bunny_id }, "/api/fit-upload").catch(() => {});
    toast("Устгалаа"); $("fform").innerHTML = ""; showFit("less");
  };
  // "🎬 Видео оруулах" дарж ирсэн бол видео хэсэг рүү, үгүй бол формын эхэнд
  (toVideo ? $("fl-vbox") : $("fform")).scrollIntoView({ behavior: "smooth", block: toVideo ? "center" : "start" });
  if (toVideo) { $("fl-vbox").classList.add("pulse"); setTimeout(() => $("fl-vbox") && $("fl-vbox").classList.remove("pulse"), 2000); }
}

// ----- 3) ҮНЭ ба ГИШҮҮНИЙ ХӨНГӨЛӨЛТ -----
async function fitPlans(my){
  const [plans, cfg] = await Promise.all([sb.from("fit_plans").select("*"), sb.from("fit_config").select("*").eq("id", 1).maybeSingle()]);
  const P = must(plans), C = must(cfg) || { member_disc: 5, vip_disc: 10 };
  if (my !== VIEW) return;
  const cell = (t, m) => { const x = P.find(p => p.tier === t && p.months === m); return `<input type="number" min="0" step="1000" data-pp="${t}:${m}" value="${x && x.active ? x.price : ""}" placeholder="—" style="max-width:120px">`; };
  $("fbody").innerHTML = `<form class="form" id="fplf"><h3 class="full" style="margin:0">Гишүүнчлэлийн үнэ (₮)</h3>
    <p class="full mut" style="margin:0;font-size:12.5px">Хоосон үлдээсэн хугацаа сайтад харагдахгүй. Нийт үнийг бичнэ (жишээ нь 3 сар = 54000).</p>
    <div class="full tbl"><table style="min-width:0"><thead><tr><th>Багц</th><th>1 сар</th><th>3 сар</th><th>6 сар</th><th>12 сар</th></tr></thead><tbody>
      <tr><td><b>Гишүүн</b></td>${[1, 3, 6, 12].map(m => `<td>${cell("member", m)}</td>`).join("")}</tr>
      <tr><td><b>VIP</b></td>${[1, 3, 6, 12].map(m => `<td>${cell("vip", m)}</td>`).join("")}</tr></tbody></table></div>
    <h3 class="full" style="margin:8px 0 0">Дэлгүүрийн хөнгөлөлт (%)</h3>
    ${ff("fc-m", "Гишүүн", C.member_disc, "number", 'min="0" max="50"')}${ff("fc-v", "VIP", C.vip_disc, "number", 'min="0" max="50"')}
    <div class="full"><button class="btn dark" type="submit" id="fplsave">Хадгалах</button></div></form>`;
  $("fplf").onsubmit = async e => {
    e.preventDefault();
    const b = $("fplsave"); fbusy(b, true);
    try {
      for (const inp of document.querySelectorAll("[data-pp]")) {
        const [tier, m] = inp.dataset.pp.split(":"), price = Number(inp.value), months = Number(m);
        const ex = P.find(p => p.tier === tier && p.months === months);
        if (price > 0) must(ex ? await sb.from("fit_plans").update({ price, active: true }).eq("id", ex.id) : await sb.from("fit_plans").insert({ tier, months, price, active: true }));
        else if (ex && ex.active) must(await sb.from("fit_plans").update({ active: false }).eq("id", ex.id));
      }
      must(await sb.from("fit_config").update({ member_disc: Number(fv("fc-m")) || 0, vip_disc: Number(fv("fc-v")) || 0 }).eq("id", 1));
      toast("Хадгаллаа"); showFit("plans");
    } catch (err) { fbusy(b, false); toast("Алдаа: " + err.message); }
  };
}

// ----- 4) ГИШҮҮД (жагсаалт, гараар олгох/сунгах, төлбөрүүд) -----
async function fitMembers(my){
  const [mem, pays] = await Promise.all([
    sb.from("fit_members").select("*").order("until", { ascending: false }).limit(500),
    sb.from("fit_payments").select("*").order("created_at", { ascending: false }).limit(30)
  ]);
  const M = must(mem), PY = must(pays);
  const ids = [...new Set([...M.map(m => m.user_id), ...PY.map(p => p.user_id)])];
  const prof = ids.length ? must(await sb.from("profiles").select("id,username,email").in("id", ids)) : [];
  if (my !== VIEW) return;
  const nm = id => { const p = prof.find(x => x.id === id); return p ? p.username : "?"; };
  const now = Date.now(), act = M.filter(m => new Date(m.until) > now);
  $("fbody").innerHTML = `<form class="form" id="fmf"><h3 class="full" style="margin:0">Гишүүнчлэл олгох / сунгах (гараар)</h3>
      ${ff("fm-u", "Хэрэглэгчийн нэвтрэх нэр", "", "text", 'required')}${fsel("fm-t", "Багц", "member", [["member", "Гишүүн"], ["vip", "VIP"]])}
      ${ff("fm-m", "Хэдэн сар", 1, "number", 'min="1" max="36"')}${ff("fm-note", "Тэмдэглэл (жишээ: бэлэг, бэлнээр төлсөн)", "", "text")}
      <div class="full"><button class="btn dark" type="submit" id="fmsave">Олгох</button></div></form>
    <div class="bar"><h3 style="margin:0">Гишүүд <small class="mut">(идэвхтэй ${act.length} / нийт ${M.length})</small></h3></div>
    <div class="tbl"><table><thead><tr><th>Хэрэглэгч</th><th>Багц</th><th>Хүртэл</th><th>Тэмдэглэл</th><th></th></tr></thead><tbody>
      ${M.map(m => `<tr><td><b>${esc(nm(m.user_id))}</b></td><td>${m.tier === "vip" ? "VIP" : "Гишүүн"}</td><td>${dt(m.until)} ${new Date(m.until) > now ? '<span class="tag ok">идэвхтэй</span>' : '<span class="tag no">дууссан</span>'}</td>
        <td><small>${esc(m.note || "")}</small></td><td>${new Date(m.until) > now ? `<button class="btn red" data-fmend="${m.user_id}">Зогсоох</button>` : ""}</td></tr>`).join("") || '<tr><td colspan="5">Гишүүн алга.</td></tr>'}</tbody></table></div>
    <div class="bar" style="margin-top:20px"><h3 style="margin:0">Сүүлийн төлбөрүүд</h3></div>
    <div class="tbl"><table><thead><tr><th>Код</th><th>Хэрэглэгч</th><th>Юу</th><th>Дүн</th><th>Төлөв</th></tr></thead><tbody>
      ${PY.map(p => `<tr><td><code>${esc(p.code)}</code><small>${dt(p.created_at)}</small></td><td>${esc(nm(p.user_id))}</td><td>${p.kind === "member" ? (p.tier === "vip" ? "VIP" : "Гишүүн") + " · " + p.months + " сар" : "Сорилт"}</td><td>${fmt(p.amount)}</td>
        <td>${p.status === "paid" ? '<span class="tag ok">Төлсөн</span>' : p.status === "pending" ? '<span class="tag">Хүлээгдэж байна</span>' : '<span class="tag no">Цуцалсан</span>'}</td></tr>`).join("") || '<tr><td colspan="5">Төлбөр алга.</td></tr>'}</tbody></table></div>`;
  // Гараар олгох: одоогийн хугацааны араас нэмнэ
  $("fmf").onsubmit = async e => {
    e.preventDefault();
    const b = $("fmsave"); fbusy(b, true);
    try {
      const u = must(await sb.from("profiles").select("id,username").eq("username", fv("fm-u").toLowerCase()).maybeSingle());
      if (!u) throw new Error("ийм нэртэй хэрэглэгч алга");
      const cur = M.find(m => m.user_id === u.id), base = cur && new Date(cur.until) > now ? new Date(cur.until) : new Date();
      base.setMonth(base.getMonth() + (Number(fv("fm-m")) || 1));
      if (!confirm(`«${u.username}»-д ${$("fm-t").value === "vip" ? "VIP" : "Гишүүн"} эрх ${dt(base)} хүртэл олгох уу?`)) { fbusy(b, false); return; }
      must(await sb.from("fit_members").upsert({ user_id: u.id, tier: $("fm-t").value, until: base.toISOString(), updated_at: new Date().toISOString(), note: fv("fm-note") || null }));
      toast("Олголоо"); showFit("mem");
    } catch (err) { fbusy(b, false); toast("Алдаа: " + err.message); }
  };
  // Гишүүнчлэлийг зогсоох (хугацааг одоо болгоно)
  $("fbody").querySelectorAll("[data-fmend]").forEach(b => b.onclick = async () => {
    if (!confirm(`«${nm(b.dataset.fmend)}»-ийн гишүүнчлэлийг одоо зогсоох уу?`)) return;
    const r = await sb.from("fit_members").update({ until: new Date().toISOString(), updated_at: new Date().toISOString() }).eq("user_id", b.dataset.fmend);
    if (r.error) return toast("Алдаа: " + r.error.message); toast("Зогсоолоо"); showFit("mem");
  });
}

    <div class="full row">${ff("fnw-pin", "Онцлох (хамгийн дээр нь гарна)", n.pinned, "check")}${ff("fnw-pub", "Нийтлэх (арилгавал ноорог болж нуугдана)", n.published, "check")}</div>

      ${isNew ? "" : `<a class="btn" href="/fit#news/${n.id}" target="_blank" rel="noopener">Сайтад харах ↗</a><button class="btn red" type="button" id="fnwdel" style="margin-left:auto">Устгах</button>`}</div></form>`;

  $("fnw-clr").onclick = () => { image = ""; $("fnw-img").style.display = "none"; $("fnw-clr").hidden = true; };
  $("fnwx").onclick = () => { $("fform").innerHTML = ""; };
  $("fnwf").onsubmit = async e => {
    e.preventDefault();
    const row = { title: fv("fnw-t"), body: $("fnw-b").value.trim(), image: image || null, pinned: $("fnw-pin").checked, published: $("fnw-pub").checked, updated_at: new Date().toISOString() };
    const b = $("fnwsave"); fbusy(b, true);
    try {
      must(isNew ? await sb.from("fit_news").insert(row).select("id") : await sb.from("fit_news").update(row).eq("id", n.id).select("id"));
      toast("Хадгаллаа"); $("fform").innerHTML = ""; showFit("news");

  };
  $("fform").scrollIntoView({ behavior: "smooth" });
}

const FCAT = { "Ахиц": "", "Асуулт": "", "Мэдэгдэл": "ok" };
async function fitCommunity(my){
  const [po, co] = await Promise.all([
    sb.from("fit_posts").select("id,username,cat,body,photo,hidden,created_at").order("created_at", { ascending: false }).limit(100),
    sb.from("fit_comments").select("id,post_id,username,body,hidden,created_at").order("created_at", { ascending: false }).limit(100)
  ]);
  const P = must(po), C = must(co);
  if (my !== VIEW) return;
  // Нийтлэлийн мөр: нуух/гаргах, устгах товчтой
  const prow = p => `<tr class="${p.hidden ? "hid" : ""}"><td><b>${esc(p.username)}</b><small>${dt(p.created_at)}</small></td>
    <td><span class="tag ${FCAT[p.cat] || ""}">${esc(p.cat)}</span></td>

      <button class="btn red" data-pd="${p.id}">Устгах</button></td></tr>`;
  // Сэтгэгдлийн мөр
  const crow = c => `<tr class="${c.hidden ? "hid" : ""}"><td><b>${esc(c.username)}</b><small>${dt(c.created_at)}</small></td>
    <td style="max-width:420px;white-space:pre-wrap">${esc(c.body)}</td><td><small>#${c.post_id}</small></td>
    <td style="white-space:nowrap"><button class="btn" data-ch="${c.id}" data-v="${c.hidden ? 0 : 1}">${c.hidden ? "Гаргах" : "Нуух"}</button>
      <button class="btn red" data-cd="${c.id}">Устгах</button></td></tr>`;
  $("fbody").innerHTML = `<form class="form" id="fnf"><h3 class="full" style="margin:0">📣 Гишүүдэд мэдэгдэл нийтлэх</h3>
      ${ff("fn-b", "Мэдэгдлийн бичиг (жишээ: Пүрэв гаригт 20:00-д шууд дасгал)", "", "textarea", 'maxlength="2000" required')}
      <div class="full"><button class="btn dark" type="submit" id="fnsave">Нийтлэх</button></div></form>
    <div class="bar"><h3 style="margin:0">Нийтлэлүүд <small class="mut">(сүүлийн ${P.length})</small></h3></div>
    <div class="tbl"><table><thead><tr><th>Хэн</th><th>Ангилал</th><th>Бичиг</th><th></th></tr></thead><tbody>
      ${P.map(prow).join("") || '<tr><td colspan="4">Нийтлэл алга.</td></tr>'}</tbody></table></div>
    <div class="bar" style="margin-top:20px"><h3 style="margin:0">Сэтгэгдлүүд <small class="mut">(сүүлийн ${C.length})</small></h3></div>
    <div class="tbl"><table><thead><tr><th>Хэн</th><th>Бичиг</th><th>Нийтлэл</th><th></th></tr></thead><tbody>
      ${C.map(crow).join("") || '<tr><td colspan="4">Сэтгэгдэл алга.</td></tr>'}</tbody></table></div>`;
  // Мэдэгдэл нийтлэх
  $("fnf").onsubmit = async e => {
    e.preventDefault();
    const b = $("fnsave"); fbusy(b, true);
    try { must(await sb.from("fit_posts").insert({ cat: "Мэдэгдэл", body: fv("fn-b") })); toast("Нийтэллээ"); showFit("comm"); }
    catch (err) { fbusy(b, false); toast("Алдаа: " + err.message + (/row-level|policy/i.test(err.message) ? " — finn-fit-admin.sql ажиллуулсан уу?" : "")); }
  };
  // Нуух / гаргах, устгах (нийтлэл ба сэтгэгдэл ижил арга)
  const act = (sel, table, kind) => $("fbody").querySelectorAll(sel).forEach(b => b.onclick = async () => {
    const id = b.dataset.ph || b.dataset.pd || b.dataset.ch || b.dataset.cd;
    let r;
    if (kind === "hide") r = await sb.from(table).update({ hidden: b.dataset.v === "1" }).eq("id", id).select("id");
    else { if (!confirm("Бүр мөсөн устгах уу? Буцаах боломжгүй.")) return; r = await sb.from(table).delete().eq("id", id).select("id"); }
    if (r.error) return toast("Алдаа: " + r.error.message);
    if (!r.data || !r.data.length) return toast("Өөрчлөгдсөнгүй (эрх шалгана уу)");
    toast(kind === "hide" ? (b.dataset.v === "1" ? "Нуулаа" : "Гаргалаа") : "Устгалаа"); showFit("comm");
  });
  act("[data-ph]", "fit_posts", "hide"); act("[data-pd]", "fit_posts", "del");
  act("[data-ch]", "fit_comments", "hide"); act("[data-cd]", "fit_comments", "del");
}

// ===== АДМИНЫ МЭДЭГДЭЛ 🔔 =====
let AN_LAST = -1;
const ago = s => { const m = Math.round((Date.now() - new Date(s)) / 60000); return m < 1 ? "дөнгөж сая" : m < 60 ? m + " мин" : m < 1440 ? Math.round(m / 60) + " цаг" : dt(s); };
const NICON = { review: "⭐", message: "💬", order: "📦", info: "🔔" };
// Уншаагүй мэдэгдэл ба хариулаагүй мессежийн тоог шалгана
let ADMIN_UID = "", AN_UNREAD = [];
// Таб дээр улаан тоо тавина (0 бол нууна)
function tabBadge(t, n){
  const tab = document.querySelector(`[data-t="${t}"]`); if (!tab) return;
  let dot = tab.querySelector(".rq"); if (!dot) { dot = document.createElement("b"); dot.className = "rq"; tab.appendChild(dot); }

// Энэ хөтөч дээр өөр (админ биш) бүртгэлээр нэвтэрсэн эсэхийг шалгана.
// Сайт ба админ нэг нэвтрэлт хуваалцдаг тул сайт дээр хэрэглэгчээр нэвтэрвэл админ хэсэг юу ч харахгүй болдог.
async function sameAdmin(){
  let uid = "";
  try { const { data } = await sb.auth.getSession(); uid = data && data.session && data.session.user ? data.session.user.id : ""; } catch (e) {}
  const ok = !!uid && uid === ADMIN_UID;
  $("swacc").hidden = ok;
  return ok;
}
// Уншаагүй мэдэгдэл ба хариулаагүй мессежийн тоог шалгана; табууд дээр тоо тавина
async function pollAdmin(){
  try {
    if (!(await sameAdmin())) return;
    const [{ data: ns, error }, { data: th }] = await Promise.all([
      sb.from("notifications").select("id,title,link").eq("to_admin", true).eq("read", false).order("created_at", { ascending: false }).limit(99),
      sb.from("msg_threads").select("id,admin_unread,last_at").order("last_at", { ascending: false }).limit(300)]);
    // SQL ажиллаагүй бол хонх дээр "!" гаргана
    if (error) { $("abellN").textContent = "!"; $("abellN").hidden = false; return; }
    AN_UNREAD = ns || [];
    const n = AN_UNREAD.length, m = (th || []).filter(t => t.admin_unread > 0).length;
    $("abellN").textContent = n > 98 ? "99+" : n; $("abellN").hidden = !n;
    // Табууд дээр: шинэ захиалга, шинэ сэтгэгдэл (уншаагүй мэдэгдлээр), хариулаагүй мессеж
    tabBadge("orders", AN_UNREAD.filter(x => x.link === "orders").length);
    tabBadge("reviews", AN_UNREAD.filter(x => x.link === "reviews").length);
    tabBadge("inbox", m);
    document.title = (n ? `(${n}) ` : "") + document.title.replace(/^\(\d+\+?\) /, "");
    // Шинэ мэдэгдэл ирсэн бол дуудлага + нээлттэй жагсаалтыг шинэчилнэ
    if (AN_LAST >= 0 && n > AN_LAST && AN_UNREAD[0]) {
      toast("🔔 " + AN_UNREAD[0].title); $("abell").classList.remove("ring"); void $("abell").offsetWidth; $("abell").classList.add("ring");
      refreshOpenView();
    }
    AN_LAST = n;
  } catch (e) {}
}

    P.hidden = true;
    const m = /^msg:(\d+)$/.exec(x.link || "");
    const go = t => { const tb = document.querySelector(`[data-t="${t}"]`); if (tb.dataset.g !== MODE) setMode(tb.dataset.g, false); $("tabs").querySelectorAll("button").forEach(z => z.setAttribute("aria-pressed", z === tb)); };
    if (m) { go("inbox"); showInbox("all", +m[1]); }
    else if (x.link === "reviews" || x.link === "orders") document.querySelector(`[data-t="${x.link}"]`).click();
  });
}

// ===== АДМИНУУДЫН НЭР: хэн хариулсныг харуулахад =====
let ADMINS = null;
async function loadAdmins(){
  if (ADMINS) return ADMINS;
  const { data } = await sb.from("profiles").select("id,username").eq("role", "admin");
  ADMINS = {}; (data || []).forEach(a => ADMINS[a.id] = a.username);
  return ADMINS;
}
// uuid → админы нэр (олдохгүй бол "админ")
const aname = id => (ADMINS && ADMINS[id]) || "админ";
// "Хэн хариулсан" шүүлтүүр (бүх админ / тодорхой админ)
const whoSel = (cur, id) => `<label class="whof">✍ Хариулсан<select id="${id}"><option value="">Бүх админ</option>${Object.entries(ADMINS || {}).map(([k, v]) => `<option value="${esc(k)}" ${cur === k ? "selected" : ""}>${esc(v)}</option>`).join("")}</select></label>`;

// ===== МЕССЕЖ: хэрэглэгчийн санал хүсэлт, асуулт — имэйл шиг ирсэн / илгээсэн =====
const MKIND = { feedback: "Санал хүсэлт", question: "Асуулт", order: "Захиалга", other: "Бусад" };
let IB_F = "all", IB_WHO = "";
// f: шүүлтүүр, openId: шууд задлах харилцаа
async function showInbox(f, openId){
  if (f) IB_F = f;
  const my = ++VIEW;
  const [{ data: list, error }] = await Promise.all([sb.from("msg_threads").select("*").order("last_at", { ascending: false }).limit(300), loadAdmins()]);
  if (my !== VIEW) return;
  if (error) { $("main").innerHTML = `<p class="msg">Мессеж ажиллахгүй байна: ${esc(error.message)}<br>Supabase-д <b>finn-inbox.sql</b>-ийг ажиллуулна уу.</p>`; return; }
  // Шүүлтүүр: Бүгд · Ирсэн (хэрэглэгчээс, хариу хүлээж буй) · Илгээсэн (FINN хариулсан) · Хаасан
  const F = { all: t => true, in: t => t.last_from === "user" && !t.closed, out: t => t.last_from === "admin" && !t.closed, closed: t => t.closed };
  // Сүүлд хариулсан админаар шүүнэ
  const rows = list.filter(F[IB_F]).filter(t => !IB_WHO || (t.last_from === "admin" && t.last_by === IB_WHO));
  const unread = list.filter(t => t.admin_unread > 0).length;
  const st = t => t.closed ? ["off", "Хаасан"] : t.admin_unread ? ["wait", `${t.admin_unread} шинэ`] : t.last_from === "user" ? ["wait", "Хариулаагүй"] : ["ok", "Хариулсан"];
  $("main").innerHTML = `<div class="bar"><h2>Мессеж <small class="mut">(${list.length})</small></h2><button class="btn dark" type="button" id="ibNew">✏️ Шинэ мессеж</button></div>
    <div id="ibComp"></div>
    <div class="ibar">${[["all", "Бүгд", list.length], ["in", "Ирсэн", list.filter(F.in).length], ["out", "Илгээсэн", list.filter(F.out).length], ["closed", "Хаасан", list.filter(F.closed).length]]
      .map(([k, l, c]) => `<button type="button" data-f="${k}" aria-pressed="${IB_F === k}">${l} <small>${c}</small></button>`).join("")}${whoSel(IB_WHO, "ibWho")}</div>
    <div class="olist" id="ibl">${rows.length ? `<p class="mut ocount">${rows.length} харилцаа · дарж уншина${unread ? ` · <b>${unread}</b> уншаагүй` : ""}</p>` : ""}${rows.map(t => { const [tn, tl] = st(t); return `<details class="ord ib ${tn} ${t.admin_unread ? "unr" : ""}" data-row data-th="${t.id}">
      <summary><span class="oc">${selBox(t.id)}<b>${esc(t.username)}</b><small>${ago(t.last_at)}</small></span>
        <span class="on">${esc(t.subject)}<small>${t.last_from === "admin" ? `<em class="who">${esc(t.last_by ? aname(t.last_by) : "FINN")}</em> ` : ""}${esc(t.last_text)}</small></span>
        <span class="ot"><span class="tag">${esc(MKIND[t.kind] || "")}</span></span>
        <span class="os"><i></i>${tl}</span><span class="ochev" aria-hidden="true">›</span></summary>
      <div class="obody ibb"><p class="mut">Уншиж байна…</p></div></details>`; }).join("") || '<p class="msg">Энд мессеж алга.</p>'}</div>`;
  $("main").querySelectorAll("[data-f]").forEach(b => b.onclick = () => showInbox(b.dataset.f));
  $("ibWho").onchange = e => { IB_WHO = e.target.value; showInbox(); };
  $("ibNew").onclick = () => ibCompose();
  // Задлахад харилцааг ачаалж, уншсан болгоно; бусдыг хураана
  $("ibl").querySelectorAll("details.ib").forEach(d => d.ontoggle = () => {
    if (!d.open) return;
    $("ibl").querySelectorAll("details.ib[open]").forEach(x => x !== d && (x.open = false));
    ibThread(d, list.find(t => t.id === +d.dataset.th));
  });
  // Олноор сонгож устгах
  if (rows.length) bulkSel($("ibl"), { what: "харилцаа", done: () => showInbox(),
    delOne: async id => { const { data, error } = await sb.from("msg_threads").delete().eq("id", +id).select("id"); if (error || !data || !data.length) throw new Error("fail"); } });
  if (openId) { const d = $("ibl").querySelector(`details[data-th="${openId}"]`); if (d) { d.open = true; d.scrollIntoView({ block: "start" }); } else if (IB_F !== "all") showInbox("all", openId); }
}
// Нэг харилцааны мессежүүд (чат хэлбэр) + хариу бичих, хаах, устгах
async function ibThread(d, t){
  const box = d.querySelector(".ibb");
  let { data: items, error } = await sb.from("msg_items").select("id,from_admin,author,author_name,body,created_at,edited_at,edited_by").eq("thread_id", t.id).order("created_at", { ascending: true }).limit(300);
  // finn-inbox2.sql ажиллаагүй бол хуучин багануудаар уншина
  if (error) ({ data: items } = await sb.from("msg_items").select("id,from_admin,author,author_name,body,created_at").eq("thread_id", t.id).order("created_at", { ascending: true }).limit(300));
  if (t.admin_unread) { sb.rpc("msg_read", { p_thread: t.id }).then(pollAdmin); t.admin_unread = 0; d.classList.remove("unr"); }
  // Засах эрх: өөрийн мессеж, эсвэл супер админ бол бүх админы мессеж
  const canEdit = m => m.from_admin && "edited_at" in m && (m.author === ADMIN_UID || ME_SUPER);
  box.innerHTML = `<div class="ithead"><b>${esc(t.subject)}</b><span class="mut">${esc(t.username)} · ${esc(MKIND[t.kind] || "")}${t.order_code ? ` · 📦 ${esc(t.order_code)}` : ""} · эхэлсэн ${dt(t.created_at)}</span></div>
    <div class="ichat">${(items || []).map(m => `<div class="bub ${m.from_admin ? "me" : "fn"}" data-mi="${m.id}">
      <!-- Админы мессеж: "FINN · нэр" (хэрэглэгчид зөвхөн FINN гэж харагдана) -->
      <b>${m.from_admin ? `FINN · ${esc(aname(m.author))}` : esc(m.author_name)}</b><p>${esc(m.body)}</p>
      <small>${dt(m.created_at)}${m.edited_at ? ` · засварласан${m.edited_by && m.edited_by !== m.author ? ` (${esc(aname(m.edited_by))})` : ""}` : ""}${canEdit(m) ? ` · <button type="button" class="bedit" data-ed="${m.id}">✏️ Засах</button>` : ""}</small></div>`).join("") || '<p class="mut">Мессеж алга.</p>'}</div>
    <div class="oact"><label style="flex:1 1 100%">Хариу бичих<textarea data-ib rows="2" maxlength="3000" placeholder="Хэрэглэгчид илгээх хариу (🔔 мэдэгдэл очно)"></textarea></label>
      <button type="button" class="btn dark" data-ibs>Илгээх</button>
      <button type="button" class="btn" data-ibc>${t.closed ? "↩ Дахин нээх" : "✓ Хаах"}</button>
      <button type="button" class="btn del" data-ibd>🗑 Устгах</button></div>`;
  // ✏️ Засах: мессежийн бичгийг талбар болгоод хадгална
  box.querySelectorAll("[data-ed]").forEach(btn => btn.onclick = () => {
    const m = items.find(x => x.id === +btn.dataset.ed), bub = box.querySelector(`[data-mi="${m.id}"]`);
    bub.classList.add("editing");
    bub.querySelector("p").outerHTML = `<textarea class="edta" rows="3" maxlength="3000">${esc(m.body)}</textarea><span class="edbt"><button type="button" class="btn" data-sv>Хадгалах</button><button type="button" class="btn" data-cx>Болих</button><button type="button" class="btn edel" data-dl>🗑 Устгах</button></span>`;
    bub.querySelector("small").hidden = true;
    const ta2 = bub.querySelector(".edta"); ta2.focus(); fitTA(ta2);
    bub.querySelector("[data-cx]").onclick = () => ibThread(d, t);
    // 🗑 Энэ нэг мессежийг устгах (андуурч дарахаас сэргийлж 2 удаа дарна)
    bub.querySelector("[data-dl]").onclick = async e => { const b = e.target;
      if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "Дахин дар"; return setTimeout(() => { if (b.isConnected) { b.dataset.sure = ""; b.textContent = "🗑 Устгах"; } }, 3000); }
      b.disabled = true;
      const { error } = await sb.rpc("msg_delete", { p_item: m.id });
      if (error) { b.disabled = false; return toast(/not allowed/.test(error.message) ? "Зөвхөн өөрийнхөө мессежийг устгана" : /msg_delete/.test(error.message) ? "finn-inbox2.sql-ийг дахин ажиллуулна уу" : "Алдаа: " + error.message); }
      toast("Мессежийг устгалаа"); ibThread(d, t);
    };
    bub.querySelector("[data-sv]").onclick = async e => {
      const v = ta2.value.trim(); if (!v) return ta2.focus();
      if (v === m.body) return ibThread(d, t);
      e.target.disabled = true; e.target.textContent = "Хадгалж байна…";
      const { error } = await sb.rpc("msg_edit", { p_item: m.id, p_body: v });
      if (error) { e.target.disabled = false; e.target.textContent = "Хадгалах"; return toast(/not allowed/.test(error.message) ? "Зөвхөн өөрийнхөө мессежийг засна" : "Алдаа: " + error.message); }
      toast("✓ Засварлалаа"); ibThread(d, t);
    };
  });
  const ta = box.querySelector("[data-ib]");
  box.querySelector("[data-ibs]").onclick = async e => {
    const v = ta.value.trim(); if (!v) return ta.focus();
    e.target.disabled = true; e.target.textContent = "Илгээж байна…";
    const { error } = await sb.rpc("msg_send", { p_thread: t.id, p_body: v });
    if (error) { e.target.disabled = false; e.target.textContent = "Илгээх"; return toast("Алдаа: " + error.message); }
    toast("✓ Илгээлээ · хэрэглэгчид мэдэгдэл очлоо"); showInbox(null, t.id);
  };
  box.querySelector("[data-ibc]").onclick = async () => {
    const { error } = await sb.from("msg_threads").update({ closed: !t.closed }).eq("id", t.id);
    if (error) return toast("Алдаа: " + error.message); toast(t.closed ? "Дахин нээлээ" : "Хаалаа"); showInbox();
  };
  // Устгах (2 удаа дарна)
  box.querySelector("[data-ibd]").onclick = async e => { const b = e.target;
    if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "Дахин дар"; return setTimeout(() => { if (b.isConnected) { b.dataset.sure = ""; b.textContent = "🗑 Устгах"; } }, 3000); }
    const { error } = await sb.from("msg_threads").delete().eq("id", t.id);
    if (error) return toast("Алдаа: " + error.message); toast("Устгалаа"); showInbox();
  };
}
// Админ хэрэглэгч рүү шинэ мессеж бичих (нэрээр хайж сонгоно)
async function ibCompose(){
  const C = $("ibComp"); if (C.innerHTML) { C.innerHTML = ""; return; }
  const { data: us } = await sb.from("profiles").select("id,username").order("username").limit(2000);
  const users = us || [];
  C.innerHTML = `<div class="ibcomp"><b>✏️ Хэрэглэгч рүү мессеж</b>
    <label>Хэнд (нэвтрэх нэр)<input id="ibTo" list="ibUsers" placeholder="нэрээ бичиж сонгоно" autocomplete="off"><datalist id="ibUsers">${users.map(u => `<option value="${esc(u.username)}">`).join("")}</datalist></label>
    <label>Гарчиг<input id="ibSub" maxlength="120" placeholder="жишээ: Таны захиалгын талаар"></label>
    <label>Мессеж<textarea id="ibTxt" rows="3" maxlength="3000"></textarea></label>
    <div style="display:flex;gap:8px"><button type="button" class="btn dark" id="ibSend">Илгээх</button><button type="button" class="btn" id="ibX">Болих</button></div></div>`;
  $("ibX").onclick = () => C.innerHTML = "";
  $("ibSend").onclick = async () => {
    const u = users.find(x => x.username === $("ibTo").value.trim().toLowerCase()), v = $("ibTxt").value.trim();
    if (!u) return toast("Хэрэглэгчийн нэр олдсонгүй"); if (!v) return toast("Мессежээ бичнэ үү");
    const { data, error } = await sb.rpc("msg_send", { p_thread: null, p_body: v, p_subject: $("ibSub").value.trim() || "FINN-ээс", p_kind: "other", p_to: u.id });
    if (error) return toast("Алдаа: " + error.message);
    toast("✓ " + u.username + "-д илгээлээ"); showInbox("all", data);
  };
}

// Таб солих
const TABS = { orders: () => showOrders(""), users: showUsers, products: () => showProducts(), settings: showSettings, reviews: showReviews, inbox: () => showInbox(), history: () => showHistory() };
// Fit табууд: "f-prog" → showFit("prog") гэх мэт
FIT_SUB.forEach(([k]) => TABS["f-" + k] = () => showFit(k));
$("tabs").addEventListener("click", e => { const b = e.target.closest("[data-t]"); if (!b) return;
  // Нөгөө бүлгийн таб дарагдвал (жишээ нь "Харах" товчоор) горимыг нь солино
  if (b.dataset.g !== MODE) setMode(b.dataset.g, false);
  $("tabs").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); const my = VIEW + 1; TABS[b.dataset.t]().catch(err => { if (VIEW === my) $("main").innerHTML = `<p class="msg">Алдаа: ${esc(err.message)}</p>`; }); });

// ===== SHOP | FIT горим: дээд мөрөнд зөвхөн тухайн хэсгийн табууд харагдана =====
let MODE = "shop";
// Сүүлд сонгосон горимыг санана (дараа нээхэд тэр хэсэг нь гарна)
try { if (localStorage.getItem("finn-admin-mode") === "fit") MODE = "fit"; } catch (e) {}
// Хаяг нь admin.html#fit эсвэл #shop бол түүнийг дагана
if (location.hash === "#fit") MODE = "fit"; else if (location.hash === "#shop") MODE = "shop";
// m: "shop" | "fit"; go=true бол тухайн хэсгийн эхний табыг нээнэ
function setMode(m, go = true){
  MODE = m === "fit" ? "fit" : "shop";
  try { localStorage.setItem("finn-admin-mode", MODE); } catch (e) {}
  $("asw").querySelectorAll("[data-m]").forEach(x => x.setAttribute("aria-pressed", x.dataset.m === MODE));
  $("tabs").querySelectorAll("[data-g]").forEach(x => x.hidden = x.dataset.g !== MODE);
  // Хажуу тийш гүйлгэсэн табуудыг эхлэл рүү нь буцаана
  $("tabs").scrollLeft = 0;
  if (go) { const f = $("tabs").querySelector(`[data-g="${MODE}"]`); if (f) f.click(); }
}
$("asw").addEventListener("click", e => { const b = e.target.closest("[data-m]"); if (b && b.dataset.m !== MODE) setMode(b.dataset.m); });

// Эхлүүлэх: нэвтэрсэн, админ эсэхийг шалгана
(async () => {
  try {
    const c = await (await fetch("/api/config")).json();
    if (!c.supabaseUrl) throw new Error("Supabase тохируулаагүй байна.");
    SB_BASE = c.supabaseUrl.replace(/\/$/, "");
    sb = window.supabase.createClient(c.supabaseUrl, c.supabaseAnon);
    const { data } = await sb.auth.getUser();
    if (!data.user) { $("main").innerHTML = `<p class="msg">Эхлээд <a href="/">сайт дээрээ</a> админ бүртгэлээрээ нэвтэрнэ үү.</p>`; return; }
    const { data: p } = await sb.from("profiles").select("username,role").eq("id", data.user.id).maybeSingle();
    if (!p || p.role !== "admin") { $("main").innerHTML = `<p class="msg">Танд админ эрх байхгүй байна.</p>`; return; }
    $("whoami").textContent = p.username; $("tabs").hidden = false; $("asw").hidden = false;
    ADMIN_UID = data.user.id;
    // Нэвтрэлт өөрчлөгдвөл (жишээ нь сайт дээр өөр бүртгэлээр орвол) шууд анхааруулна
    sb.auth.onAuthStateChange(() => sameAdmin());
    // Супер админ бол хүлээгдэж буй админ хүсэлтийг шалгаж мэдэгдэнэ (1 минут тутам шинэчилнэ)
    refreshReqBadge(); setInterval(refreshReqBadge, 60000);
    // Мэдэгдэл, мессежийн тоог 45 секунд тутам шалгана
    $("abell").hidden = false; pollAdmin(); setInterval(() => { if (!document.hidden) pollAdmin(); }, 45000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) pollAdmin(); });
    // admin.html#inbox — шууд "Мессеж" таб (сайтаас холбоосоор ирэхэд)
    if (location.hash === "#inbox" || location.hash === "#notif") { setMode("shop", false); document.querySelector('[data-t="inbox"]').click(); if (location.hash === "#notif") setTimeout(openNPanel, 300); }
    // Сүүлд ашигласан хэсгийн (SHOP эсвэл FIT) эхний табыг нээнэ
    else setMode(MODE);
  } catch (e) { $("main").innerHTML = `<p class="msg">${esc(e.message)}</p>`; }
})();

// ===== БИЧИХ ТАЛБАР: агуулгадаа тааруулж өндөр нь өсч бүх бичиг харагдана =====
// Өндрийг агуулгын хэмжээнд тааруулна
function fitTA(t){ if (!t.isConnected) return; t.style.height = "auto"; t.style.height = (t.scrollHeight + 2) + "px"; }
// Бичих бүрт томруулна; нэг мөрт талбарт мөр шилжилтийг хоосон зайгаар солино
document.addEventListener("input", e => { const t = e.target; if (t.tagName !== "TEXTAREA") return;
  if (t.classList.contains("one") && /\n/.test(t.value)) t.value = t.value.replace(/\s*\n\s*/g, " ");
  fitTA(t); }, true);
// Нэг мөрт талбарт Enter дарахад мөр шилжихгүй
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.classList && e.target.classList.contains("one")) e.preventDefault(); }, true);
// Хуудас шинээр зурагдах бүрт бүх талбарын өндрийг тааруулна
new MutationObserver(() => requestAnimationFrame(() => document.querySelectorAll("textarea").forEach(fitTA))).observe(document.documentElement, { childList: true, subtree: true });
addEventListener("resize", () => document.querySelectorAll("textarea").forEach(fitTA));
</script>
