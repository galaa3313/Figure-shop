  // Холбоосын сонголт: холбоосгүй, хэсэг рүү, бараа руу, эсвэл вэб хаяг
  const { data: plist } = await sb.from("products").select("id,name,cat").order("sort", { ascending: false });
  // ----- Ангилал: нэр засах, дараалал, нэмэх, устгах -----
  let cats = Array.isArray(S.cats) && S.cats.length ? S.cats.map(x => ({ ...x })) : Object.entries(CATS).map(([id, label]) => ({ id, label }));
  // Ангилал бүрт хэдэн бараа байгааг тоолно
  const catN = id => (plist || []).filter(x => x.cat === id).length;
  // Нэрнээс латин id үүсгэнэ (кирилл → латин), давхардвал ард нь тэмдэгт нэмнэ
  const CTR = { а:"a",б:"b",в:"v",г:"g",д:"d",е:"e",ё:"yo",ж:"j",з:"z",и:"i",й:"i",к:"k",л:"l",м:"m",н:"n",о:"o",ө:"u",п:"p",р:"r",с:"s",т:"t",у:"u",ү:"u",ф:"f",х:"h",ц:"ts",ч:"ch",ш:"sh",щ:"sh",ы:"y",э:"e",ю:"yu",я:"ya" };
  const catId = v => { let id = String(v).toLowerCase().split("").map(c => CTR[c] ?? c).join("").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 24) || "cat";
    if (id === "all" || id === "drops" || cats.some(x => x.id === id)) id += "-" + Math.random().toString(36).slice(2, 5); return id; };
  const drawCats = () => {
    $("catList").innerHTML = cats.map((x, i) => `<div class="crow"><b>${i + 1}</b><textarea rows="1" class="one" data-cl="${i}" placeholder="Нэр">${esc(x.label)}</textarea><span class="mut">${catN(x.id)} бараа</span>
      <div class="tb"><button type="button" data-cu="${i}" ${i ? "" : "disabled"}>↑</button><button type="button" data-cd="${i}" ${i < cats.length - 1 ? "" : "disabled"}>↓</button><button type="button" data-cx="${i}">×</button></div></div>`).join("");
    // Нэр засах
    $("catList").querySelectorAll("[data-cl]").forEach(el => el.oninput = () => { cats[+el.dataset.cl].label = el.value; });
    // Дээш, доош
    $("catList").querySelectorAll("[data-cu]").forEach(b => b.onclick = () => { const i = +b.dataset.cu; [cats[i - 1], cats[i]] = [cats[i], cats[i - 1]]; drawCats(); });
    $("catList").querySelectorAll("[data-cd]").forEach(b => b.onclick = () => { const i = +b.dataset.cd; [cats[i + 1], cats[i]] = [cats[i], cats[i + 1]]; drawCats(); });
    // Устгах: бараатай бол хориглоно
    $("catList").querySelectorAll("[data-cx]").forEach(b => b.onclick = () => { const i = +b.dataset.cx; const n = catN(cats[i].id);
      if (n) return toast(`"${cats[i].label}" ангилалд ${n} бараа байна — эхлээд шилжүүлнэ үү`); cats.splice(i, 1); drawCats(); });
  };
  drawCats();
  // Шинэ ангилал нэмэх
  $("catAdd").onclick = () => { const v = $("catNew").value.trim(); if (!v) return toast("Ангиллын нэрээ бичнэ үү");
    cats.push({ id: catId(v), label: v }); $("catNew").value = ""; drawCats(); toast("Нэмэгдлээ — Хадгалах дарна уу"); };
  const linkOpts = cur => `<option value="">Холбоосгүй</option><option value="#shop" ${cur === "#shop" ? "selected" : ""}>→ Бүх бараа</option><option value="#drops" ${cur === "#drops" ? "selected" : ""}>→ Шинэ бараа</option>`
    + (plist || []).map(x => `<option value="product:${esc(x.id)}" ${cur === "product:" + x.id ? "selected" : ""}>Бараа: ${esc(x.name)}</option>`).join("")
    + `<option value="url" ${/^https?:/.test(cur || "") ? "selected" : ""}>Вэб хаяг…</option>`;
  const drawPosters = (arr, boxId, key) => {
    // Слайд байгаа эсэхээс хамаарч "Нүүр хэсэг" харагдах эсэхийг бичнэ
    if (key === "s") $("heroState").innerHTML = arr.length ? `⚠ Одоо <b>${arr.length} слайд</b> байгаа тул энэ хэсэг сайтад <b>харагдахгүй</b>. Слайдуудыг устгавал гарна.` : "✓ Слайд байхгүй тул энэ хэсэг сайтад <b>харагдаж байна</b>.";
    if (key === "s") $("heroState").className = "full shint " + (arr.length ? "off" : "on");
    $(boxId).innerHTML = arr.map((x, i) => `<div class="post"><img src="${esc(x.img)}" alt="">
      <div class="pcol">
        <!-- Урамшууллын хуудасны гарчиг, тайлбар (бөглөвөл постер дарахад мэдээллийн хуудас нээгдэнэ) -->
        <textarea rows="1" class="one" data-${key}t="${i}" placeholder="Гарчиг (жишээ: Өвлийн хямдрал 30% хүртэл)">${esc(x.title || "")}</textarea>
        <textarea data-${key}b="${i}" rows="4" placeholder="Тайлбар: нөхцөл, хугацаа, дэлгэрэнгүй мэдээлэл…">${esc(x.body || "")}</textarea>
        <div class="row" style="gap:8px;flex-wrap:wrap"><label class="mut" style="flex:1;min-width:140px">Эхлэх<input type="date" data-${key}s="${i}" value="${esc(x.start || "")}"></label><label class="mut" style="flex:1;min-width:140px">Дуусах<input type="date" data-${key}e="${i}" value="${esc(x.end || "")}"></label></div>
        <label class="mut">Товчны холбоос<select data-${key}l="${i}">${linkOpts(x.link)}</select></label>
        <textarea rows="1" class="one" data-${key}u="${i}" placeholder="https://…" ${/^https?:/.test(x.link || "") ? "" : "hidden"}>${/^https?:/.test(x.link || "") ? esc(x.link) : ""}</textarea>
        <!-- Урамшуулалд хамаарах бараанууд -->
        <details><summary class="mut">Урамшуулалд хамаарах бараа (${(x.products || []).length})</summary>
          <div class="pchk">${(plist || []).map(pr => `<label><input type="checkbox" data-${key}p="${i}" value="${esc(pr.id)}" ${(x.products || []).includes(pr.id) ? "checked" : ""}> ${esc(pr.name)}</label>`).join("")}</div></details>
        <div class="tb"><button type="button" data-${key}up="${i}" ${i ? "" : "disabled"}>↑</button><button type="button" data-${key}dn="${i}" ${i < arr.length - 1 ? "" : "disabled"}>↓</button><button type="button" data-${key}x="${i}">×</button></div></div></div>`).join("") || '<p class="mut">Одоохондоо алга.</p>';
    const q = (a, i) => $(boxId).querySelector(`[data-${key}${a}="${i}"]`);
    arr.forEach((x, i) => {
      // Гарчиг, тайлбар, огноо
      q("t", i).oninput = e => { x.title = e.target.value; };
      q("b", i).oninput = e => { x.body = e.target.value; };
      q("s", i).onchange = e => { x.start = e.target.value; };
      q("e", i).onchange = e => { x.end = e.target.value; };
      // Холбоос сонгох
      q("l", i).onchange = e => { const v = e.target.value; q("u", i).hidden = v !== "url"; x.link = v === "url" ? q("u", i).value.trim() : v; };
      q("u", i).oninput = e => { x.link = e.target.value.trim(); };
      // Хамаарах бараа
      $(boxId).querySelectorAll(`[data-${key}p="${i}"]`).forEach(c => c.onchange = () => { x.products = [...$(boxId).querySelectorAll(`[data-${key}p="${i}"]:checked`)].map(z => z.value); c.closest("details").querySelector("summary").textContent = `Урамшуулалд хамаарах бараа (${x.products.length})`; });
      // Дээш, доош, устгах
      q("up", i).onclick = () => { [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]]; drawPosters(arr, boxId, key); };
      q("dn", i).onclick = () => { [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]]; drawPosters(arr, boxId, key); };
      q("x", i).onclick = () => { arr.splice(i, 1); drawPosters(arr, boxId, key); };
    });
  };
  drawPosters(slides, "slList", "s"); drawPosters(promos, "prList", "p");
  // Зураг оруулах (хэд хэдийг зэрэг)
  const addPosters = (fileId, arr, boxId, key) => $(fileId).onchange = async e => {
    toast("Оруулж байна…");
    for (const f of e.target.files) { try { arr.push({ img: await upload(f, "slides"), link: "" }); } catch (err) { toast("Алдаа: " + err.message); } }
    e.target.value = ""; drawPosters(arr, boxId, key); toast("Орлоо — Хадгалах дарна уу");
  };
  addPosters("slFile", slides, "slList", "s"); addPosters("prFile", promos, "prList", "p");
  drawHow(); drawFaq();
  $("faqAdd").onclick = () => { readLists(); faq.push({ q: "", a: "" }); drawFaq(); };
  $("colReset").onclick = () => { for (const [k, v] of Object.entries(DEF.colors)) $("main").querySelector(`[data-c="${k}"]`).value = v; };
  // Нүүр зураг, лого оруулах
  const imgField = (fileId, prevId, clrId, key, max) => {
    $(fileId).onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      try { toast("Оруулж байна…"); S[key] = await upload(f, "site"); $(prevId).src = S[key]; $(prevId).hidden = false; $(clrId).hidden = false; toast("Зураг орлоо — Хадгалах дарна уу"); }
      catch (err) { toast("Алдаа: " + err.message); }
      e.target.value = "";
    };
    $(clrId).onclick = () => { S[key] = ""; $(prevId).hidden = true; $(clrId).hidden = true; };
  };
  imgField("heroFile", "heroPrev", "heroClr", "heroImage"); imgField("logoFile", "logoPrev", "logoClr", "logoUrl"); imgField("footFile", "footPrev", "footClr", "footerImage");
  // Хадгалах
  $("ssave").onclick = async () => {
    readLists();
    const out = { ...S };
    $("main").querySelectorAll("[data-k]").forEach(el => out[el.dataset.k] = el.value.trim());
    out.colors = {}; $("main").querySelectorAll("[data-c]").forEach(el => out.colors[el.dataset.c] = el.value);
    out.how = how.filter(x => x.t); out.faq = faq.filter(x => x.q && x.a);
    // Facebook-ээр нэвтрэх товч
    out.fbLogin = $("fbOn").checked;
    // Үйлчилгээний 4 мөр
    readPerks(); out.perks = perks.map(x => ({ i: x.i, t: x.t.trim(), d: x.d.trim() })).filter(x => x.t || x.d);
    // Ангилал: нэргүйг хасна
    out.cats = cats.map(x => ({ id: x.id, label: (x.label || "").trim() })).filter(x => x.label);
    if (!out.cats.length) return toast("Дор хаяж нэг ангилал байх ёстой");
    // Слайд ба постерууд
    const clean = x => ({ img: x.img, link: x.link || "", title: (x.title || "").trim(), body: (x.body || "").trim(), start: x.start || "", end: x.end || "", products: x.products || [] });
    out.slides = slides.filter(x => x.img).map(clean); out.promos = promos.filter(x => x.img).map(clean);
    $("ssave").disabled = true;
    const { data: u } = await sb.auth.getUser();
    const { error } = await sb.from("settings").upsert({ id: "site", data: out, updated_at: new Date().toISOString(), updated_by: u && u.user ? u.user.id : null });
    $("ssave").disabled = false;
    if (error) return toast("Алдаа: " + error.message);
    dirty = false; toast("Хадгаллаа · сайтад шууд харагдана"); showSettings();
  };
}

// ===== СЭТГЭГДЭЛ: бүх сэтгэгдэл, хариулах, нуух, устгах =====
async function showReviews(){
  const my = ++VIEW;
  const [{ data: list, error }, { data: prods }] = await Promise.all([
    sb.from("reviews").select("*").order("created_at", { ascending: false }).limit(300),
    sb.from("products").select("id,name")
  ]);
  if (my !== VIEW) return;
  if (error) { $("main").innerHTML = `<p class="msg">Алдаа: ${esc(error.message)}<br>Supabase-д finn-reviews.sql-ийг ажиллуулсан эсэхээ шалгана уу.</p>`; return; }
  const pname = id => ((prods || []).find(x => x.id === id) || {}).name || id;
  const st = r => "★★★★★".slice(0, r) + "☆☆☆☆☆".slice(0, 5 - r);
  $("main").innerHTML = `<div class="bar"><h2>Сэтгэгдэл <small class="mut">(${list.length})</small></h2></div>
    <div class="rvl">${list.map(r => `<div class="rvi ${r.hidden ? "off" : ""}">
      <div class="row" style="justify-content:space-between;flex-wrap:wrap"><div><b>${esc(pname(r.product_id))}</b> · <span style="color:#f5b301">${st(r.rating)}</span> · ${esc(r.username)} ${r.verified ? '<span class="tag ok">Худалдан авсан</span>' : ""} ${r.hidden ? '<span class="tag no">нуусан</span>' : ""}</div><span class="mut">${dt(r.created_at)}</span></div>
      <p style="white-space:pre-line;margin:8px 0">${esc(r.body)}</p>
      ${(r.photos || []).filter(okPhoto).length ? `<div class="thumbs">${r.photos.filter(okPhoto).map(u => `<figure><a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt=""></a></figure>`).join("")}</div>` : ""}
      <div class="row" style="margin-top:8px;align-items:flex-start"><textarea data-rp="${r.id}" rows="2" placeholder="FINN-ий хариулт (заавал биш)" style="flex:1">${esc(r.reply || "")}</textarea>
        <button class="btn" data-save="${r.id}">Хариулт хадгалах</button><button class="btn" data-hide="${r.id}">${r.hidden ? "Харуулах" : "Нуух"}</button><button class="btn red" data-del="${r.id}">Устгах</button></div>
    </div>`).join("") || '<p class="msg">Одоохондоо сэтгэгдэл алга.</p>'}</div>`;
  // Хариулт хадгалах
  $("main").querySelectorAll("[data-save]").forEach(b => b.onclick = async () => {
    const v = $("main").querySelector(`[data-rp="${b.dataset.save}"]`).value.trim();
    const { error } = await sb.from("reviews").update({ reply: v || null }).eq("id", +b.dataset.save);
    toast(error ? "Алдаа: " + error.message : "Хариулт хадгаллаа");
  });
  // Нуух / харуулах
  $("main").querySelectorAll("[data-hide]").forEach(b => b.onclick = async () => {
    const r = list.find(x => x.id === +b.dataset.hide);
    const { error } = await sb.from("reviews").update({ hidden: !r.hidden }).eq("id", r.id);
    if (error) return toast("Алдаа: " + error.message); showReviews();
  });
  // Устгах (2 удаа дарна)
  $("main").querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "Дахин дар"; return setTimeout(() => { if (b.isConnected) { b.dataset.sure = ""; b.textContent = "Устгах"; } }, 3000); }
    const { error } = await sb.from("reviews").delete().eq("id", +b.dataset.del);
    if (error) return toast("Алдаа: " + error.message); toast("Устгалаа"); showReviews();
  });
}

  $("hlist").innerHTML = j.rows.length ? `<div class="hl">${j.rows.map(l => `<div class="he a-${esc(l.action)}">
      <div class="ht">${dt(l.at)}</div>
      <div class="hb"><span class="tag">${ACT[l.action] || esc(l.action)}</span> <b>${ENT[l.entity] || esc(l.entity)}</b> ${l.target && l.entity !== "settings" ? `<code>${esc(l.target)}</code>` : ""}
        <div class="mut">${info(l)}</div></div>
      <div class="hw">👤 ${esc(l.actor || "—")}</div>
      ${l.action === "delete" && (l.entity === "order" || l.entity === "product") ? `<button class="btn" data-rs="${l.id}">Сэргээх</button>`
        // Хувилбар 30 хоног хадгалагдана: түүнээс хуучин бол буцаах товч гаргахгүй
        : l.detail && l.detail.snap && Date.now() - new Date(l.at) < 30 * 864e5 ? `<button class="btn rv" data-rs="${l.id}" title="Энэ засвар хийгдэхээс өмнөх байдал руу буцаана">↶ Өмнөх рүү буцаах</button>` : "<span></span>"}
    </div>`).join("")}</div><p class="mut" style="margin-top:10px">${j.rows.length} бичлэг${j.rows.length >= 500 ? " (эхний 500)" : ""}</p>`
    : `<p class="mut">Энэ хугацаанд бичлэг алга.</p>`;
  // Устгасныг сэргээх
  $("hlist").querySelectorAll("[data-rs]").forEach(b => b.onclick = async () => {
    // Хувилбар руу буцаахаас өмнө нэг удаа баталгаажуулна
    if (b.classList.contains("rv") && !b.dataset.sure) { b.dataset.sure = 1; b.textContent = "⚠ Тийм, буцаах"; b.classList.add("sure"); return; }
    if (b.disabled) return;
    // Ачаалж байгааг харуулна: товч түгжигдэж, эргэлддэг дугуй гарна
    const rv = b.classList.contains("rv");
    b.disabled = true; b.classList.add("busy"); b.innerHTML = `<i class="spin"></i>${rv ? "Буцааж байна…" : "Сэргээж байна…"}`;
    try {
      await api({ action: "restore", id: b.dataset.rs });
      // Амжилттай: ногоон болгож түр харуулаад жагсаалтыг шинэчилнэ
      b.classList.remove("busy", "sure"); b.classList.add("done"); b.innerHTML = "✓ Буцаалаа";
      toast(rv ? "✓ Буцаалаа · дургүй бол дээд мөрийн ↶ товчоор дахин буцаана" : "✓ Сэргээлээ");
      await new Promise(z => setTimeout(z, 700));
      await again();
      // Шинэ мөрийг (хамгийн дээд) түр тодруулна
      const top = document.querySelector("#hlist .he"); if (top) top.classList.add("flash");
    } catch (e) { b.disabled = false; b.classList.remove("busy"); b.innerHTML = rv ? "↶ Өмнөх рүү буцаах" : "Сэргээх"; delete b.dataset.sure; b.classList.remove("sure"); toast("Алдаа: " + e.message); }
  });
}

// ===== СУПЕР АДМИН: админ эрхийн хүсэлтийн мэдэгдэл =====
let ME_SUPER = false;
async function refreshReqBadge(){
  try {
    const w = await api({ action: "whoami" });
    ME_SUPER = w.super;
    if (w.super) $("whoami").textContent = "⭐ " + w.username;
    // "Хэрэглэгч" таб дээр улаан тоо
    const tab = document.querySelector('[data-t="users"]');
    let dot = tab.querySelector(".rq"); if (!dot) { dot = document.createElement("b"); dot.className = "rq"; tab.appendChild(dot); }
    dot.textContent = w.pending || ""; dot.hidden = !w.pending;
    // Дээд талын анхааруулах тууз
    let bn = $("rqban");
    if (w.pending) {
      if (!bn) { bn = document.createElement("div"); bn.id = "rqban"; bn.className = "rqban"; document.querySelector("main, #main").before(bn); }
      bn.innerHTML = `🔔 Танд <b>${w.pending}</b> админ эрхийн хүсэлт зөвшөөрөл хүлээж байна <button class="btn dark" type="button">Харах</button>`;
      bn.querySelector("button").onclick = () => tab.click();
    } else if (bn) bn.remove();
  } catch (e) {}
}

// Таб солих
const TABS = { orders: () => showOrders(""), users: showUsers, products: () => showProducts(), settings: showSettings, reviews: showReviews, history: () => showHistory() };
$("tabs").addEventListener("click", e => { const b = e.target.closest("[data-t]"); if (!b) return; $("tabs").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); const my = VIEW + 1; TABS[b.dataset.t]().catch(err => { if (VIEW === my) $("main").innerHTML = `<p class="msg">Алдаа: ${esc(err.message)}</p>`; }); });

// Эхлүүлэх: нэвтэрсэн, админ эсэхийг шалгана
(async () => {
  try {
    const c = await (await fetch("/api/config")).json();
    if (!c.supabaseUrl) throw new Error("Supabase тохируулаагүй байна.");
    SB_BASE = c.supabaseUrl.replace(/\/$/, "");
    sb = window.supabase.createClient(c.supabaseUrl, c.supabaseAnon);
    const { data } = await sb.auth.getUser();
    if (!data.user) { $("main").innerHTML = `<p class="msg">Эхлээд <a href="/">сайт дээрээ</a> админ бүртгэлээрээ нэвтэрнэ үү.</p>`; return; }
    const { data: p } = await sb.from("profiles").select("username,role").eq("id", data.user.id).maybeSingle();
    if (!p || p.role !== "admin") { $("main").innerHTML = `<p class="msg">Танд админ эрх байхгүй байна.</p>`; return; }
    $("whoami").textContent = p.username; $("tabs").hidden = false;
    // Супер админ бол хүлээгдэж буй админ хүсэлтийг шалгаж мэдэгдэнэ (1 минут тутам шинэчилнэ)
    refreshReqBadge(); setInterval(refreshReqBadge, 60000);
    const first = VIEW + 1;
    await showOrders("").catch(e => { if (VIEW === first) $("main").innerHTML = `<p class="msg">Алдаа: ${esc(e.message)}</p>`; });
  } catch (e) { $("main").innerHTML = `<p class="msg">${esc(e.message)}</p>`; }
})();

// ===== БИЧИХ ТАЛБАР: агуулгадаа тааруулж өндөр нь өсч бүх бичиг харагдана =====
// Өндрийг агуулгын хэмжээнд тааруулна
function fitTA(t){ if (!t.isConnected) return; t.style.height = "auto"; t.style.height = (t.scrollHeight + 2) + "px"; }
// Бичих бүрт томруулна; нэг мөрт талбарт мөр шилжилтийг хоосон зайгаар солино
document.addEventListener("input", e => { const t = e.target; if (t.tagName !== "TEXTAREA") return;
  if (t.classList.contains("one") && /\n/.test(t.value)) t.value = t.value.replace(/\s*\n\s*/g, " ");
  fitTA(t); }, true);
// Нэг мөрт талбарт Enter дарахад мөр шилжихгүй
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.classList && e.target.classList.contains("one")) e.preventDefault(); }, true);
// Хуудас шинээр зурагдах бүрт бүх талбарын өндрийг тааруулна
new MutationObserver(() => requestAnimationFrame(() => document.querySelectorAll("textarea").forEach(fitTA))).observe(document.documentElement, { childList: true, subtree: true });
addEventListener("resize", () => document.querySelectorAll("textarea").forEach(fitTA));
</script>
